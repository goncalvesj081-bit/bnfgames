<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0F">
<meta name="description" content="Paddock - simulador de fundo de investimento em equipes de automobilismo.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Paddock</title>
<link rel="icon" href="./bnf-favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,700;1,900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E13; --bg2:#0D1319; --panel:#111820; --panel2:#161F29; --panel3:#1B2733;
  --line:#1E2A36; --line2:#2A3947; --txt:#E4EBF2; --muted:#75899C; --muted2:#55677A;
  --ac:#FF4D2E; --ac2:#2E120C; --pos:#2FCB86; --pos2:#0F2B20; --gold:#DDB04A; --err:#E2564B; --info:#5C9FEA;
  --disp:'Archivo Black',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --data:'IBM Plex Mono',ui-monospace,monospace;
  --r:3px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--body);font-size:15px}
body{overscroll-behavior:none}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:78px}
.wrap{padding:12px 12px 20px}

/* ---------- cabecalho ---------- */
.hdr{position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--line2)}
.hdr .r1{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line)}
.hdr .brand{font-family:var(--disp);font-size:12px;letter-spacing:.4px;text-transform:uppercase}
.hdr .ctx{font-family:var(--data);font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.hdr .ctx b{color:var(--ac);font-weight:500}
.hdr .r2{padding:9px 12px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hdr .big{font-family:var(--data);font-size:25px;font-weight:600;line-height:1;color:var(--ac);letter-spacing:-.5px}
.hdr .cap{font-family:var(--data);font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted2);margin-top:4px}
.hdr .delta{font-family:var(--data);font-size:11px;text-align:right;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.stats>div{padding:6px 9px;border-right:1px solid var(--line);min-width:0}
.stats>div:last-child{border-right:0}
.stats.c3{grid-template-columns:repeat(3,1fr)}
.stats.c2{grid-template-columns:repeat(2,1fr)}
.stats .dl{display:block;font-family:var(--data);font-size:9.5px;margin-top:2px;color:var(--muted2)}
.stats span{display:block;font-family:var(--data);font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted2)}
.stats b{display:block;font-family:var(--data);font-size:12.5px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- secoes e paineis ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:17px 2px 7px}
.sec:first-child{margin-top:2px}
.sec h4{margin:0;font-family:var(--data);font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.sec em{font-style:normal;font-family:var(--data);font-size:10px;color:var(--muted2);letter-spacing:.5px}
.panel{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);overflow:hidden}
.panel+.panel{margin-top:8px}
.panel>.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;background:var(--panel2);
  border-bottom:1px solid var(--line2);font-family:var(--data);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.panel>.hd b{color:var(--txt);font-weight:500}
.panel>.bd{padding:11px}
.panel>.bd.tight{padding:0}
.empty{padding:22px 14px;text-align:center;font-family:var(--data);font-size:11.5px;color:var(--muted2);letter-spacing:.4px}

h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.2px;text-transform:uppercase;margin:0}
h3{font-size:15px}
.mono{font-family:var(--data)}
.mut{color:var(--muted)}
.ok{color:var(--pos)} .neg{color:var(--err)} .gd{color:var(--gold)}
.msg{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0}
.msg b{color:var(--txt);font-weight:600}
.row{display:flex;align-items:center;gap:8px}

/* ---------- filtros ---------- */
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.filtros.f1{grid-template-columns:1fr}
.fld span{display:block;font-family:var(--data);font-size:8px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted2);margin-bottom:4px}
.fld .sw{position:relative}
.fld .sw:after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;margin-top:-4px;pointer-events:none;
  border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg)}
select,input.txt{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);
  padding:9px 26px 9px 10px;font-family:var(--data);font-size:12.5px;color:var(--txt);outline:none;appearance:none;-webkit-appearance:none}
input.txt{padding:9px 10px;font-size:14px}
select:focus,input.txt:focus{border-color:var(--ac)}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tg{font-family:var(--data);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;padding:6px 10px;
  border:1px solid var(--line2);border-radius:14px;color:var(--muted);background:var(--panel)}
.tg.on{border-color:var(--ac);color:var(--ac);background:var(--ac2)}

/* ---------- tabelas ---------- */
table.tbl{width:100%;border-collapse:collapse;font-family:var(--data);font-variant-numeric:tabular-nums}
.tbl th{font-size:8.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted2);font-weight:500;
  padding:7px 8px;text-align:right;background:var(--panel2);border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:8px;font-size:12.5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td:first-child{text-align:left;white-space:normal}
.tbl th.l{text-align:left}
.tbl td.l{text-align:left;white-space:normal}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.eu td{background:rgba(255,77,46,.10)}
.tbl tr.cl:active td{background:var(--panel3)}
.tbl .nm{font-family:var(--body);font-size:13.5px;font-weight:500;display:block;line-height:1.25}
.tbl .sub{font-family:var(--data);font-size:9.5px;color:var(--muted2);letter-spacing:.3px;display:block;margin-top:2px}
.tbl .zn{display:inline-block;width:3px;height:13px;vertical-align:-2px;margin-right:6px;border-radius:2px;background:transparent}
.tbl .zn.s{background:var(--ac)} .tbl .zn.d{background:var(--err)}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}

/* ---------- linha de conta ---------- */
.ln{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line);font-family:var(--data);font-size:12.5px}
.ln:last-child{border-bottom:0}
.ln .lb{color:var(--muted);font-size:12px;flex:1;min-width:0;line-height:1.35}
.ln .lb i{display:block;font-style:normal;font-size:9.5px;color:var(--muted2);margin-top:2px}
.ln .vl{font-weight:600;white-space:nowrap}
.ln.tot{border-top:1px solid var(--line2);border-bottom:0;margin-top:3px;padding-top:9px;font-size:14px}
.ln.tot .lb{color:var(--txt);font-size:11px;text-transform:uppercase;letter-spacing:1.2px}

/* ---------- medidor ---------- */
.mtr{padding:9px 11px;border-bottom:1px solid var(--line)}
.mtr:last-child{border-bottom:0}
.mtr .t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mtr .t b{font-family:var(--data);font-size:12px;font-weight:500;letter-spacing:.3px;color:var(--txt)}
.mtr .t i{font-style:normal;font-family:var(--data);font-size:14px;font-weight:600}
.bar{position:relative;height:4px;background:var(--panel3);border-radius:2px;margin-top:7px;overflow:visible}
.bar i{display:block;height:100%;background:var(--ac);border-radius:2px}
.bar i.g{background:var(--gold)} .bar i.r{background:var(--err)}
.bar u{position:absolute;top:-3px;width:1px;height:10px;background:var(--muted);opacity:.85}
.mtr .ex{font-family:var(--data);font-size:9.5px;color:var(--muted2);margin-top:6px;line-height:1.45}

/* ---------- graficos ---------- */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:.7}
.chart .zl{stroke:var(--line2);stroke-width:1}
.chart .ax{fill:var(--muted2);font-family:var(--data);font-size:7px}
.chart .lin{fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.chart .lin.b{stroke:var(--gold)}
.chart .dot{fill:var(--panel);stroke:var(--ac);stroke-width:1.3}
.chart .dot.b{stroke:var(--gold)}
.chart .bp{fill:var(--pos)} .chart .bn{fill:var(--err)}
.chart .br{fill:var(--ac)} .chart .bd{fill:#3A4B5C}
.leg{display:flex;gap:13px;flex-wrap:wrap;margin-top:9px;padding:0 2px}
.leg span{font-family:var(--data);font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.leg i{width:8px;height:8px;border-radius:2px;display:block;flex:none}
.stk{display:flex;height:11px;border-radius:2px;overflow:hidden;background:var(--panel3);margin-bottom:10px}
.stk i{display:block;height:100%}
.pw{padding:11px 8px 4px}

/* ---------- botoes ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--ac);color:#1A0703;
  font-family:var(--data);font-weight:600;font-size:12px;letter-spacing:1.1px;text-transform:uppercase;
  padding:12px 12px;border-radius:var(--r);width:100%;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.sec2{background:transparent;border:1px solid var(--line2);color:var(--txt)}
.btn.gh{background:var(--panel3);color:var(--txt);border:1px solid var(--line2)}
.btn.warn{background:var(--gold);color:#161005}
.btn.dgr{background:transparent;border:1px solid var(--err);color:var(--err)}
.btn[disabled]{opacity:.32;pointer-events:none}
.btn.sm{padding:9px 10px;font-size:11px}
.bt2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bt3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gap{height:8px}

/* ---------- trocador de ativo ---------- */
.swx{position:relative;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:11px;padding:1px 1px 3px;-webkit-overflow-scrolling:touch;overflow-anchor:none}
.swx::-webkit-scrollbar{display:none}
.sx{flex:0 0 auto;text-align:left;padding:8px 13px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);min-width:96px}
.sx b{display:block;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap}
.sx span{display:block;font-family:var(--data);font-size:8.5px;color:var(--muted2);letter-spacing:.9px;
  margin-top:4px;white-space:nowrap;text-transform:uppercase}
.sx:active{background:var(--panel3)}
.sx.on{border-color:var(--ac);background:var(--ac2)}
.sx.on b{color:var(--ac)}
.sx.on span{color:var(--ac);opacity:.75}

/* ---------- segmentos ---------- */
.seg{display:flex;border-bottom:1px solid var(--line2);margin-bottom:11px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:9px 13px;font-family:var(--data);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted2);border-bottom:2px solid transparent;white-space:nowrap}
.seg button.on{color:var(--ac);border-color:var(--ac)}

/* ---------- progresso ---------- */
.prg{height:3px;background:var(--panel3);border-radius:2px;overflow:hidden;margin:9px 0}
.prg i{display:block;height:100%;background:var(--ac)}

/* ---------- itens de lista ---------- */
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 11px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:active{background:var(--panel3)}
.item .p{flex:1;min-width:0}
.item .p b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.item .p span{display:block;font-family:var(--data);font-size:10px;color:var(--muted2);letter-spacing:.3px;margin-top:3px;line-height:1.4}
.item .d{text-align:right;font-family:var(--data);font-size:12.5px;white-space:nowrap}
.item .d span{display:block;font-size:9px;color:var(--muted2);letter-spacing:.5px;margin-top:3px}
.tag{display:inline-block;font-family:var(--data);font-size:9px;font-weight:600;letter-spacing:.5px;padding:2px 5px;border-radius:2px;text-transform:uppercase}
.tag.v{background:var(--pos2);color:var(--pos)} .tag.a{background:#2C2410;color:var(--gold)}
.tag.r{background:#2C1512;color:#EE8880} .tag.n{background:var(--panel3);color:var(--muted2)}

/* ---------- radar ---------- */
.nt{display:flex;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.nt:last-child{border-bottom:0}
.nt i{font-style:normal;width:2px;border-radius:1px;background:var(--line2);flex:none}
.nt i.v{background:var(--pos)} .nt i.r{background:var(--err)} .nt i.a{background:var(--gold)}
.nt em{font-style:normal;font-family:var(--data);font-size:9.5px;color:var(--muted2);margin-right:6px}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:#070A0E;border-top:1px solid var(--line2);
  display:flex;max-width:560px;margin:0 auto;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted2);
  font-family:var(--data);font-size:8.5px;letter-spacing:.9px;text-transform:uppercase;padding:3px 0}
.nav button.on{color:var(--ac)}
.nav svg{width:19px;height:19px}

/* ---------- modal ---------- */
.mod{position:fixed;inset:0;z-index:60;background:rgba(2,5,8,.85);display:flex;align-items:flex-end;justify-content:center}
.mod>div{background:var(--bg2);border:1px solid var(--line2);border-radius:8px 8px 0 0;width:100%;max-width:560px;
  max-height:88vh;overflow:auto;padding:15px 13px calc(16px + env(safe-area-inset-bottom));animation:up .16s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- abertura ---------- */
.hero{padding:44px 16px 20px;text-align:center}
.hero h1{font-size:33px;line-height:.98;letter-spacing:.4px}
.hero h1 em{font-style:normal;color:var(--ac);display:block}
.hero p{color:var(--muted2);font-family:var(--data);letter-spacing:1.5px;text-transform:uppercase;font-size:9.5px;margin:12px 0 0}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- grid de largada ---------- */
.cor{display:inline-block;width:4px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:7px}
.pos{display:inline-block;min-width:22px;font-family:var(--data);font-weight:600}
.p1{color:var(--gold)} .p2{color:#C9D3DC} .p3{color:#C98B5A}
.res{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.res span{font-family:var(--data);font-size:10px;padding:3px 0;width:26px;text-align:center;border-radius:2px;background:var(--panel3);color:var(--muted)}
.res span.pt{background:var(--pos2);color:var(--pos)}
.res span.pd{background:#2C2410;color:var(--gold)}
.res span.ab{background:#2C1512;color:#EE8880}
.res span.fu{background:transparent;border:1px dashed var(--line2);color:var(--muted2)}

/* =========== identidade F1 =========== */
:root{
  --bg:#0B0B0F; --bg2:#101017; --panel:#15151E; --panel2:#1C1C27; --panel3:#262632;
  --line:#22222D; --line2:#30303D; --txt:#F2F2F5; --muted:#8C8C9A; --muted2:#63636F;
  --ac:#E10600; --ac2:#2B0B0A;
  --disp:'Titillium Web',system-ui,sans-serif;
  --body:'Titillium Web',system-ui,-apple-system,sans-serif;
}
body{font-size:15px}
h1,h2,h3{font-weight:900;font-style:italic;letter-spacing:0}
.btn{color:#fff;font-family:var(--disp);font-weight:700;font-style:italic;letter-spacing:.8px;font-size:13px;border-radius:2px}
.btn.sec2,.btn.gh{font-style:normal}
.btn.warn{color:#161005}
.hdr{border-bottom:2px solid var(--ac)}
.hdr .brand{font-family:var(--disp);font-weight:900;font-style:italic;font-size:15px;letter-spacing:.3px}
.panel{border-radius:4px}
.panel>.hd{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:1.2px}
.sec h4{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:1.6px;color:var(--txt)}
.sec h4:before{content:"";display:inline-block;width:3px;height:11px;background:var(--ac);margin-right:7px;vertical-align:-1px;transform:skewX(-14deg)}
.seg button{font-family:var(--disp);font-weight:700;font-size:12px}
.nav button{font-family:var(--disp);font-weight:700;font-size:9.5px}
.nav{border-top:2px solid var(--ac)}
.tbl .nm{font-weight:600}
.tt-eq{font-family:var(--disp);font-weight:900;font-style:italic;font-size:24px;text-transform:uppercase;line-height:1}
.hero{padding:34px 16px 22px}
.hero h1{font-size:52px;line-height:.95;text-transform:uppercase}
.hero p{font-family:var(--disp);font-weight:700;letter-spacing:2px;font-size:10.5px;color:var(--muted)}
.chk{height:10px;background:repeating-conic-gradient(#F2F2F5 0 25%,#0B0B0F 0 50%) 0 0/10px 10px;opacity:.9}
.faixa{height:4px}
/* dois placares no cabecalho */
.duo{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.duo>div{padding:9px 12px 10px;min-width:0}
.duo>div+div{border-left:1px solid var(--line)}
.duo .k{font-family:var(--data);font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duo .v{font-family:var(--disp);font-weight:900;font-style:italic;font-size:22px;line-height:1.05;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duo>div:first-child .v{color:var(--ac)}
.duo .s{font-family:var(--data);font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duo .s.ok{color:var(--pos)} .duo .s.neg{color:var(--err)}
/* torre de cronometragem */
.tw{display:grid;grid-template-columns:24px 4px 36px minmax(0,1fr) auto 50px;align-items:center;gap:0 9px;padding:7px 11px;border-bottom:1px solid var(--line)}
.tw:last-child{border-bottom:0}
.tw .p{font-family:var(--disp);font-weight:900;font-style:italic;font-size:15px;text-align:center}
.tw .c{width:4px;height:18px;border-radius:1px}
.tw .a{font-family:var(--disp);font-weight:900;font-size:14px;letter-spacing:.4px}
.tw .n{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw .pt{font-family:var(--data);font-weight:600;font-size:13px;text-align:right}
.tw .g{font-family:var(--data);font-size:10px;color:var(--muted2);text-align:right}
.tw.eu{background:linear-gradient(90deg,rgba(225,6,0,.24),rgba(225,6,0,.03))}
.tw.eu .n{color:var(--txt)}
.tw.sep{display:block;padding:1px 11px;text-align:center;color:var(--muted2);font-size:11px;line-height:1.2}
/* podio */
.podio{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:6px;padding:12px 12px 0}
.podio>div{text-align:center;min-width:0}
.podio .nm{font-family:var(--disp);font-weight:700;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podio .eq{font-family:var(--data);font-size:9.5px;color:var(--muted);margin-top:1px}
.podio .bl{margin-top:5px;border-radius:3px 3px 0 0;display:flex;justify-content:center;padding-top:5px;font-family:var(--disp);font-weight:900;font-style:italic;font-size:22px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
/* cartao de GP */
.gp{position:relative;padding:12px 12px 11px;background:linear-gradient(115deg,var(--panel2),var(--panel) 70%);border-bottom:1px solid var(--line);overflow:hidden}
.gp:after{content:"";position:absolute;right:0;top:0;bottom:0;width:46px;background:repeating-conic-gradient(rgba(242,242,245,.10) 0 25%,transparent 0 50%) 0 0/12px 12px}
.gp .rd{font-family:var(--disp);font-weight:700;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ac)}
.gp .tt{font-family:var(--disp);font-weight:900;font-style:italic;font-size:25px;text-transform:uppercase;line-height:1;margin-top:3px;padding-right:44px}
.gp .sb{font-family:var(--data);font-size:10px;color:var(--muted);margin-top:5px;padding-right:44px}
/* forma recente e matriz de resultados */
.forma{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.forma>div{text-align:center}
.forma b{display:block;font-family:var(--disp);font-weight:900;font-style:italic;font-size:15px;padding:5px 0;border-radius:3px;background:var(--panel3);color:var(--muted)}
.forma b.pt{background:var(--pos2);color:var(--pos)} .forma b.pd{background:#2C2410;color:var(--gold)} .forma b.ab{background:#2C1512;color:#EE8880}
.forma span{display:block;font-family:var(--data);font-size:9px;color:var(--muted2);margin-top:3px}
.mtz th,.mtz td{padding:6px 7px;font-size:11.5px}
.mtz td.l,.mtz th.l{position:sticky;left:0;background:var(--panel);z-index:1}
.mtz tr.eu td.l{background:#2A1416}
.foco{border-color:var(--line2)}
.riv{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.riv b{color:var(--txt);font-family:var(--disp);font-weight:900}
.riv i{font-style:normal;font-family:var(--data);font-size:12px;margin-left:3px}
.foco>.btn,.panel>.bd.tight>.btn{width:100%}
.estrela{font-size:24px;line-height:1;color:var(--muted2);padding:2px 4px;flex:none}
.estrela.on{color:var(--gold)}
</style>
</head>
<body>

<script>
/* =========================================================
   PADDOCK - simulador de fundo de investimento
   em equipes de automobilismo. arquivo unico, dados locais
   ========================================================= */

const el = id => document.getElementById(id);
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
function normal() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function moeda(n) {
  n = Math.round(n);
  const s = n < 0 ? '-' : '';
  const a = Math.abs(n);
  if (a >= 1e12) return s + 'US$ ' + (a / 1e12).toFixed(a >= 100e12 ? 0 : a >= 10e12 ? 1 : 2).replace('.', ',') + ' tri';
  if (a >= 1e9) return s + 'US$ ' + (a / 1e9).toFixed(a >= 100e9 ? 0 : a >= 10e9 ? 1 : 2).replace('.', ',') + ' bi';
  if (a >= 1e6) return s + 'US$ ' + (a / 1e6).toFixed(a >= 1e8 ? 0 : 1).replace('.', ',') + ' mi';
  if (a >= 1e3) return s + 'US$ ' + Math.round(a / 1e3) + ' mil';
  return s + 'US$ ' + a;
}
function sinal(n) { return (n >= 0 ? '+' : '') + moeda(n); }
function num(n) { return Math.round(n).toLocaleString('pt-BR'); }
function pct(n) { return Math.round(n * 100) + '%'; }
const DB = {
  mem: {},
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { this.mem[k] = v; } },
  get(k) { try { const r = localStorage.getItem(k); return r === null ? (this.mem[k] || null) : r; } catch (e) { return this.mem[k] || null; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } delete this.mem[k]; }
};
const CHAVE = 'paddock_v1';

/* ---------------- icones ---------------- */
const I = {

  rel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',

};
const ic = (n, s) => '<span style="display:inline-flex;width:' + (s || 15) + 'px;height:' + (s || 15) + 'px">' + I[n] + '</span>';

/* =========================================================
   CONSTANTES DO MUNDO (valores iniciais para ajuste)
   ========================================================= */
const CATS = [
  { n: 'F1', pais: 'Mundial', etapas: 24, rep: 60, piloto: [72, 95] },
  { n: 'F2', pais: 'Mundial', etapas: 14, rep: 30, piloto: [58, 82] },
  { n: 'F3', pais: 'Mundial', etapas: 10, rep: 0, piloto: [48, 74] },
  { n: 'F4 Brasil', pais: 'Brasil', etapas: 8, rep: 0, piloto: [34, 62] },
  { n: 'F4 Italia', pais: 'Italia', etapas: 8, rep: 0, piloto: [34, 62] }
];
/* categorias simuladas nesta versao */
const ATIVAS = [0, 1, 2, 3, 4];
const NCAT = CATS.length;
const DIVS = CATS.map(c => c.n);
const PONTOS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];

/* [nome, sigla, cor, forca base do carro] */
const EQUIPES = {
  0: [['Scuderia Vettorini', 'VET', '#C8102E', 88], ['Halden Racing', 'HAL', '#1E3A8A', 86], ['Aurora GP', 'AUR', '#0EA5A4', 83],
      ['Kessler Motorsport', 'KES', '#9CA3AF', 80], ['Brightwater F1', 'BRI', '#F97316', 78], ['Montclair Racing', 'MON', '#0B7A4B', 75],
      ['Nakamura Racing', 'NAK', '#E5E7EB', 73], ['Velox Corse', 'VEL', '#2563EB', 71], ['Ferrand Equipe', 'FER', '#DB2777', 69],
      ['Stratos GP', 'STR', '#7C3AED', 67], ['Orla Racing', 'ORL', '#EAB308', 64]],
  1: [['Vantage Racing', 'VAN', '#1D4ED8', 84], ['Arcadia Motorsport', 'ARC', '#DC2626', 82], ['Linea Corse', 'LIN', '#16A34A', 80],
      ['Rossetti Team', 'ROS', '#B91C1C', 78], ['Northbay Racing', 'NOR', '#0891B2', 76], ['Carvalho Motorsport', 'CAR', '#CA8A04', 74],
      ['DelMonte GP', 'DEL', '#9333EA', 72], ['Ironside Racing', 'IRO', '#6B7280', 70], ['Kaito Racing', 'KAI', '#E11D48', 68],
      ['Bluefin Motorsport', 'BLU', '#0284C7', 66], ['Sterling GP', 'STE', '#A3A3A3', 63]],
  2: [['Zenith Junior', 'ZEN', '#2563EB', 82], ['Marlow Racing', 'MAR', '#DC2626', 79], ['Tauro Motorsport', 'TAU', '#F59E0B', 77],
      ['Pinewood GP', 'PIN', '#15803D', 74], ['Corsa Nova', 'COR', '#E11D48', 72], ['Redline Academy', 'RED', '#B91C1C', 70],
      ['Quasar Racing', 'QUA', '#7C3AED', 67], ['Brisa Motorsport', 'BRS', '#06B6D4', 65], ['Falcon Junior', 'FAL', '#78716C', 62],
      ['Ardennes Racing', 'ARD', '#65A30D', 59]],
  3: [['Equipe Paulista', 'PAU', '#DC2626', 76], ['Cerrado Racing', 'CER', '#CA8A04', 73], ['Litoral Motorsport', 'LIT', '#0284C7', 71],
      ['Serra Gaucha GP', 'SER', '#16A34A', 69], ['Atlantica Racing', 'ATL', '#1D4ED8', 67], ['Capivara Speed', 'CAP', '#92400E', 65],
      ['Guanabara Motorsport', 'GUA', '#0EA5E9', 62], ['Pampa Racing', 'PAM', '#65A30D', 60], ['Tropical GP', 'TRO', '#F97316', 57],
      ['Ipe Racing', 'IPE', '#DB2777', 54]],
  4: [['Scuderia Lago', 'LAG', '#1E40AF', 76], ['Toscana Corse', 'TOS', '#B91C1C', 73], ['Emilia Racing', 'EMI', '#EAB308', 71],
      ['Vesuvio Motorsport', 'VES', '#EA580C', 69], ['Piave GP', 'PIA', '#0F766E', 67], ['Adriatica Corse', 'ADR', '#0369A1', 65],
      ['Dolomiti Racing', 'DOL', '#64748B', 62], ['Ligure Team', 'LIG', '#7C3AED', 60], ['Umbria Corse', 'UMB', '#15803D', 57],
      ['Sicilia Racing', 'SIC', '#E11D48', 54]]
};
const PISTAS = {
  0: ['Bahrein', 'Arabia Saudita', 'Australia', 'Japao', 'China', 'Miami', 'Emilia-Romagna', 'Monaco', 'Espanha', 'Canada',
      'Austria', 'Gra-Bretanha', 'Belgica', 'Hungria', 'Holanda', 'Italia', 'Azerbaijao', 'Singapura', 'Estados Unidos', 'Mexico',
      'Sao Paulo', 'Las Vegas', 'Catar', 'Abu Dhabi'],
  1: ['Bahrein', 'Arabia Saudita', 'Australia', 'Emilia-Romagna', 'Monaco', 'Espanha', 'Austria', 'Gra-Bretanha', 'Belgica',
      'Hungria', 'Italia', 'Azerbaijao', 'Catar', 'Abu Dhabi'],
  2: ['Bahrein', 'Australia', 'Emilia-Romagna', 'Monaco', 'Espanha', 'Austria', 'Gra-Bretanha', 'Hungria', 'Belgica', 'Italia'],
  3: ['Interlagos', 'Velocitta', 'Goiania', 'Cascavel', 'Mogi Guacu', 'Curvelo', 'Santa Cruz do Sul', 'Londrina'],
  4: ['Misano', 'Imola', 'Vallelunga', 'Mugello', 'Monza', 'Paul Ricard', 'Red Bull Ring', 'Spa']
};
const PRENOMES = ['Lucas', 'Theo', 'Marco', 'Diego', 'Oscar', 'Kenji', 'Mateo', 'Felix', 'Rafael', 'Sven', 'Jules', 'Nikolai',
  'Yuto', 'Liam', 'Tomas', 'Pietro', 'Caio', 'Ethan', 'Gabriel', 'Max', 'Andre', 'Noah', 'Sofia', 'Isaac', 'Hugo', 'Pedro',
  'Leo', 'Arthur', 'Enzo', 'Bruno', 'Victor', 'Lorenzo', 'Matteo', 'Henrik', 'Ryan', 'Oliver', 'Emil', 'Joao', 'Miguel',
  'Daniel', 'Aiden', 'Kai', 'Ruben', 'Luca', 'Elias', 'Tiago', 'Vitor', 'Alex', 'Nico', 'Sebastian', 'Ian', 'Rafa', 'Dario',
  'Marta', 'Clara', 'Julia', 'Bianca', 'Ana', 'Laura', 'Lea'];
const SOBRENOMES = ['Werner', 'Marchand', 'Rinaldi', 'Salvatierra', 'Hale', 'Arai', 'Ibarra', 'Brandt', 'Couto', 'Aalto',
  'Moreau', 'Petrov', 'Mori', 'OConnor', 'Herrera', 'Valli', 'Bertolini', 'Brooks', 'Antunes', 'Keller', 'Lacerda', 'Fischer',
  'Rossi', 'Mbeki', 'Laurent', 'Sampaio', 'Callister', 'Lund', 'Duarte', 'Ferraz', 'Novak', 'Kowalski', 'Lindqvist', 'Haas',
  'Tanaka', 'Silva', 'Moretti', 'Costa', 'Vidal', 'Okafor', 'Jensen', 'Kaur', 'Varga', 'Ortega', 'Bianchi', 'Galli', 'Reis',
  'Barros', 'Esposito', 'Dupont', 'Schmidt', 'Hughes', 'Price', 'Sato', 'Mendes', 'Prado', 'Ventura', 'Castro', 'Leclair',
  'Vasquez', 'Nunes', 'Albers', 'Strand', 'Kimura', 'Rocha', 'Teixeira', 'Fontana', 'Bauer', 'Quinn', 'Doyle', 'Amaral'];
const PAISES = ['BRA', 'ITA', 'GBR', 'FRA', 'ALE', 'ESP', 'HOL', 'JAP', 'AUS', 'EUA', 'MEX', 'ARG', 'FIN', 'DIN', 'BEL', 'POR', 'CAN', 'CHN', 'SUI', 'AUT'];
/* numero de equipes da categoria: a F1 ganha uma vaga quando alguem paga a taxa de entrada */
function nCat(cat) { return S && S.equipes ? S.equipes.filter(e => e.cat === cat).length : EQUIPES[cat].length; }
const TAXA_F1 = 150e6, REP_F1 = 55, MAX_F1 = 12;

/* economia por categoria, valores anuais em US$
   vaga: quanto vale ter uma vaga ali, mesmo com equipe ruim
   premio: premiacao do 1o e do ultimo no construtores
   pagante: quanto um piloto pagante leva para a equipe (F2 para baixo) */
const ECO = [
  { vaga: 650e6, premio: [150e6, 80e6], patro: 200e6, pagante: 0, equipe: 45e6, operacao: 38e6, desenv: 35e6, infra: 18e6, academia: 12e6, tecnologia: 25e6, fas: 2e6 },
  { vaga: 14e6, premio: [6e6, 1.2e6], patro: 9e6, pagante: 1.6e6, equipe: 2.6e6, operacao: 3.4e6, desenv: 1.2e6, infra: 1e6, academia: 1.5e6, tecnologia: 1e6, fas: 120e3 },
  { vaga: 5e6, premio: [2.2e6, 0.4e6], patro: 3.2e6, pagante: 0.9e6, equipe: 1.1e6, operacao: 1.5e6, desenv: 0.45e6, infra: 0.4e6, academia: 0.6e6, tecnologia: 0.3e6, fas: 40e3 },
  { vaga: 1.2e6, premio: [0.5e6, 0.08e6], patro: 0.8e6, pagante: 0.25e6, equipe: 0.3e6, operacao: 0.42e6, desenv: 0.12e6, infra: 0.12e6, academia: 0.2e6, tecnologia: 0.08e6, fas: 8e3 },
  { vaga: 1.2e6, premio: [0.5e6, 0.08e6], patro: 0.8e6, pagante: 0.25e6, equipe: 0.3e6, operacao: 0.42e6, desenv: 0.12e6, infra: 0.12e6, academia: 0.2e6, tecnologia: 0.08e6, fas: 8e3 }
];
const MOTOR = {
  cliente: { n: 'Cliente', c: 18e6, d: 'Barato, mas o carro fica limitado' },
  parceria: { n: 'Parceria', c: 12e6, d: 'Montadora divide o custo e ajuda no desenvolvimento' },
  fabrica: { n: 'Motor de fabrica', c: 32e6, d: 'Caro, e o melhor teto de desempenho' }
};
const CAIXA0 = 20e6;
const JUROS = 0.11;

/* =========================================================
   MUNDO
   ========================================================= */
let S = null, TELA = 'fundo';
function novoNomePiloto(usados) {
  for (let k = 0; k < 400; k++) {
    const n = pick(PRENOMES) + ' ' + pick(SOBRENOMES);
    if (!usados[n]) { usados[n] = 1; return n; }
  }
  return 'Piloto ' + ri(100, 999);
}
function novoPiloto(cat, usados, jovem) {
  const f = CATS[cat].piloto;
  const idade = jovem ? ri(16, 19) : cat === 0 ? ri(21, 37) : cat === 1 ? ri(19, 27) : cat === 2 ? ri(17, 23) : ri(15, 19);
  return {
    id: S.pilotos.length, nome: novoNomePiloto(usados), pais: pick(PAISES), idade: idade,
    nivel: ri(f[0], f[1]), pot: Math.round(Math.random() * 100) / 100,
    eq: null, st: novoStPiloto()
  };
}
function novoStPiloto() { return { pts: 0, v: 0, pod: 0, ab: 0, c: 0 }; }
function novoStEquipe() { return { pts: 0, v: 0, pod: 0, ab: 0, c: 0, melhor: 99 }; }
function criarMundo() {
  S.equipes = []; S.pilotos = [];
  const usados = {};
  for (let cat = 0; cat < NCAT; cat++) {
    EQUIPES[cat].forEach(e => {
      const eq = { id: S.equipes.length, nome: e[0], ab: e[1], cor: e[2], cat: cat, base: e[3], dono: null, st: novoStEquipe() };
      eq.p = perfilInicial(eq);
      for (let k = 0; k < 2; k++) {
        const pl = novoPiloto(cat, usados);
        /* equipe forte atrai piloto melhor */
        pl.nivel = clamp(Math.round(pl.nivel * 0.6 + (CATS[cat].piloto[0] + (CATS[cat].piloto[1] - CATS[cat].piloto[0]) * (eq.base - 50) / 40) * 0.4), 20, 99);
        pl.eq = eq.id;
        S.pilotos.push(pl);
        eq.p.pil.push(pl.id);
      }
      S.equipes.push(eq);
    });
    /* posicao "da temporada passada" pela forca, base do valor de mercado */
    equipesDa(cat).slice().sort((a, b) => b.base - a.base).forEach((e, i) => { e.ult = i + 1; });
  }
  /* pilotos livres em cada categoria */
  for (let cat = 0; cat < NCAT; cat++) for (let k = 0; k < 4; k++) { const pl = novoPiloto(cat, usados); pl.cat = cat; S.pilotos.push(pl); }
  S.equipes.forEach(eq => {
    const rec = receitaEquipe(eq, eq.ult).total;
    eq.p.divida = Math.round(rec * (0.05 + Math.pow(Math.random(), 1.9) * 1.05) / 1e4) * 1e4;
    eq.p.premio = Math.round((0.04 + Math.random() * 0.19) * 1000) / 1000;
  });
}
function perfilInicial(eq) {
  const f = clamp((eq.base - 50) / 40, 0, 1);
  const carro = clamp(eq.base + ri(-2, 2), 30, 96);
  return {
    carro: carro,
    confiab: clamp(Math.round(62 + f * 26 + ri(-8, 8)), 35, 97),
    pil: [],
    tunel: clamp(Math.round(25 + f * 55 + ri(-10, 10)), 5, 96),
    fabrica: clamp(Math.round(25 + f * 55 + ri(-10, 10)), 5, 96),
    simulador: clamp(Math.round(20 + f * 55 + ri(-12, 12)), 5, 96),
    motor: eq.cat === 0 ? (eq.base >= 83 ? 'fabrica' : eq.base >= 74 ? 'parceria' : 'cliente') : 'cliente',
    marca: clamp(Math.round(15 + f * 60 + ri(-10, 10)), 5, 98),
    fas: Math.round((eq.cat === 0 ? 2e6 : eq.cat === 1 ? 120e3 : eq.cat === 2 ? 40e3 : 8e3) * (0.4 + f * 1.6) * (0.75 + Math.random() * 0.5)),
    gestao: clamp(Math.round(30 + f * 30 + ri(-15, 15)), 8, 95),
    academia: clamp(Math.round(10 + f * 40 + ri(-10, 10)), 0, 95),
    tecnico: eq.base >= 82 ? 2 : eq.base >= 70 ? 1 : 0,
    divida: 0, caixa: 0, momento: 0, obras: [], gastoTeto: 0, tunelPen: 0, punicao: 0
  };
}

/* =========================================================
   CALENDARIO E SIMULACAO DE CORRIDA
   ========================================================= */
function passos() { return ATIVAS.reduce((m, c) => Math.max(m, CATS[c].etapas), 0); }
/* em qual passo do calendario geral cada etapa da categoria acontece */
function passoDaEtapa(cat, k) { return Math.round((k + 1) * passos() / CATS[cat].etapas) - 1; }
function gerarCalendarios() {
  S.cal = [];
  for (let cat = 0; cat < NCAT; cat++) {
    S.cal[cat] = PISTAS[cat].slice(0, CATS[cat].etapas).map((p, k) => ({ pista: p, passo: passoDaEtapa(cat, k), res: null }));
  }
  S.passos = passos();
}
function equipesDa(cat) { return S.equipes.filter(e => e.cat === cat); }
/* estrategia de corrida: escolhida pelo fundo para cada equipe, vale ate trocar */
const ESTRATEGIAS = {
  atacar: { n: 'Atacar', r: 1.5, ab: 1.6, d: 'Mais ritmo, mais quebras e batidas' },
  equilibrada: { n: 'Equilibrada', r: 0, ab: 1, d: 'Ritmo e risco normais' },
  poupar: { n: 'Poupar', r: -1.5, ab: 0.55, d: 'Menos ritmo, quase nao quebra' }
};
function estrategia(eq) { return ESTRATEGIAS[eq.p.estrategia] || ESTRATEGIAS.equilibrada; }
/* meta esportiva: a posicao que o carro e os pilotos prometem no inicio da temporada */
function forcaEsperada(eq) { return eq.p.carro + (eq.cat === 0 ? MOTOR_B[eq.p.motor].b : 0) + nivelPilotos(eq) * 0.43; }
function metaPrevista(eq) { return equipesDa(eq.cat).slice().sort((a, b) => forcaEsperada(b) - forcaEsperada(a)).indexOf(eq) + 1; }
function metaDa(eq) { return S.fase === 'temp' && eq.p.meta ? eq.p.meta : metaPrevista(eq); }
function bonusMeta(eq, pos, meta) { return pos <= meta ? ECO[eq.cat].patro * (0.10 + Math.min(4, meta - pos) * 0.05) : 0; }
function ritmo(eq, pl) {
  const ruido = 4 * (1.15 - eq.p.simulador / 100 * 0.3);

    if (r.eq !== S.principal) return;

    else if (r.pos && r.pos <= 3) noticia(pl.nome + ' fez podio no GP de ' + etapa.pista + ' (' + DIVS[cat] + '): ' + r.pos + 'o lugar.', 'v');

function simularPasso() {

function etapasCorridas(cat) { return S.cal[cat].filter(e => e.res).length; }
let TB_CACHE = {};

function ordemEquipe(a, b) {

/* =========================================================

function fatorGestao(p) { return 1.22 - p.gestao / 100 * 0.40; }

function valorMercado(eq) {

/* diretor tecnico: custo anual (fracao do custo da equipe tecnica) e bonus de desenvolvimento */
const TECNICOS = [

function requisitoMotor(eq, alvo) {

  if (ratio <= 1) { S.f.tetoLimpo = (S.f.tetoLimpo || 0) + 1; return; }
  S.f.tetoLimpo = 0;

const FASES = {

function faseDe(i) {

}
function novoCiclo() { return { indice: 1, mom: 0, fase: 'estavel', hist: [] }; }
function evoluirCiclo() {
  const c = S.ciclo;

  const inercia = c.mom * 0.55;
  const choque = (Math.random() - 0.5) * 0.17;
  const d = reversao + inercia + choque;
  c.mom = clamp(d, -0.22, 0.22);
  c.indice = Math.round(clamp(c.indice + d, 0.62, 1.55) * 1000) / 1000;
  const antes = c.fase;
  c.fase = faseDe(c.indice);
  c.hist.push({ t: S.temporada, i: c.indice });
  if (c.hist.length > 24) c.hist.shift();
  if (c.fase !== antes) noticia('Mercado em ' + FASES[c.fase].n.toLowerCase() + ': indice de multiplos em ' + c.indice.toFixed(2).replace('.', ',') + '.',
    c.indice >= 1.09 ? 'v' : c.indice < 0.93 ? 'r' : '');
}

    const meta = p.meta || metaPrevista(eq), bonus = bonusMeta(eq, pos, meta);
    rec.bonusMeta = bonus; rec.total += bonus;
    const saldo = rec.total - des.total;
    const linha = {
      id: id, nome: eq.nome, ab: eq.ab, cor: eq.cor, catId: eq.cat, cat: DIVS[eq.cat], pos: pos, n: n, st: JSON.parse(JSON.stringify(eq.st)), campeao: pos === 1,

      const doFundo = Math.min(S.f.caixa, falta);
      S.f.caixa -= doFundo; p.aporte = (p.aporte || 0) + doFundo;
      const resto = falta - doFundo;
      if (resto > 0) {

  /* 2. posicao final de todo o grid, base do valor de mercado */

  /* 3. evolucao das equipes do fundo */

    p.confiab = clamp(Math.round(p.confiab + (p.fabrica - 50) / 25 + ri(-2, 2)), 30, 98);

    } else if (pos >= linha.meta + 3) {

      rep(-2);

    }
    if (pos === 1) {

      noticia(eq.nome + ' campea de construtores da ' + DIVS[eq.cat] + '.', 'v');
    }
    else if (pos <= 3) rep(2);
    linha.valorDepois = valorMercado(eq).liquido;
    linha.carroDepois = p.carro;
    p.hist = p.hist || [];
    p.hist.push({
      t: S.temporada, cat: DIVS[eq.cat], pos: pos, n: n, pts: linha.st.pts, v: linha.st.v, pod: linha.st.pod, ab: linha.st.ab,
      carro: p.carro, rec: Math.round(linha.rec.total), des: Math.round(linha.des.total), saldo: Math.round(linha.saldo),

    if (ehMeu(eq.id) || (eq.dono !== null && eq.dono !== undefined)) return;
    const p = eq.p;
    p.carro = clamp(Math.round(p.carro + clamp(eq.base - p.carro, -2, 2) + ri(-2, 2)), 30, 96);
    p.confiab = clamp(Math.round(p.confiab + ri(-3, 3)), 35, 97);

  /* 5. mercado e concorrencia */

  rel.fundo = {

  S.f.hist.push({
    t: S.temporada, pat: Math.round(pat), caixa: Math.round(S.f.caixa), divida: Math.round(S.f.divida),
    rep: S.f.reputacao, n: S.donos.length, saldo: Math.round(rel.fundo.saldo),

  meus().forEach(eq => { if (eq.p.punicao) { eq.st.pts = -eq.p.punicao; eq.p.punicao = 0; } });

  S.temporada++;
  S.passo = 0;
  S.recusas = {};
  aplicarRegulamento();
  avisosRegulamento();
  gerarCalendarios();

  S.fase = 'relatorio';
}

let SAVE_PEND = false, SAVE_TIMER = null;
function empacotar() {

}

    d.cal = d.cal.map(cat => cat.map(et => ({
      pista: et.pista, passo: et.passo,
      res: et.res ? et.res.map(a => ({ eq: a[0], pl: a[1], pos: a[2] || null, pts: a[2] && a[2] <= 10 ? PONTOS[a[2] - 1] : 0 })) : null

}

  if (!S) return;

}

  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && SAVE_PEND) gravar(); });
  if (typeof window !== 'undefined') window.addEventListener('pagehide', function () { if (SAVE_PEND) gravar(); });
}
function carregar() {
  const raw = DB.get(CHAVE);

  try {
    const d = desempacotar(JSON.parse(raw));
    if (!d || !d.f || !d.donos || !d.equipes) return false;
    S = d;
    if (!S.noticias) S.noticias = [];

    if (!S.dd) S.dd = {};

    if (!S.ciclo) S.ciclo = novoCiclo();
    if (!S.reg) S.reg = { tec: S.temporada + ri(2, 5), motor: S.temporada + ri(4, 8) };
    if (!S.propostas) S.propostas = [];
    if (!S.f.marcos) S.f.marcos = novosMarcos();
    S.equipes.forEach(e => { if (e.dono === undefined) e.dono = null; });

    if (S.passos !== passos() && S.fase !== 'temp') gerarCalendarios();

}

  if (SAVE_TIMER) { clearTimeout(SAVE_TIMER); SAVE_TIMER = null; }
  SAVE_PEND = false; DB.del(CHAVE); S = null; TELA = 'fundo'; render();
}

/* ---------------- graficos em svg ---------------- */
function curto(n) {

const GW = 320, GH = 148, GPR = 8, GPT = 12, GPB = 20;
function margemY(lo, hi, fmt) {

    g += '<line class="gl" x1="' + pl + '" y1="' + y + '" x2="' + (GW - GPR) + '" y2="' + y + '"/>' +
      '<text class="ax" x="' + (pl - 5) + '" y="' + (Number(y) + 2.5).toFixed(1) + '" text-anchor="end">' + esc(fmt(v)) + '</text>';
  }

}
function eixoX(rotulos, xDe) {

}
function svgLinha(series, fmt, id) {
  const n = series[0].dados.length;
  if (n < 2) return vazio('O grafico aparece a partir da segunda temporada');
  let lo = Infinity, hi = -Infinity;
  series.forEach(s => s.dados.forEach(d => { lo = Math.min(lo, d.v); hi = Math.max(hi, d.v); }));
  const negativos = lo < 0;

  rg = rg || Math.max(1, Math.abs(hi) || 1);

  const y = v => GPT + (GH - GPT - GPB) * (1 - (v - lo) / (hi - lo));
  let corpo = '';
  series.forEach((s, k) => {

    if (k === 0) corpo += '<path d="' + cam + 'L' + pts[n - 1][0].toFixed(1) + ',' + (GH - GPB) + 'L' + pts[0][0].toFixed(1) + ',' + (GH - GPB) + 'Z" fill="url(#' + id + ')"/>';
    corpo += '<path class="lin' + (k ? ' b' : '') + '" d="' + cam + '"/>' +
      (n > 26 ? '' : pts.map(p => '<circle class="dot' + (k ? ' b' : '') + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="2.2"/>').join(''));

function svgBarras(dados, fmt, ref) {
  const n = dados.length;

  let lo = Math.min(0, Math.min.apply(null, dados.map(d => d.v)));
  let hi = Math.max(0, Math.max.apply(null, dados.map(d => d.v)));

  }).join('');

    '<line x1="' + pl + '" y1="' + y(ref).toFixed(1) + '" x2="' + (GW - GPR) + '" y2="' + y(ref).toFixed(1) +
    '" stroke="#DDB04A" stroke-width="1" stroke-dasharray="3 3"/>';

    '<line class="zl" x1="' + pl + '" y1="' + y0.toFixed(1) + '" x2="' + (GW - GPR) + '" y2="' + y0.toFixed(1) + '"/>' +
    barras + linhaRef + eixoX(dados.map(d => d.l), x) + '</svg>';

function svgDuplas(dados, fmt) {
  const n = dados.length;

  hi *= 1.14;

  const x = i => pl + larg * (i + 0.5);
  const y = v => GPT + (GH - GPT - GPB) * (1 - v / hi);

  const barras = dados.map((d, i) => {

      '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, y0 - y(v)).toFixed(1) + '" rx="1"/>';

function formaRecente(eq, n) {
  const its = [];

    if (!et.res) return;
    const meus = et.res.filter(r => r.eq === eq.id);
    const best = meus.reduce((m, r) => r.pos && (m === null || r.pos < m) ? r.pos : m, null);
    its.push({ p: siglaPista(et.pista), best: best, pts: meus.reduce((t, r) => t + r.pts, 0) });
  });
  return its.slice(-n);
}

/* aba corrida da equipe: corrida a corrida, posicao no campeonato e duelo interno */
function corridaACorrida(eq) {
  const cat = eq.cat, hist = historicoCat(cat);

  const linhas = hist.ks.map((k, j) => {
    const et = S.cal[cat][k];
    const rs = eq.p.pil.map(id => et.res.filter(r => r.pl === id)[0]);

    const cel = r => !r ? '<td class="mut">-</td>' : '<td class="' + (r.pos === null ? 'neg' : r.pos <= 3 ? 'gd' : r.pts ? 'ok' : '') + '">' + (r.pos === null ? 'AB' : r.pos) + '</td>';
    const pts = et.res.filter(r => r.eq === eq.id).reduce((t, r) => t + r.pts, 0);
    return '<tr><td class="l"><span class="nm">' + esc(et.pista) + '</span>' + (outros.length ? '<span class="sub">com piloto que ja saiu</span>' : '') + '</td>' +
      rs.map(cel).join('') + '<td>' + (pts ? '+' + pts : '0') + '</td><td><span class="' + posCls(hist.pos[eq.id][j]) + '">P' + hist.pos[eq.id][j] + '</span></td></tr>';
  }).reverse();
  const pls = eq.p.pil.map(id => S.pilotos[id]);
  let duelo = [0, 0];
  hist.ks.forEach(k => {
    const et = S.cal[cat][k], a = et.res.filter(r => r.pl === pls[0].id)[0], b = et.res.filter(r => r.pl === pls[1].id)[0];
    if (!a || !b) return;
    const pa = a.pos || 99, pb = b.pos || 99;
    if (pa < pb) duelo[0]++; else if (pb < pa) duelo[1]++;
  });
  const rot = hist.ks.map(k => siglaPista(S.cal[cat][k].pista));
  return sec('corrida a corrida', hist.ks.length + ' de ' + CATS[cat].etapas) +
    painel('', '', tabela(['GP', siglaPiloto(pls[0]), siglaPiloto(pls[1]), 'Pts', 'Camp'], linhas), true) +
    sec('duelo interno', 'quem chegou na frente') +

      ln(pls[1].nome, duelo[1] + ' x ' + duelo[0], duelo[1] >= duelo[0] ? 'ok' : '', pls[1].st.pts + ' pts no campeonato de pilotos'));

function telaRelatorio() {
  const r = S.relatorio, f = r.fundo;
  const dPat = f.patrimonio - f.patrimonioAntes;
  const titulos = r.equipes.filter(x => x.campeao).length;
  const metas = r.equipes.filter(x => x.pos <= x.meta).length;
  let manchete = (titulos ? 'Temporada de titulo! ' : r.equipes.some(x => x.st.v) ? 'Temporada com vitorias. ' : 'Temporada sem vitorias. ') +
    (r.equipes.length ? metas + ' de ' + r.equipes.length + ' metas batidas. ' : '');
  manchete += dPat >= 0
    ? 'O fundo comecou o ano valendo ' + moeda(f.patrimonioAntes) + ' e terminou valendo ' + moeda(f.patrimonio) + '.'
    : 'O fundo perdeu ' + moeda(-dPat) + ' de valor: comecou o ano em ' + moeda(f.patrimonioAntes) + ' e fechou em ' + moeda(f.patrimonio) + '.';
  let h = '<div class="wrap">' +
    '<div class="panel"><div class="hd"><span>FECHAMENTO</span><b>TEMPORADA ' + r.temporada + '</b></div>' +
    '<div class="bd" style="padding:12px 12px 11px">' +
    '<div class="num ' + (dPat >= 0 ? 'ok' : 'neg') + '" style="font-size:26px;font-weight:600;line-height:1">' + sinal(dPat) + '</div>' +
    '<div class="cap" style="font-family:var(--data);font-size:8.5px;letter-spacing:1.6px;color:var(--muted2);margin-top:4px">VARIACAO DO PATRIMONIO</div>' +
    '<p class="msg" style="margin-top:10px">' + esc(manchete) + '</p></div></div>';
  const prL = r.equipes.filter(x => x.id === r.principal)[0] || r.equipes[0];
  if (prL && r.classif && r.classif[prL.catId]) {
    const cl = r.classif[prL.catId], top = cl.filter(x => x.pos <= 3);
    h += sec('construtores ' + prL.cat, 'classificacao final') + '<div class="panel">' +
      podio(top.map(x => ({ nome: x.ab, sub: x.pts + ' pts', cor: x.cor }))) +
      '<div style="border-top:1px solid var(--line)">' + cl.filter(x => x.meu).map(x => '<div class="tw' + (x.meu ? ' eu' : '') + '"><span class="p ' + posCls(x.pos) + '">' + x.pos + '</span>' +
        '<span class="c" style="background:' + esc(x.cor) + '"></span><span class="a">' + esc(x.ab) + '</span><span class="n">' + esc(x.nome) + '</span>' +
        '<span class="pt">' + x.pts + '</span><span class="g">pts</span></div>').join('') + '</div></div>';
  }
  const ordem = r.equipes.slice().sort((a, b) => (b.id === r.principal) - (a.id === r.principal) || a.catId - b.catId);
  h += sec('suas equipes', 'toque para ver o ano de cada uma') + '<div class="panel">' + ordem.map(x => {
    const aberto = !!UI.relDet[x.id];
    const meta = x.pos <= x.meta ? tag('meta P' + x.meta + ' ok', 'v') : x.pos >= x.meta + 3 ? tag('meta P' + x.meta + ' longe', 'r') : tag('meta P' + x.meta, 'a');
    return '<div class="item" data-a="reldet:' + x.id + '"><span class="p"><b>' + (x.id === r.principal ? '&#9733; ' : '') + esc(x.nome) + '</b>' +
      '<span>' + esc(x.cat) + ' &middot; ' + x.st.pts + ' pts &middot; ' + x.st.v + ' V &middot; ' + x.st.pod + ' P &middot; ' + meta + '</span></span>' +
      '<span class="d"><span class="' + posCls(x.pos) + '" style="font-family:var(--disp);font-weight:900;font-style:italic;font-size:18px;display:block;margin:0;color:inherit">P' + x.pos + '</span>' +
      '<span class="' + (x.saldo >= 0 ? 'ok' : 'neg') + '">' + sinal(x.saldo) + '</span></span></div>' + (aberto ? anoDaEquipe(x) : '');
  }).join('') + '</div>';
  const dRep = Math.round(f.reputacao - f.reputacaoAntes);
  h += sec('como o fundo fechou') +
    '<div class="panel"><div class="stats c3">' +
    celula('Caixa', moeda(f.caixa), varTxt(f.caixa - f.caixaAntes)) +
    celula('Divida', moeda(f.divida), f.juros > 0 ? moeda(f.juros) + ' de juros' : 'sem juros', f.divida > 0 ? 'neg' : '') +
    celula('Reputacao', Math.round(f.reputacao) + '/100', dRep === 0 ? 'estavel' : (dRep > 0 ? '+' + dRep : String(dRep)), dRep > 0 ? 'ok' : dRep < 0 ? 'neg' : '') +
    '</div><div class="bd">' + lnTot('Patrimonio liquido', moeda(f.patrimonio), 'ok') + '</div></div>';
  if (r.eventos && r.eventos.length) {
    h += sec('o que aconteceu', r.eventos.length + ' evento' + (r.eventos.length === 1 ? '' : 's')) +
      painel('', '', r.eventos.map(e => '<div class="nt"><i class="' + e.tipo + '"></i><span>' + esc(e.texto) + '</span></div>').join(''), true);
  }
  if (r.conquistas && r.conquistas.length) {
    h += sec('conquistas desbloqueadas', r.conquistas.length + ' nova' + (r.conquistas.length === 1 ? '' : 's')) +
      painel('', '', r.conquistas.map(k => ln(k.n, tagConq(k.t), '', k.d)).join(''));
  }
  if (r.ciclo) h += sec('mercado') + painel('', '',
    ln('Fase do ciclo', FASES[r.ciclo.fase].n, r.ciclo.indice >= 1.09 ? 'gd' : r.ciclo.indice < 0.93 ? 'ok' : '') +
    ln('Indice de multiplos', 'x ' + r.ciclo.indice.toFixed(2).replace('.', ','), '', FASES[r.ciclo.fase].d));
  if (r.ranking) {
    const meuRk = r.ranking.filter(x => x.eu)[0], topoRk = r.ranking.slice(0, 5);
    if (topoRk.indexOf(meuRk) < 0) topoRk.push(meuRk);
    h += sec('entre os fundos', meuRk.pos + ' de ' + r.ranking.length) + painel('', '', tabela(['#', 'Fundo', 'Equipes', 'Patrimonio'], topoRk.map(linhaRanking), [0, 1]), true);
  }
  h += sec('campeoes') + painel('', '', r.campeoes.map(c =>
    ln(DIVS[c.cat], esc(c.equipe), c.meu ? 'ok' : '', 'pilotos: ' + c.piloto)).join(''));
  h += '<div class="gap"></div><button class="btn" data-a="fecharrel">Abrir a pre-temporada ' + S.temporada + ' ' + ic('seta') + '</button>';
  return h + '</div>';
}

/* ---------------- render ---------------- */
function render() {
  const app = el('app');
  if (!S || !S.f) { app.innerHTML = TELA === 'criacao' ? telaCriacao() : telaInicio(); restaurarFoco(); return; }
  if (S.fase === 'relatorio') {
    const y = ULTIMA === 'rel-fechamento' ? window.scrollY : 0;
    app.innerHTML = topo() + telaRelatorio();
    window.scrollTo(0, y);
    ULTIMA = 'rel-fechamento';
    return;
  }
  const chave = [TELA, UI.abaEquipe, UI.catCamp, UI.visaoCamp, UI.abaRel, UI.alvo].join('|');
  if (chave === ULTIMA) SCROLL[chave] = window.scrollY;
  const trilhos = [].map.call(document.querySelectorAll('.swx'), e => e.scrollLeft);
  let corpo = '';
  if (TELA === 'equipes') corpo = telaEquipes();
  else if (TELA === 'mercado') corpo = telaMercado();
  else if (TELA === 'camp') corpo = telaCamp();
  else if (TELA === 'rel') corpo = telaRel();
  else corpo = telaFundo();
  app.innerHTML = topo() + corpo + nav();
  if (chave === ULTIMA) window.scrollTo(0, SCROLL[chave] || 0); else window.scrollTo(0, 0);
  ULTIMA = chave;
  restaurarTrilhos(trilhos);
  restaurarFoco();
}
function restaurarTrilhos(anteriores) {
  [].forEach.call(document.querySelectorAll('.swx'), (e, i) => {
    if (anteriores[i] !== undefined) e.scrollLeft = anteriores[i];
    const on = e.querySelector('.sx.on');
    if (!on || !e.getBoundingClientRect) return;
    const cr = e.getBoundingClientRect(), br = on.getBoundingClientRect();
    if (!cr.width || !br.width) return;
    if (br.left < cr.left + 8) e.scrollLeft += br.left - cr.left - 8;
    else if (br.right > cr.right - 8) e.scrollLeft += br.right - cr.right + 8;
  });
}
function restaurarFoco() {
  if (!UI.foco) return;
  const e = el(UI.foco);
  UI.foco = null;
  if (!e) return;
  e.focus();
  try { e.setSelectionRange(e.value.length, e.value.length); } catch (err) { }
}
function abrirModal(h) { el('modal').innerHTML = '<div class="mod" data-a="fechar-fundo"><div>' + h + '</div></div>'; }
function fecharModal() { el('modal').innerHTML = ''; }
function alerta(t, p) {

function modalValor(titulo, texto, maximo, acao) {

        ln('Caixa depois da compra', moeda(S.f.caixa - of.v), S.f.caixa - of.v < 0 ? 'neg' : '') +
        (temRelatorio(id) ? '' : '<p class="msg" style="margin:10px 0 0">Sem due diligence: a divida real so aparece depois de assinar.</p>') +
        (temNaCat(eq.cat) ? '<p class="msg" style="margin:10px 0 0">Segunda equipe na mesma categoria: <b>-10 de reputacao</b>.</p>' : '') +
        '<div class="gap"></div><button class="btn" data-a="ofertar-ok:' + id + ':' + p2 + '">Enviar proposta</button>' +
        '<div class="gap"></div><button class="btn sec2" data-a="fechar">Cancelar</button>');
      break;
    }
    case 'ofertar-ok': {
      fecharModal();
      const id = Number(p1), err = comprarEquipe(id, p2);
      if (err) { alerta('Nao rolou', err); render(); }
      else { UI.alvo = null; UI.equipe = id; TELA = 'equipes'; UI.abaEquipe = 'painel'; render(); }
      break;
    }
    case 'vender': {
      const eq = eqSel(), b = balanco(eq);
      abrirModal('<h3>Vender a ' + esc(eq.nome) + '</h3>' +
        ln('Voce recebe', moeda(valorVenda(eq) + eq.p.caixa)) +
        ln('Total investido', moeda(b.investido), 'neg') +
        ln('Ja sacado', moeda(eq.p.retirado || 0), 'ok') +
        lnTot(b.resultado >= 0 ? 'Lucro do projeto' : 'Prejuizo do projeto', moeda(Math.abs(b.resultado)), b.resultado >= 0 ? 'ok' : 'neg') +
        '<p class="msg" style="margin:10px 0 12px">Nao da para desfazer.</p>' +
        '<button class="btn warn" data-a="vender-ok">Vender</button>' +
        '<div class="gap"></div><button class="btn sec2" data-a="fechar">Cancelar</button>');
      break;
    }
    case 'vender-ok': {
      fecharModal();
      const err = venderEquipe(UI.equipe);
      if (err) alerta('Nao deu', err); else { UI.equipe = null; TELA = 'fundo'; render(); }
      break;
    }
    case 'apagar':
      abrirModal('<h3>Apagar o fundo</h3><p class="msg" style="margin:9px 0 14px">Isso remove o jogo salvo neste aparelho.</p>' +
        '<button class="btn dgr" data-a="apagar-ok">Apagar</button><div class="gap"></div><button class="btn sec2" data-a="fechar">Cancelar</button>');
      break;
    case 'apagar-ok': fecharModal(); apagar(); break;
    case 'fechar': case 'fechar-fundo': fecharModal(); break;
  }
});

(function () { if (carregar()) { TELA = 'fundo'; render(); } else render(); })();
</script>
<script src="./bnf-config.js"></script>
<script src="./bnf-analytics.js" data-page="Paddock"></script>
</body>
</html>
