<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E13">
<meta name="description" content="Fundo de Equipes - simulador de fundo de investimento em equipes de automobilismo.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fundo de Equipes</title>
<link rel="icon" href="./bnf-favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E13; --bg2:#0D1319; --panel:#111820; --panel2:#161F29; --panel3:#1B2733;
  --line:#1E2A36; --line2:#2A3947; --txt:#E4EBF2; --muted:#75899C; --muted2:#55677A;
  --ac:#FF4D2E; --ac2:#2E120C; --pos:#2FCB86; --pos2:#0F2B20; --gold:#DDB04A; --err:#E2564B; --info:#5C9FEA;
  --disp:'Archivo Black',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --data:'IBM Plex Mono',ui-monospace,monospace;
  --r:3px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--body);font-size:15px}
body{overscroll-behavior:none}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:78px}
.wrap{padding:12px 12px 20px}

/* ---------- cabecalho ---------- */
.hdr{position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--line2)}
.hdr .r1{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line)}
.hdr .brand{font-family:var(--disp);font-size:12px;letter-spacing:.4px;text-transform:uppercase}
.hdr .ctx{font-family:var(--data);font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.hdr .ctx b{color:var(--ac);font-weight:500}
.hdr .r2{padding:9px 12px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hdr .big{font-family:var(--data);font-size:25px;font-weight:600;line-height:1;color:var(--ac);letter-spacing:-.5px}
.hdr .cap{font-family:var(--data);font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted2);margin-top:4px}
.hdr .delta{font-family:var(--data);font-size:11px;text-align:right;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.stats>div{padding:6px 9px;border-right:1px solid var(--line);min-width:0}
.stats>div:last-child{border-right:0}
.stats.c3{grid-template-columns:repeat(3,1fr)}
.stats.c2{grid-template-columns:repeat(2,1fr)}
.stats .dl{display:block;font-family:var(--data);font-size:9.5px;margin-top:2px;color:var(--muted2)}
.stats span{display:block;font-family:var(--data);font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted2)}
.stats b{display:block;font-family:var(--data);font-size:12.5px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- secoes e paineis ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:17px 2px 7px}
.sec:first-child{margin-top:2px}
.sec h4{margin:0;font-family:var(--data);font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.sec em{font-style:normal;font-family:var(--data);font-size:10px;color:var(--muted2);letter-spacing:.5px}
.panel{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);overflow:hidden}
.panel+.panel{margin-top:8px}
.panel>.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;background:var(--panel2);
  border-bottom:1px solid var(--line2);font-family:var(--data);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.panel>.hd b{color:var(--txt);font-weight:500}
.panel>.bd{padding:11px}
.panel>.bd.tight{padding:0}
.empty{padding:22px 14px;text-align:center;font-family:var(--data);font-size:11.5px;color:var(--muted2);letter-spacing:.4px}

h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.2px;text-transform:uppercase;margin:0}
h3{font-size:15px}
.mono{font-family:var(--data)}
.mut{color:var(--muted)}
.ok{color:var(--pos)} .neg{color:var(--err)} .gd{color:var(--gold)}
.msg{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0}
.msg b{color:var(--txt);font-weight:600}
.row{display:flex;align-items:center;gap:8px}

/* ---------- filtros ---------- */
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.filtros.f1{grid-template-columns:1fr}
.fld span{display:block;font-family:var(--data);font-size:8px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted2);margin-bottom:4px}
.fld .sw{position:relative}
.fld .sw:after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;margin-top:-4px;pointer-events:none;
  border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg)}
select,input.txt{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);
  padding:9px 26px 9px 10px;font-family:var(--data);font-size:12.5px;color:var(--txt);outline:none;appearance:none;-webkit-appearance:none}
input.txt{padding:9px 10px;font-size:14px}
select:focus,input.txt:focus{border-color:var(--ac)}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tg{font-family:var(--data);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;padding:6px 10px;
  border:1px solid var(--line2);border-radius:14px;color:var(--muted);background:var(--panel)}
.tg.on{border-color:var(--ac);color:var(--ac);background:var(--ac2)}

/* ---------- tabelas ---------- */
table.tbl{width:100%;border-collapse:collapse;font-family:var(--data);font-variant-numeric:tabular-nums}
.tbl th{font-size:8.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted2);font-weight:500;
  padding:7px 8px;text-align:right;background:var(--panel2);border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:8px;font-size:12.5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td:first-child{text-align:left;white-space:normal}
.tbl th.l{text-align:left}
.tbl td.l{text-align:left;white-space:normal}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.eu td{background:rgba(255,77,46,.10)}
.tbl tr.cl:active td{background:var(--panel3)}
.tbl .nm{font-family:var(--body);font-size:13.5px;font-weight:500;display:block;line-height:1.25}
.tbl .sub{font-family:var(--data);font-size:9.5px;color:var(--muted2);letter-spacing:.3px;display:block;margin-top:2px}
.tbl .zn{display:inline-block;width:3px;height:13px;vertical-align:-2px;margin-right:6px;border-radius:2px;background:transparent}
.tbl .zn.s{background:var(--ac)} .tbl .zn.d{background:var(--err)}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}

/* ---------- linha de conta ---------- */
.ln{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--line);font-family:var(--data);font-size:12.5px}
.ln:last-child{border-bottom:0}
.ln .lb{color:var(--muted);font-size:12px;flex:1;min-width:0;line-height:1.35}
.ln .lb i{display:block;font-style:normal;font-size:9.5px;color:var(--muted2);margin-top:2px}
.ln .vl{font-weight:600;white-space:nowrap}
.ln.tot{border-top:1px solid var(--line2);border-bottom:0;margin-top:3px;padding-top:9px;font-size:14px}
.ln.tot .lb{color:var(--txt);font-size:11px;text-transform:uppercase;letter-spacing:1.2px}

/* ---------- medidor ---------- */
.mtr{padding:9px 11px;border-bottom:1px solid var(--line)}
.mtr:last-child{border-bottom:0}
.mtr .t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mtr .t b{font-family:var(--data);font-size:12px;font-weight:500;letter-spacing:.3px;color:var(--txt)}
.mtr .t i{font-style:normal;font-family:var(--data);font-size:14px;font-weight:600}
.bar{position:relative;height:4px;background:var(--panel3);border-radius:2px;margin-top:7px;overflow:visible}
.bar i{display:block;height:100%;background:var(--ac);border-radius:2px}
.bar i.g{background:var(--gold)} .bar i.r{background:var(--err)}
.bar u{position:absolute;top:-3px;width:1px;height:10px;background:var(--muted);opacity:.85}
.mtr .ex{font-family:var(--data);font-size:9.5px;color:var(--muted2);margin-top:6px;line-height:1.45}

/* ---------- graficos ---------- */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:.7}
.chart .zl{stroke:var(--line2);stroke-width:1}
.chart .ax{fill:var(--muted2);font-family:var(--data);font-size:7px}
.chart .lin{fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.chart .lin.b{stroke:var(--gold)}
.chart .dot{fill:var(--panel);stroke:var(--ac);stroke-width:1.3}
.chart .dot.b{stroke:var(--gold)}
.chart .bp{fill:var(--pos)} .chart .bn{fill:var(--err)}
.chart .br{fill:var(--ac)} .chart .bd{fill:#3A4B5C}
.leg{display:flex;gap:13px;flex-wrap:wrap;margin-top:9px;padding:0 2px}
.leg span{font-family:var(--data);font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.leg i{width:8px;height:8px;border-radius:2px;display:block;flex:none}
.stk{display:flex;height:11px;border-radius:2px;overflow:hidden;background:var(--panel3);margin-bottom:10px}
.stk i{display:block;height:100%}
.pw{padding:11px 8px 4px}

/* ---------- botoes ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--ac);color:#1A0703;
  font-family:var(--data);font-weight:600;font-size:12px;letter-spacing:1.1px;text-transform:uppercase;
  padding:12px 12px;border-radius:var(--r);width:100%;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.sec2{background:transparent;border:1px solid var(--line2);color:var(--txt)}
.btn.gh{background:var(--panel3);color:var(--txt);border:1px solid var(--line2)}
.btn.warn{background:var(--gold);color:#161005}
.btn.dgr{background:transparent;border:1px solid var(--err);color:var(--err)}
.btn[disabled]{opacity:.32;pointer-events:none}
.btn.sm{padding:9px 10px;font-size:11px}
.bt2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bt3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gap{height:8px}

/* ---------- trocador de ativo ---------- */
.swx{position:relative;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:11px;padding:1px 1px 3px;-webkit-overflow-scrolling:touch;overflow-anchor:none}
.swx::-webkit-scrollbar{display:none}
.sx{flex:0 0 auto;text-align:left;padding:8px 13px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);min-width:96px}
.sx b{display:block;font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap}
.sx span{display:block;font-family:var(--data);font-size:8.5px;color:var(--muted2);letter-spacing:.9px;
  margin-top:4px;white-space:nowrap;text-transform:uppercase}
.sx:active{background:var(--panel3)}
.sx.on{border-color:var(--ac);background:var(--ac2)}
.sx.on b{color:var(--ac)}
.sx.on span{color:var(--ac);opacity:.75}

/* ---------- segmentos ---------- */
.seg{display:flex;border-bottom:1px solid var(--line2);margin-bottom:11px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:9px 13px;font-family:var(--data);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted2);border-bottom:2px solid transparent;white-space:nowrap}
.seg button.on{color:var(--ac);border-color:var(--ac)}

/* ---------- progresso ---------- */
.prg{height:3px;background:var(--panel3);border-radius:2px;overflow:hidden;margin:9px 0}
.prg i{display:block;height:100%;background:var(--ac)}

/* ---------- itens de lista ---------- */
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 11px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:active{background:var(--panel3)}
.item .p{flex:1;min-width:0}
.item .p b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.item .p span{display:block;font-family:var(--data);font-size:10px;color:var(--muted2);letter-spacing:.3px;margin-top:3px;line-height:1.4}
.item .d{text-align:right;font-family:var(--data);font-size:12.5px;white-space:nowrap}
.item .d span{display:block;font-size:9px;color:var(--muted2);letter-spacing:.5px;margin-top:3px}
.tag{display:inline-block;font-family:var(--data);font-size:9px;font-weight:600;letter-spacing:.5px;padding:2px 5px;border-radius:2px;text-transform:uppercase}
.tag.v{background:var(--pos2);color:var(--pos)} .tag.a{background:#2C2410;color:var(--gold)}
.tag.r{background:#2C1512;color:#EE8880} .tag.n{background:var(--panel3);color:var(--muted2)}

/* ---------- radar ---------- */
.nt{display:flex;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.nt:last-child{border-bottom:0}
.nt i{font-style:normal;width:2px;border-radius:1px;background:var(--line2);flex:none}
.nt i.v{background:var(--pos)} .nt i.r{background:var(--err)} .nt i.a{background:var(--gold)}
.nt em{font-style:normal;font-family:var(--data);font-size:9.5px;color:var(--muted2);margin-right:6px}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:#070A0E;border-top:1px solid var(--line2);
  display:flex;max-width:560px;margin:0 auto;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted2);
  font-family:var(--data);font-size:8.5px;letter-spacing:.9px;text-transform:uppercase;padding:3px 0}
.nav button.on{color:var(--ac)}
.nav svg{width:19px;height:19px}

/* ---------- modal ---------- */
.mod{position:fixed;inset:0;z-index:60;background:rgba(2,5,8,.85);display:flex;align-items:flex-end;justify-content:center}
.mod>div{background:var(--bg2);border:1px solid var(--line2);border-radius:8px 8px 0 0;width:100%;max-width:560px;
  max-height:88vh;overflow:auto;padding:15px 13px calc(16px + env(safe-area-inset-bottom));animation:up .16s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- abertura ---------- */
.hero{padding:44px 16px 20px;text-align:center}
.hero h1{font-size:33px;line-height:.98;letter-spacing:.4px}
.hero h1 em{font-style:normal;color:var(--ac);display:block}
.hero p{color:var(--muted2);font-family:var(--data);letter-spacing:1.5px;text-transform:uppercase;font-size:9.5px;margin:12px 0 0}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- grid de largada ---------- */
.cor{display:inline-block;width:4px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:7px}
.pos{display:inline-block;min-width:22px;font-family:var(--data);font-weight:600}
.p1{color:var(--gold)} .p2{color:#C9D3DC} .p3{color:#C98B5A}
.res{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.res span{font-family:var(--data);font-size:10px;padding:3px 0;width:26px;text-align:center;border-radius:2px;background:var(--panel3);color:var(--muted)}
.res span.pt{background:var(--pos2);color:var(--pos)}
.res span.pd{background:#2C2410;color:var(--gold)}
.res span.ab{background:#2C1512;color:#EE8880}
.res span.fu{background:transparent;border:1px dashed var(--line2);color:var(--muted2)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
/* =========================================================
   FUNDO DE EQUIPES - simulador de fundo de investimento
   em equipes de automobilismo. arquivo unico, dados locais
   ========================================================= */

const el = id => document.getElementById(id);
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
function normal() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function moeda(n) {
  n = Math.round(n);
  const s = n < 0 ? '-' : '';
  const a = Math.abs(n);
  if (a >= 1e12) return s + 'US$ ' + (a / 1e12).toFixed(a >= 100e12 ? 0 : a >= 10e12 ? 1 : 2).replace('.', ',') + ' tri';
  if (a >= 1e9) return s + 'US$ ' + (a / 1e9).toFixed(a >= 100e9 ? 0 : a >= 10e9 ? 1 : 2).replace('.', ',') + ' bi';
  if (a >= 1e6) return s + 'US$ ' + (a / 1e6).toFixed(a >= 1e8 ? 0 : 1).replace('.', ',') + ' mi';
  if (a >= 1e3) return s + 'US$ ' + Math.round(a / 1e3) + ' mil';
  return s + 'US$ ' + a;
}
function sinal(n) { return (n >= 0 ? '+' : '') + moeda(n); }
function num(n) { return Math.round(n).toLocaleString('pt-BR'); }
function pct(n) { return Math.round(n * 100) + '%'; }
const DB = {
  mem: {},
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { this.mem[k] = v; } },
  get(k) { try { const r = localStorage.getItem(k); return r === null ? (this.mem[k] || null) : r; } catch (e) { return this.mem[k] || null; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } delete this.mem[k]; }
};
const CHAVE = 'fundodeequipes_v1';

/* ---------------- icones ---------------- */
const I = {
  fundo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M9 19V5M14 19v-7M19 19v-11"/><path d="M3 21h18"/></svg>',
  equipes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l2-5h9l4 3h3v3H3z"/><circle cx="7.5" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>',
  mercado: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16l-1.2 10.5a2 2 0 01-2 1.5H7.2a2 2 0 01-2-1.5L4 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>',
  camp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h13l-2.5 4L18 12H5"/><path d="M9 4v8M13 4v8"/></svg>',
  rel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>',
  seta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  volta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>',
  lupa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/></svg>'
};
const ic = (n, s) => '<span style="display:inline-flex;width:' + (s || 15) + 'px;height:' + (s || 15) + 'px">' + I[n] + '</span>';

/* =========================================================
   CONSTANTES DO MUNDO (valores iniciais para ajuste)
   ========================================================= */
const CATS = [

let S = null, TELA = 'fundo';
function novoNomePiloto(usados) {
  for (let k = 0; k < 400; k++) {
    const n = pick(PRENOMES) + ' ' + pick(SOBRENOMES);
    if (!usados[n]) { usados[n] = 1; return n; }
  }
  return 'Piloto ' + ri(100, 999);
}
function novoPiloto(cat, usados, jovem) {
  const f = CATS[cat].piloto;
  const idade = jovem ? ri(16, 19) : cat === 0 ? ri(21, 37) : cat === 1 ? ri(19, 27) : cat === 2 ? ri(17, 23) : ri(15, 19);
  return {
    id: S.pilotos.length, nome: novoNomePiloto(usados), pais: pick(PAISES), idade: idade,
    nivel: ri(f[0], f[1]), pot: Math.round(Math.random() * 100) / 100,
    eq: null, st: novoStPiloto()
  };
}
function novoStPiloto() { return { pts: 0, v: 0, pod: 0, ab: 0, c: 0 }; }
function novoStEquipe() { return { pts: 0, v: 0, pod: 0, ab: 0, c: 0, melhor: 99 }; }
function criarMundo() {
  S.equipes = []; S.pilotos = [];
  const usados = {};
  for (let cat = 0; cat < NCAT; cat++) {
    EQUIPES[cat].forEach(e => {
      const eq = { id: S.equipes.length, nome: e[0], ab: e[1], cor: e[2], cat: cat, base: e[3], dono: null, st: novoStEquipe() };
      eq.p = perfilInicial(eq);
      for (let k = 0; k < 2; k++) {
        const pl = novoPiloto(cat, usados);
        /* equipe forte atrai piloto melhor */
        pl.nivel = clamp(Math.round(pl.nivel * 0.6 + (CATS[cat].piloto[0] + (CATS[cat].piloto[1] - CATS[cat].piloto[0]) * (eq.base - 50) / 40) * 0.4), 20, 99);
        pl.eq = eq.id;
        S.pilotos.push(pl);
        eq.p.pil.push(pl.id);
      }
      S.equipes.push(eq);
    });
  }
}
function perfilInicial(eq) {
  const f = clamp((eq.base - 50) / 40, 0, 1);
  const carro = clamp(eq.base + ri(-2, 2), 30, 96);
  return {
    carro: carro,
    confiab: clamp(Math.round(62 + f * 26 + ri(-8, 8)), 35, 97),
    pil: [],

    fabrica: clamp(Math.round(25 + f * 55 + ri(-10, 10)), 5, 96),

    motor: eq.cat === 0 ? (eq.base >= 83 ? 'fabrica' : eq.base >= 74 ? 'parceria' : 'cliente') : 'cliente',

    gestao: clamp(Math.round(30 + f * 30 + ri(-15, 15)), 8, 95),
    academia: clamp(Math.round(10 + f * 40 + ri(-10, 10)), 0, 95),

  };
}

/* =========================================================
   CALENDARIO E SIMULACAO DE CORRIDA
   ========================================================= */
function passos() { return ATIVAS.reduce((m, c) => Math.max(m, CATS[c].etapas), 0); }
/* em qual passo do calendario geral cada etapa da categoria acontece */
function passoDaEtapa(cat, k) { return Math.round((k + 1) * passos() / CATS[cat].etapas) - 1; }
function gerarCalendarios() {
  S.cal = [];
  for (let cat = 0; cat < NCAT; cat++) {
    S.cal[cat] = PISTAS[cat].slice(0, CATS[cat].etapas).map((p, k) => ({ pista: p, passo: passoDaEtapa(cat, k), res: null }));
  }
  S.passos = passos();
}
function equipesDa(cat) { return S.equipes.filter(e => e.cat === cat); }
function ritmo(eq, pl) {
  const ruido = 4 * (1.15 - eq.p.simulador / 100 * 0.3);
  return eq.p.carro * 0.70 + pl.nivel * 0.30 + normal() * ruido;
}
function chanceAbandono(eq) { return (1 - eq.p.confiab / 100) * 0.18; }
function correr(cat, etapa) {
  const lista = [];
  equipesDa(cat).forEach(eq => {
    eq.p.pil.forEach(pid => {
      const pl = S.pilotos[pid];
      const ab = Math.random() < chanceAbandono(eq);
      lista.push({ eq: eq.id, pl: pid, r: ab ? -1 : ritmo(eq, pl), ab: ab });
    });
  });
  lista.sort((a, b) => b.r - a.r);
  const res = lista.map((x, i) => {
    const eq = S.equipes[x.eq], pl = S.pilotos[x.pl];
    const pos = x.ab ? null : i + 1;
    const pts = pos && pos <= 10 ? PONTOS[pos - 1] : 0;
    eq.st.c++; pl.st.c++;
    eq.st.pts += pts; pl.st.pts += pts;
    if (x.ab) { eq.st.ab++; pl.st.ab++; }
    if (pos === 1) { eq.st.v++; pl.st.v++; }
    if (pos && pos <= 3) { eq.st.pod++; pl.st.pod++; }
    if (pos) eq.st.melhor = Math.min(eq.st.melhor, pos);
    return { eq: x.eq, pl: x.pl, pos: pos, pts: pts };
  });
  etapa.res = res;
  invalidarTabelas();
  /* noticia so do que interessa ao fundo */
  res.forEach(r => {
    if (!ehMeu(r.eq)) return;
    const eq = S.equipes[r.eq], pl = S.pilotos[r.pl];
    if (r.pos === 1) noticia(pl.nome + ' venceu o GP de ' + etapa.pista + ' (' + DIVS[cat] + ') pela ' + eq.nome + '.', 'v');
    else if (r.pos && r.pos <= 3) noticia(pl.nome + ' fez podio no GP de ' + etapa.pista + ' (' + DIVS[cat] + '): ' + r.pos + 'o lugar.', 'v');
  });
}
function simularPasso() {
  ATIVAS.forEach(cat => {
    S.cal[cat].forEach(et => { if (et.passo === S.passo && !et.res) correr(cat, et); });
  });
  S.passo++;
}
function completarTemporada() {
  while (S.passo < S.passos) simularPasso();
}
function etapasCorridas(cat) { return S.cal[cat].filter(e => e.res).length; }
let TB_CACHE = {};
function invalidarTabelas() { TB_CACHE = {}; }
function ordemEquipe(a, b) {
  return b.st.pts - a.st.pts || b.st.v - a.st.v || b.st.pod - a.st.pod || a.st.melhor - b.st.melhor || a.nome.localeCompare(b.nome);
}
function tabelaCat(cat) {
  if (TB_CACHE['e' + cat]) return TB_CACHE['e' + cat];
  return TB_CACHE['e' + cat] = equipesDa(cat).slice().sort(ordemEquipe);
}
function tabelaPilotos(cat) {
  if (TB_CACHE['p' + cat]) return TB_CACHE['p' + cat];
  return TB_CACHE['p' + cat] = S.pilotos.filter(p => p.eq !== null && S.equipes[p.eq].cat === cat)
    .sort((a, b) => b.st.pts - a.st.pts || b.st.v - a.st.v || b.st.pod - a.st.pod || a.nome.localeCompare(b.nome));
}
function posDaEquipe(eq) {
  const i = tabelaCat(eq.cat).findIndex(x => x.id === eq.id);
  return i < 0 ? 99 : i + 1;
}
function resultadosDaEquipe(eq) {
  return S.cal[eq.cat].map(et => {
    if (!et.res) return null;
    const meus = et.res.filter(r => r.eq === eq.id);
    return meus;
  });
}

   FUNDO
   ========================================================= */
function novoFundo(nome, idEquipe) {
  S.f = { nome: nome, caixa: 0, inicial: 0, divida: 0, reputacao: 15, hist: [], conquistas: {}, arquivo: [] };
  S.temporada = 1; S.passo = 0; S.fase = 'pre';
  S.donos = []; S.noticias = []; S.relatorio = null;
  gerarCalendarios();
  invalidarTabelas();
  S.donos.push(idEquipe);
  S.equipes[idEquipe].p.compra = { temp: 1, preco: 0, carro: S.equipes[idEquipe].p.carro, cat: S.equipes[idEquipe].cat };
  S.equipes[idEquipe].p.hist = [];
  noticia('Fundo ' + nome + ' constituido com a ' + S.equipes[idEquipe].nome + ' (' + DIVS[S.equipes[idEquipe].cat] + ').', 'v');
  salvar();
}
function meus() { return S.donos.map(id => S.equipes[id]); }
function ehMeu(id) { return S.donos.indexOf(id) >= 0; }
function noticia(t, tipo) {
  S.noticias.unshift({ t: t, tipo: tipo || '', temp: S.temporada });
  if (S.noticias.length > 60) S.noticias.pop();
}

/* =========================================================
   CICLO DE TEMPORADA
   ========================================================= */
function iniciarTemporada() {
  if (!S.donos.length) return 'O fundo precisa de pelo menos uma equipe para a temporada comecar';
  S.fase = 'temp';
  noticia('Temporada ' + S.temporada + ' comecou.', '');
  salvar();
  return null;
}
function avancar(n) {
  for (let i = 0; i < n && S.passo < S.passos; i++) simularPasso();
  if (S.passo >= S.passos) encerrarTemporada();
  salvar();
}
function pularFim() { completarTemporada(); encerrarTemporada(); salvar(); }
function encerrarTemporada() {
  completarTemporada();
  const rel = { temporada: S.temporada, equipes: [], campeoes: [] };
  ATIVAS.forEach(cat => {
    const tb = tabelaCat(cat), tp = tabelaPilotos(cat);
    rel.campeoes.push({ cat: cat, equipe: tb[0] ? tb[0].nome : '-', piloto: tp[0] ? tp[0].nome : '-', meu: tb[0] && ehMeu(tb[0].id) });
  });
  S.donos.forEach(id => {
    const eq = S.equipes[id], pos = posDaEquipe(eq), n = equipesDa(eq.cat).length;
    const linha = { id: id, nome: eq.nome, cat: DIVS[eq.cat], pos: pos, n: n, st: JSON.parse(JSON.stringify(eq.st)), campeao: pos === 1 };
    rel.equipes.push(linha);
    if (pos === 1) noticia(eq.nome + ' campea de construtores da ' + DIVS[eq.cat] + '.', 'v');
    eq.p.hist = eq.p.hist || [];
    eq.p.hist.push({ t: S.temporada, cat: DIVS[eq.cat], pos: pos, n: n, pts: eq.st.pts, v: eq.st.v, pod: eq.st.pod, ab: eq.st.ab, carro: eq.p.carro });
    if (eq.p.hist.length > 20) eq.p.hist.shift();
  });
  S.f.hist.push({ t: S.temporada, n: S.donos.length, pts: rel.equipes.reduce((t, x) => t + x.st.pts, 0) });
  if (S.f.hist.length > 40) S.f.hist.shift();
  /* virada */
  S.equipes.forEach(e => { e.st = novoStEquipe(); });
  S.pilotos.forEach(p => { p.st = novoStPiloto(); });
  invalidarTabelas();
  S.temporada++;
  S.passo = 0;
  gerarCalendarios();
  S.relatorio = rel;
  S.fase = 'relatorio';
}
function fecharRelatorio() { S.relatorio = null; S.fase = 'pre'; salvar(); }

/* =========================================================
   PERSISTENCIA
   ========================================================= */
let SAVE_PEND = false, SAVE_TIMER = null;
function empacotar() {
  const c = {};
  for (const k in S) c[k] = S[k];
  /* resultado de corrida compacto: [equipe, piloto, posicao] */
  c.cal = S.cal.map(cat => cat.map(et => ({ pista: et.pista, passo: et.passo, res: et.res ? et.res.map(r => [r.eq, r.pl, r.pos === null ? 0 : r.pos]) : null })));
  c.calC = 1;
  return c;
}
function desempacotar(d) {
  if (d.calC && d.cal) {
    d.cal = d.cal.map(cat => cat.map(et => ({
      pista: et.pista, passo: et.passo,
      res: et.res ? et.res.map(a => ({ eq: a[0], pl: a[1], pos: a[2] || null, pts: a[2] && a[2] <= 10 ? PONTOS[a[2] - 1] : 0 })) : null
    })));
    delete d.calC;
  }
  return d;
}
function gravar() {
  SAVE_PEND = false;
  if (SAVE_TIMER) { clearTimeout(SAVE_TIMER); SAVE_TIMER = null; }
  if (!S) return;
  try { DB.set(CHAVE, JSON.stringify(empacotar())); } catch (e) { }
}
function salvar() {
  if (!S) return;
  SAVE_PEND = true;
  if (SAVE_TIMER) return;
  SAVE_TIMER = setTimeout(function () { SAVE_TIMER = null; if (SAVE_PEND) gravar(); }, 600);
}
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && SAVE_PEND) gravar(); });
  if (typeof window !== 'undefined') window.addEventListener('pagehide', function () { if (SAVE_PEND) gravar(); });
}
function carregar() {
  const raw = DB.get(CHAVE);
  if (!raw) return false;
  try {
    const d = desempacotar(JSON.parse(raw));
    if (!d || !d.f || !d.donos || !d.equipes) return false;
    S = d;
    if (!S.noticias) S.noticias = [];
    if (!S.f.conquistas) S.f.conquistas = {};
    if (!S.f.arquivo) S.f.arquivo = [];
    S.passos = passos();
    invalidarTabelas();
    return true;
  } catch (e) { return false; }
}
function apagar() {
  if (SAVE_TIMER) { clearTimeout(SAVE_TIMER); SAVE_TIMER = null; }
  SAVE_PEND = false; DB.del(CHAVE); S = null; TELA = 'fundo'; render();
}

/* ---------------- render ---------------- */
function render() {
  const app = el('app');
  if (!S || !S.f) { app.innerHTML = TELA === 'criacao' ? telaCriacao() : telaInicio(); restaurarFoco(); return; }
  if (S.fase === 'relatorio') {
    const y = ULTIMA === 'rel-fechamento' ? window.scrollY : 0;
    app.innerHTML = topo() + telaRelatorio();
    window.scrollTo(0, y);
    ULTIMA = 'rel-fechamento';
    return;
  }
  const chave = [TELA, UI.abaEquipe, UI.catCamp, UI.visaoCamp, UI.abaRel].join('|');
  if (chave === ULTIMA) SCROLL[chave] = window.scrollY;
  const trilhos = [].map.call(document.querySelectorAll('.swx'), e => e.scrollLeft);
  let corpo = '';
  if (TELA === 'equipes') corpo = telaEquipes();
  else if (TELA === 'camp') corpo = telaCamp();
  else if (TELA === 'rel') corpo = telaRel();
  else corpo = telaFundo();
  app.innerHTML = topo() + corpo + nav();
  if (chave === ULTIMA) window.scrollTo(0, SCROLL[chave] || 0); else window.scrollTo(0, 0);
  ULTIMA = chave;
  restaurarTrilhos(trilhos);
  restaurarFoco();
}
function restaurarTrilhos(anteriores) {
  [].forEach.call(document.querySelectorAll('.swx'), (e, i) => {
    if (anteriores[i] !== undefined) e.scrollLeft = anteriores[i];
    const on = e.querySelector('.sx.on');
    if (!on || !e.getBoundingClientRect) return;
    const cr = e.getBoundingClientRect(), br = on.getBoundingClientRect();
    if (!cr.width || !br.width) return;
    if (br.left < cr.left + 8) e.scrollLeft += br.left - cr.left - 8;
    else if (br.right > cr.right - 8) e.scrollLeft += br.right - cr.right + 8;
  });
}
function restaurarFoco() {
  if (!UI.foco) return;
  const e = el(UI.foco);
  UI.foco = null;
  if (!e) return;
  e.focus();
  try { e.setSelectionRange(e.value.length, e.value.length); } catch (err) { }
}
function abrirModal(h) { el('modal').innerHTML = '<div class="mod" data-a="fechar-fundo"><div>' + h + '</div></div>'; }
function fecharModal() { el('modal').innerHTML = ''; }
function alerta(t, p) {
  abrirModal('<h3>' + esc(t) + '</h3><p class="msg" style="margin:9px 0 14px">' + esc(p) + '</p>' +
    '<button class="btn sec2" data-a="fechar">Entendi</button>');
}

/* ---------------- selects ---------------- */
document.addEventListener('change', e => {
  const alvo = e.target.closest('[data-s]');
  if (!alvo) return;
  const v = alvo.value;
  switch (alvo.dataset.s) {
    case 'catcamp': UI.catCamp = Number(v); break;
    case 'visaocamp': UI.visaoCamp = v; break;
    case 'relf': UI.relFiltro = v === 'todas' ? 'todas' : Number(v); break;
  }
  render();
});
function capturaNome() { const e = el('nome'); if (e) UI.nome = e.value; }

/* ---------------- acoes ---------------- */
document.addEventListener('click', e => {
  const alvo = e.target.closest('[data-a]');
  if (!alvo) return;
  const [a, p1] = alvo.dataset.a.split(':');
  if (a === 'fechar-fundo' && e.target !== alvo) return;
  switch (a) {
    case 'criar':
      if (DB.get(CHAVE) && !(S && S.f)) {
        abrirModal('<h3>Comecar de novo</h3><p class="msg" style="margin:9px 0 14px">Ja existe um fundo salvo neste aparelho. Abrir um novo apaga o anterior.</p>' +
          '<button class="btn warn" data-a="criar-ok">Abrir mesmo assim</button><div class="gap"></div><button class="btn sec2" data-a="fechar">Cancelar</button>');
        break;
      }
    /* falls through */
    case 'criar-ok': fecharModal(); S = {}; criarMundo(); UI.escolha = null; UI.nome = ''; TELA = 'criacao'; render(); break;
    case 'voltar-inicio': capturaNome(); S = null; TELA = 'inicio'; render(); break;
    case 'continuar': if (carregar()) { TELA = 'fundo'; render(); } else alerta('Sem fundo salvo', 'Nao encontrei um jogo salvo neste aparelho.'); break;
    case 'pre': capturaNome(); UI.escolha = Number(p1); render(); break;
    case 'fundar': {
      capturaNome();
      const nome = (UI.nome || '').trim() || 'Fundo Sem Nome';
      novoFundo(nome, UI.escolha);
      TELA = 'fundo'; UI.abaEquipe = 'painel'; render(); break;
    }
    case 'nav': TELA = p1; render(); break;
    case 'iniciar': { const err = iniciarTemporada(); if (err) alerta('Sem equipe', err); render(); break; }
    case 'avancar': avancar(Number(p1)); render(); break;
    case 'pular': pularFim(); render(); break;
    case 'abarel': UI.abaRel = p1; render(); break;
    case 'fecharrel': fecharRelatorio(); TELA = 'fundo'; render(); break;
    case 'verequipe': UI.equipe = Number(p1); TELA = 'equipes'; render(); break;
    case 'abaequipe': UI.abaEquipe = p1; render(); break;
    case 'apagar':
      abrirModal('<h3>Apagar o fundo</h3><p class="msg" style="margin:9px 0 14px">Isso remove o jogo salvo neste aparelho.</p>' +
        '<button class="btn dgr" data-a="apagar-ok">Apagar</button><div class="gap"></div><button class="btn sec2" data-a="fechar">Cancelar</button>');
      break;
    case 'apagar-ok': fecharModal(); apagar(); break;
    case 'fechar': case 'fechar-fundo': fecharModal(); break;
  }
});

(function () { if (carregar()) { TELA = 'fundo'; render(); } else render(); })();
</script>
</body>
</html>
