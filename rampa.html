<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F14">
<meta name="description" content="Rampa - simulador de eleição e governo: faça campanha nos 27 estados, encare debates e sabatinas, vença no voto e governe o Brasil. Grátis.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rampa</title>
<link rel="icon" href="./bnf-favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F14; --bg2:#0D141B; --panel:#111A22; --panel2:#16212B; --panel3:#1C2A36;
  --line:#1D2934; --line2:#2A3946; --txt:#E6EDF3; --muted:#7D8E9E; --muted2:#58697A;
  --ac:#F2C230; --ac2:#2E260B; --green:#22B573; --green2:#0E2A1E; --red:#E2564B; --red2:#2E1210; --blue:#4D8FE6;
  --disp:'Barlow Condensed',Impact,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --data:'JetBrains Mono',ui-monospace,monospace;
  --serif:'Source Serif 4',Georgia,serif;
  --r:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--body);font-size:15px}
body{overscroll-behavior:none;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.4}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.wrap{padding:12px 12px 20px}

.hdr{position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--line2)}
.hdr .r1{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 7px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.brand i{display:inline-block;width:14px;height:10px;background:var(--ac);clip-path:polygon(0 100%,100% 0,100% 100%)}
.ctx{font-family:var(--data);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.ctx b{color:var(--ac);font-weight:500}
.hdr .r2{padding:9px 12px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.big{font-family:var(--data);font-size:26px;font-weight:600;line-height:1;color:var(--ac);letter-spacing:-.5px}
.cap{font-family:var(--data);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2);margin-top:4px}
.delta{font-family:var(--data);font-size:11px;text-align:right;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.stats>div{padding:6px 9px;border-right:1px solid var(--line);min-width:0}
.stats>div:last-child{border-right:0}
.stats span{display:block;font-family:var(--data);font-size:8.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted2)}
.stats b{display:block;font-family:var(--data);font-size:12.5px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 2px 8px}
.sec:first-child{margin-top:2px}
.sec h4{margin:0;font-family:var(--data);font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.sec em{font-style:normal;font-family:var(--data);font-size:10px;color:var(--muted2);text-align:right}
.panel{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);overflow:hidden}
.panel+.panel{margin-top:8px}
.pad{padding:11px 12px}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11px}
.pos{color:var(--green)} .neg{color:var(--red)} .gold{color:var(--ac)}
.mono{font-family:var(--data)}

.bar{display:grid;grid-template-columns:118px 1fr 48px;align-items:center;gap:8px;padding:6px 12px}
.bar+.bar{border-top:1px solid var(--line)}
.bar .nm{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .nm small{display:block;font-family:var(--data);font-size:9px;color:var(--muted2);letter-spacing:.5px}
.bar .tr{height:9px;background:var(--panel3);border-radius:2px;overflow:hidden}
.bar .tr>div{height:100%;border-radius:2px;transition:width .4s}
.bar .vl{font-family:var(--data);font-size:12.5px;text-align:right}
.bar.me .nm{font-weight:700}

/* mapa de estados (cartograma) */
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:420px;margin:0 auto}
.tile{aspect-ratio:1/1;border-radius:4px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;position:relative}
.tile b{font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:.5px;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tile span{font-family:var(--data);font-size:9.5px;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.tile.on{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
.tile .dot{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--ac)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:9px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.stinfo{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:10px;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel)}
.stinfo b{font-size:14px}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:64px}
.act:not(:disabled):active{background:var(--panel3)}
.act b{font-size:13.5px}
.act span{font-size:11.5px;color:var(--muted);line-height:1.35}
.act .cost{font-family:var(--data);font-size:10px;color:var(--ac);margin-top:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:20px;padding:6px 11px;font-size:12.5px;text-align:left}
.chip.on{border-color:var(--ac);color:var(--ac)}

.card{border:1px solid var(--ac);background:linear-gradient(180deg,#1A1708,var(--panel));border-radius:var(--r);padding:13px 13px 12px}
.card .kick{font-family:var(--data);font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--ac)}
.card h3{margin:5px 0 6px;font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.3px;line-height:1.1}
.card p{margin:0 0 10px;font-size:13.5px;line-height:1.5;color:#C9D4DE}
.card.blue{border-color:var(--blue);background:linear-gradient(180deg,#0C1626,var(--panel))}
.card.blue .kick{color:var(--blue)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line2);background:var(--panel2);border-radius:var(--r);padding:10px 11px;font-size:13.5px;line-height:1.4}
.opt+.opt{margin-top:6px}
.opt:active{background:var(--panel3)}
.opt small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.opt.on{border-color:var(--ac);background:var(--ac2)}
.card.res{border-color:var(--line2);background:var(--panel)}
.row2{display:flex;gap:6px}.row2>.opt{margin:0!important}

.btn{display:block;width:100%;background:var(--ac);color:#1A1500;font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:1.2px;text-transform:uppercase;padding:13px;border-radius:var(--r);text-align:center;text-decoration:none}
.btn.sec2{background:var(--panel2);color:var(--txt);border:1px solid var(--line2)}
.btn.grn{background:var(--green);color:#03170D}
.btn+.btn{margin-top:8px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(180deg,transparent,var(--bg) 30%);padding:18px 12px calc(12px + env(safe-area-inset-bottom))}
.foot>div{max-width:536px;margin:0 auto}

.log{list-style:none;margin:0;padding:0}
.log li{padding:7px 12px;font-size:12.5px;line-height:1.45;color:#C3CED8;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log li b{font-family:var(--data);font-size:10px;color:var(--muted2);font-weight:500;margin-right:6px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-family:var(--data);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);font-weight:500;border-top:0}
th:first-child,td:first-child{text-align:left}
.tw{overflow-x:auto}

.title{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 18px 40px}
.logo{font-family:var(--disp);font-weight:800;font-size:76px;letter-spacing:6px;line-height:.9;text-transform:uppercase}
.logo::after{content:"";display:block;width:100%;height:14px;margin-top:10px;background:var(--ac);clip-path:polygon(0 100%,100% 0,100% 100%)}
.sub{font-family:var(--data);font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);margin:16px 0 26px}
.how{margin:26px 0 0;padding:0;list-style:none;counter-reset:h}
.how li{counter-increment:h;display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:13px;line-height:1.5;color:#C3CED8;margin-bottom:9px}
.how li::before{content:counter(h);font-family:var(--data);color:var(--ac);font-size:12px;padding-top:1px}
.free{display:inline-block;align-self:flex-start;font-family:var(--data);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);border:1px solid var(--green2);background:rgba(34,181,115,.08);padding:5px 9px;border-radius:3px;margin-bottom:14px}

label.fl{display:block;font-family:var(--data);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:16px 2px 7px}
.inp{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:11px 12px;font-size:15px}
.inp:focus{outline:none;border-color:var(--ac)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pk{border:1px solid var(--line2);background:var(--panel);border-radius:var(--r);padding:9px 10px;text-align:left;min-width:0}
.pk.on{border-color:var(--ac);background:var(--ac2)}
.pk b{display:block;font-size:13px}
.pk span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.pk .tg{font-family:var(--data);font-size:9.5px;color:var(--ac);margin-top:4px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.kpi{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:7px 8px;min-width:0}
.kpi span{display:block;font-family:var(--data);font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted2)}
.kpi b{display:block;font-family:var(--data);font-size:14px;font-weight:500;margin-top:3px}
.kpi i{display:block;font-style:normal;font-family:var(--data);font-size:9.5px;margin-top:1px;color:var(--muted2)}
.proj{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.proj:first-child{border-top:0}
.proj b{font-size:13px;display:block}
.proj span{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.proj .pl{font-family:var(--data);font-size:10px;margin-top:3px}
.mini{border:1px solid var(--line2);background:var(--panel2);border-radius:var(--r);padding:7px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.mini.y{border-color:var(--ac);color:var(--ac)}
.party{display:grid;grid-template-columns:44px 1fr 70px 34px;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);font-size:12.5px}
.party:first-child{border-top:0}
.party .sg{font-family:var(--data);font-weight:600;font-size:11.5px}
.party .sb{height:5px;background:var(--panel3);border-radius:3px;overflow:hidden}
.party .sb>div{height:100%}
.party .st{font-family:var(--data);font-size:11px;text-align:right}
.spark{display:block;width:100%;height:46px}
.tag{display:inline-block;font-family:var(--data);font-size:9.5px;letter-spacing:.8px;padding:2px 6px;border-radius:3px;border:1px solid var(--line2);color:var(--muted)}
.tag.ok{color:var(--green);border-color:var(--green2)} .tag.bad{color:var(--red);border-color:var(--red2)}

/* estúdio */
.studio{margin:12px 12px 0;border-radius:6px;overflow:hidden;position:relative;height:118px;background:
  radial-gradient(ellipse 60% 70% at 50% 120%,rgba(242,194,48,.25),transparent 70%),
  repeating-linear-gradient(90deg,#16212B 0 38px,#121B24 38px 76px);border:1px solid var(--line2)}
.studio::before{content:"";position:absolute;left:8%;right:8%;bottom:18px;height:22px;border-radius:50% 50% 6px 6px;background:linear-gradient(180deg,#2A3946,#18232E);box-shadow:0 -6px 20px rgba(0,0,0,.4)}
.studio .lbl{position:absolute;left:14px;bottom:10px;z-index:2}
.studio .lbl small{display:block;font-family:var(--data);font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--ac)}
.studio .lbl b{display:block;font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:1px;text-transform:uppercase;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.studio .rec{position:absolute;top:10px;right:12px;font-family:var(--data);font-size:10px;color:var(--red);display:flex;align-items:center;gap:5px}
.studio .rec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.speaker{display:grid;grid-template-columns:42px 1fr;gap:11px;align-items:start}
.avatar{width:42px;height:42px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:17px;color:#0A0F14}
.speaker small{display:block;font-family:var(--data);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.speaker p{margin:3px 0 0;font-family:var(--serif);font-size:17px;line-height:1.45}
.timer{display:flex;align-items:center;gap:12px;margin:14px 0 10px}
.timer b{font-family:var(--disp);font-weight:800;font-size:38px;line-height:1;min-width:82px}
.timer .tb{flex:1;height:5px;background:var(--panel3);border-radius:3px;overflow:hidden}
.timer .tb>div{height:100%;background:var(--green);width:100%}
.timer.low b{color:var(--red)} .timer.low .tb>div{background:var(--red)}
textarea.ans{width:100%;min-height:118px;resize:vertical;background:#070B0F;border:1px solid var(--line2);border-radius:var(--r);padding:11px 12px;font-family:var(--serif);font-size:16px;line-height:1.45}
textarea.ans:focus{outline:none;border-color:var(--txt)}
.sug{display:block;width:100%;text-align:left;font-size:12.5px;line-height:1.4;border:1px dashed var(--line2);border-radius:var(--r);padding:8px 10px;color:#C3CED8;margin-top:6px}
.score{display:flex;align-items:baseline;gap:12px;margin:4px 0 8px}
.score b{font-family:var(--disp);font-weight:800;font-size:52px;line-height:1}
.fb{margin:0;padding:0;list-style:none}
.fb li{font-family:var(--serif);font-size:15px;line-height:1.45;margin-top:7px}
.fb li b{font-family:var(--data);font-size:12px;margin-right:6px}
.satire{font-size:11px;color:var(--muted2);margin:14px 12px 0;line-height:1.5}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line2);padding:9px 14px;border-radius:var(--r);font-size:13px;z-index:80;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.verdict{font-family:var(--disp);font-weight:800;font-size:40px;line-height:1;letter-spacing:1px;text-transform:uppercase;margin:6px 0 4px}
.quote{background:#F7F5EF;color:#1A1A1A;border-radius:3px;padding:14px 15px;margin-top:14px}
.quote small{display:block;font-family:var(--data);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:#6B6A63}
.quote p{margin:6px 0 0;font-family:var(--serif);font-size:17px;line-height:1.45}
a.back{font-family:var(--data);font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:1px}

/* confete */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.studio .rec::before{animation:none}}
@media (max-width:380px){
  .bar{grid-template-columns:96px 1fr 44px}
  .tile b{font-size:14px} .tile span{font-size:8.5px}
  .kpi b{font-size:12.5px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================================================================
   RAMPA — simulador de eleição e governo (BNF Games)
   Candidatos, partidos, jornalistas e mediadores são fictícios.
   As respostas digitadas são avaliadas no próprio navegador, sem IA paga.
================================================================= */
(function(){
'use strict';

const $app=document.getElementById('app');
const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const f1=x=>(Math.round(x*10)/10).toFixed(1).replace('.',',');
const f2=x=>(Math.round(x*100)/100).toFixed(2).replace('.',',');
const pc=x=>f1(x*100)+'%';
const mon=x=>'R$ '+f1(x)+' mi';
const sg=x=>(x>0?'+':'')+f1(x);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};
const initials=n=>n.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

const store={mem:{},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){this.mem[k]=v}},
  get(k){try{const r=localStorage.getItem(k);return r===null?(this.mem[k]||null):r}catch(e){return this.mem[k]||null}},
  del(k){try{localStorage.removeItem(k)}catch(e){}delete this.mem[k]}};
const KEY='rampa_save_v2',BEST='rampa_best_v1';

/* ---------- geografia ---------- */
const REGS=[{id:'SE',nome:'Sudeste'},{id:'NE',nome:'Nordeste'},{id:'S',nome:'Sul'},{id:'N',nome:'Norte'},{id:'CO',nome:'Centro-Oeste'}];
const RN=id=>REGS.find(r=>r.id===id).nome;
// [UF, nome, região, % do eleitorado, inclinação (-1 esq .. +1 dir), coluna, linha]
const STATES=[

const me=()=>S.camp.cands[0];
const active=()=>S.camp.cands.filter(c=>!c.out);
const aff=(c,st)=>clamp(1.15-Math.abs(c.ideo/2-st.lean)*.5,.35,1.2);
function viceB(sid){const v=VICES.find(x=>x.id===S.player.vice);return (v&&v.bonus[ST(sid).reg])||1}
function regShares(sid){
  const cs=active(),o={};let t=0;
  cs.forEach(c=>{const v=Math.pow(Math.max(1,S.camp.reg[sid][c.id]),1.15);o[c.id]=v;t+=v});
  cs.forEach(c=>o[c.id]/=t);return o;
}
function natShares(){
  const o={};active().forEach(c=>o[c.id]=0);
  STATES.forEach(st=>{const s=regShares(st.id);for(const k in s)o[k]+=s[k]*st.peso});return o;
}
function boost(cid,list,p){expand(list).forEach(sid=>{S.camp.reg[sid][cid]=Math.max(3,S.camp.reg[sid][cid]*(1+p))})}
function gainCore(sid,base){
  const C=S.camp,m=me(),st=ST(sid),s=regShares(sid).P;
  const g=base*aff(m,st)*viceB(sid)*clamp(1.5-s*1.8,.25,1.4)*(C.energy<30?.6:1);
  C.reg[sid].P+=g;return g;
}
function gainP(sid,base,spill){
  const g=gainCore(sid,base);
  if(spill)STATES.filter(s=>s.reg===ST(sid).reg&&s.id!==sid).forEach(s=>gainCore(s.id,base*spill));
  return g;
}
function clog(t){S.camp.log.unshift({w:S.camp.week,r:S.camp.round,t});S.camp.log=S.camp.log.slice(0,16)}
function rivalProms(c){return PROJ.slice().sort((a,b)=>Math.abs(a.ideo-c.ideo)-Math.abs(b.ideo-c.ideo)).slice(0,3).map(p=>p.id)}

function newCampaign(o){
  const P=S.player,party=PT(P.partido);
  const pool=RIVALS.filter(r=>r.partido!==P.partido);
  const riv=o.reelect?shuffle(pool).slice(0,3):pool.slice(0,3);
  const cands=[{id:'P',nome:P.nome,partido:P.partido,ideo:party.ideo,cor:'#F2C230',me:true}];
  riv.forEach((r,i)=>cands.push({id:'R'+i,nome:r.nome,partido:r.partido,ideo:PT(r.partido).ideo,cor:r.cor,home:r.home,str:r.str*(o.reelect?1.08:1)}));
  cands.forEach(c=>{if(!c.me)c.prom=rivalProms(c)});
  const perfil=PERFIS.find(p=>p.id===P.perfil);
  const reg={};
  STATES.forEach(st=>{
    reg[st.id]={};
    cands.forEach(c=>{
      if(c.me){
        let v=(o.reelect?100*(.25+o.aprov/52):perfil.fame)*aff(c,st)*viceB(st.id);
        if(!o.reelect&&st.reg===P.home)v*=perfil.homeMul;
        reg[st.id][c.id]=v;
      }else{
        let v=100*aff(c,st)*c.str;if(st.reg===c.home)v*=1.4;reg[st.id][c.id]=v*R(.9,1.1);
      }
    });
  });
  const vice=VICES.find(v=>v.id===P.vice);
  S.camp={round:1,week:1,weeks:o.weeks,debates:o.debates,debatesDone:[],reelect:!!o.reelect,
    money:o.reelect?40:perfil.money,energy:100,agenda:3,penalty:0,prep:0,
    tvMul:1+(perfil.tv||0)+(vice.tv||0),income:3+(vice.income||0),allyBonus:perfil.ally||0,
    allies:o.allies?o.allies.slice():[],risk:0,cands,reg,und:.24,log:[],ev:null,evRes:null,offer:null,sab:null,sabs:0,
    endorsed:[],used:[],r1:null,hist:[],visits:{},lastDebate:null};
  clog(o.reelect?'Começa a campanha pela reeleição. O governo está em jogo.':'Candidatura registrada. Hora de ganhar o país.');
  startWeek();
}

function startWeek(){
  const C=S.camp;
  C.agenda=Math.max(1,3-C.penalty);C.penalty=0;
  C.ev=null;C.evRes=null;C.offer=null;C.sab=null;C.visits={};
  const debateNow=C.debates.includes(C.week)&&!C.debatesDone.includes(C.week);
  if(debateNow){C.debate=buildDebate('deb');S.phase='debate'}
  if(C.risk>0&&Math.random()<C.risk*.35&&!C.used.includes('pf')){C.ev='pf';C.used.push('pf')}
  else if(Math.random()<.55){
    const pool=CEV.filter(e=>!C.used.includes(e.id)&&!e.only);
    if(pool.length){const e=pick(pool);C.ev=e.id;C.used.push(e.id)}
  }
  if(!debateNow&&C.sabs<3&&Math.random()<.32)C.sab=Math.floor(Math.random()*JOURN.length);
  const rivP=active().filter(c=>!c.me).map(c=>c.partido);
  const avail=PARTIES.filter(p=>p.id!==S.player.partido&&!rivP.includes(p.id)&&!C.allies.includes(p.id)&&Math.abs(p.ideo-me().ideo)<=1.8);
  if(avail.length&&Math.random()<.42+C.allyBonus)C.offer=pick(avail).id;
}

function doAction(a,arg){
  const C=S.camp,A=ACTIONS[a];
  if(C.agenda<=0)return toast('Agenda da semana cheia.');
  if(A.cost>C.money)return toast('Caixa insuficiente.');
  if(A.en>0&&C.energy<A.en)return toast('Sem energia. Descanse.');
  let msg='';
  const sid=UI.st,sn=ST(sid).nome;
  switch(a){
    case 'comicio':{const p=PERFIS.find(x=>x.id===S.player.perfil);const g=gainP(sid,18*(p.rally||1),.35);C.visits[sid]=1;msg=`Comício lotado em ${sn}.`+(g<6?' Mas o estado já está saturado.':'');break}
    case 'corpo':{gainP(sid,8,.2);C.visits[sid]=1;msg=`Corpo a corpo em ${sn}.`;break}
    case 'tv':{STATES.forEach(st=>gainCore(st.id,4.4*C.tvMul));msg='Nova peça de propaganda no ar em todo o país.';break}
    case 'fundos':{const ns=natShares(),lead=Object.keys(ns).sort((x,y)=>ns[y]-ns[x])[0]==='P';const v=R(6,9.5)*(lead?1.2:1);C.money+=v;if(Math.random()<.12)C.risk+=.25;msg=`Jantar com doadores rende ${mon(v)}.`+(lead?' Quem lidera atrai dinheiro.':'');break}
    case 'ataque':{
      const t=C.cands.find(c=>c.id===arg);if(!t)return;
      boost(t.id,'all',-.075);const bk=Math.random()<.3;if(bk)boost('P','all',-.035);
      msg=`Ataque a ${t.nome}.`+(bk?' O eleitor achou baixaria e você também perdeu.':' O golpe acertou.');UI.atk=false;break}
    case 'prep':{if(C.prep>=3)return toast('Já está no máximo de preparo.');C.prep++;msg=`Treino de debate (preparo ${C.prep}/3).`;break}
    case 'apoio':{
      const t=C.cands.find(c=>c.id===arg);if(!t)return;
      const d=Math.abs(t.ideo-me().ideo),ok=Math.random()<clamp(.8-d*.22,.12,.85);
      C.endorsed.push(t.id);
      if(ok){STATES.forEach(st=>{C.reg[st.id].P+=(t.r1share||.1)*130*aff(t,st)});msg=`${t.nome} declara apoio a você no 2º turno!`}
      else msg=`${t.nome} recusa o apoio e fica neutro.`;
      UI.apoio=false;break}
    case 'descanso':msg='Dia de descanso e reunião de estratégia.';break;
  }
  C.money-=A.cost;C.energy=clamp(C.energy-A.en,0,100);C.agenda--;
  clog(msg);save();render();
}

function rivalsAct(){
  const C=S.camp;
  active().filter(c=>!c.me).forEach(c=>{
    const n=C.round===2?4:3;
    for(let k=0;k<n;k++){
      const ws=STATES.map(st=>st.peso*Math.pow(aff(c,st),2));let t=ws.reduce((a,b)=>a+b),x=Math.random()*t,i=0;
      while(i<ws.length-1&&x>ws[i]){x-=ws[i];i++}
      const st=STATES[i];
      const hit=(sid,b)=>{const s=regShares(sid)[c.id];C.reg[sid][c.id]+=b*aff(c,ST(sid))*c.str*clamp(1.5-s*1.8,.25,1.4)*R(.7,1.3)};
      hit(st.id,10);STATES.filter(s=>s.reg===st.reg&&s.id!==st.id).forEach(s=>hit(s.id,2.8));
    }
    STATES.forEach(st=>C.reg[st.id][c.id]+=1.6*aff(c,st));
  });
  const ns=natShares(),rv=active().filter(c=>!c.me);
  if(rv.length&&Math.random()<.22){
    const lead=Object.keys(ns).sort((a,b)=>ns[b]-ns[a])[0];
    if(lead==='P'||Math.random()<.4){const a=pick(rv);boost('P','all',-.04);clog(`${a.nome} ataca você em inserções na TV.`)}
  }
  STATES.forEach(st=>active().forEach(c=>C.reg[st.id][c.id]*=.985));
}

function endWeek(){
  const C=S.camp;
  C.hist.push({r:C.round,w:C.week,v:natShares().P*(1-C.und)});
  rivalsAct();
  C.money+=C.income+C.allies.reduce((a,id)=>a+PT(id).seats/40,0);
  C.energy=clamp(C.energy+12,0,100);
  C.week++;
  const prog=Math.min(1,(C.week-1)/C.weeks);
  C.und=(C.round===1?.24:.12)*Math.pow(1-prog,.8)+.04;
  if(C.week>C.weeks){election();return}
  startWeek();save();render();top();
}

function election(){
  const C=S.camp,res={reg:{},nat:{}};
  active().forEach(c=>res.nat[c.id]=0);
  STATES.forEach(st=>{
    const s=regShares(st.id),o={};let t=0;
    for(const k in s){o[k]=Math.max(.001,s[k]*R(.93,1.07));t+=o[k]}
    for(const k in o){o[k]/=t;res.nat[k]+=o[k]*st.peso}
    res.reg[st.id]=o;
  });
  const order=Object.keys(res.nat).sort((a,b)=>res.nat[b]-res.nat[a]);
  res.order=order;res.round=C.round;res.abst=R(.18,.23);res.nulos=R(.03,.06);
  if(order.length===2||res.nat[order[0]]>.5)res.winner=order[0];
  else res.second=[order[0],order[1]];
  // estado que decidiu: maior contribuição ponderada para a vantagem do 1º sobre o 2º
  const a=order[0],b=order[1];let best=null,bv=-1;
  STATES.forEach(st=>{const v=st.peso*(res.reg[st.id][a]-res.reg[st.id][b]);if(v>bv){bv=v;best=st.id}});
  res.key=best;res.keyM=res.reg[best][a]-res.reg[best][b];
  C.result=res;S.phase='result';save();render();top();
}

function startRound2(){
  const C=S.camp,res=C.result;
  C.r1=res;
  C.cands.forEach(c=>{if(!res.second.includes(c.id)&&!c.out){c.out=true;c.r1share=res.nat[c.id]||0}});
  const fin=active();
  STATES.forEach(st=>{
    C.cands.filter(c=>c.out&&!c.transferred).forEach(e=>{
      const ws=fin.map(f=>1/(.4+Math.abs(e.ideo-f.ideo)));const t=ws.reduce((a,b)=>a+b);
      fin.forEach((f,i)=>C.reg[st.id][f.id]+=C.reg[st.id][e.id]*.72*ws[i]/t);
    });
  });
  C.cands.forEach(c=>{if(c.out)c.transferred=true});
  C.round=2;C.week=1;C.weeks=3;C.debates=[2];C.debatesDone=[];C.prep=Math.min(C.prep,1);C.und=.12;
  C.money+=8;C.energy=clamp(C.energy+25,0,100);
  clog('Começa o 2º turno. Tudo ou nada.');
  S.phase='camp';startWeek();save();render();top();
}

  act:/\b(vou|vamos|farei|faremos|proponho|meu governo|nosso governo|criar|criarei|investir|ampliar|garantir|implantar|zerar|reduzir|cortar|abrir|levar)\b/,
  emp:/\b(povo|familia|familias|trabalhador|trabalhadores|mae|maes|criancas?|gente|brasileiros?|brasileiras?|juventude|idosos?|voce que)\b/,
  eva:/nao vou responder|proxima pergunta|nao sei|sem comentarios|nao vem ao caso|prefiro nao|nao tenho opiniao/,
  ins:/\b(idiota|burr[oa]|ladr[aoe]|vagabund|lixo|canalha|imbecil|otari|safad)/,
  atk:/\b(adversari|o senhor|a senhora|seu partido|seu governo|seu grupo|mentir|mentira|corrup|hipocr|fugiu)/,
};
function gradeAnswer(text,step,timeout){
  const t=(text||'').trim(),fb=[];
  if(!t)return {s:timeout?6:10,fb:['Ficou em silêncio. A câmera mostrou você sem resposta.']};
  const sk=(step.sug||[]).findIndex(o=>o[0]===t);
  if(sk>=0){
    const q=step.sug[sk][1],s=clamp(Math.round([0,30,50,68][q]+R(-6,6)+(timeout?-8:0)),5,95);
    return {s,fb:[['','Resposta vaga. Soou como slogan.','Resposta razoável, mas previsível. Ninguém vai lembrar dela amanhã.','Resposta preparada pela equipe: firme e concreta. Funcionou, mas soou ensaiada.'][q]]};
  }
  const n=norm(t),words=t.split(/\s+/).length;let s=42;
  if(words<8){s-=14;fb.push('Curta demais. Pareceu que você fugiu do assunto.')}
  else if(words>130){s-=8;fb.push('Longa demais: cortaram o seu microfone antes do fim.')}
  else if(words>=22)s+=6;
  const kw=step.kw||[],hits=kw.filter(k=>n.includes(norm(k))).length;
  if(kw.length){
    if(hits===0){s-=12;fb.push('Não tocou no assunto da pergunta. O eleitor notou a esquiva.')}
    else{s+=Math.min(18,hits*6);if(hits>=2)fb.push('Respondeu exatamente o que foi perguntado.')}
  }
  if(RX.num.test(n)){s+=step.num?13:9;fb.push(step.num?'Deu o número que a entrevistadora cobrou. Ponto para você.':'Trouxe número concreto. Isso passa credibilidade.')}
  else if(step.num){s-=6;fb.push('Ela pediu números e você não deu nenhum.')}
  if(RX.act.test(n)){s+=7;fb.push('Proposta clara, dita na primeira pessoa.')}
  if(RX.emp.test(n)){s+=step.plain?8:5;if(fb.length<3)fb.push('Falou com o eleitor, não com o jornalista.')}
  if(step.plain&&words>70){s-=6;fb.push('Complicou demais. A dona de casa mudou de canal.')}
  if(RX.eva.test(n)){s-=12;fb.push('Frase evasiva. Vai virar meme.')}
  if(RX.ins.test(n)){s-=22;fb.push('A ofensa pegou muito mal. Foi o corte mais compartilhado da noite.')}
  if(RX.atk.test(n)){
    if(step.ctx==='rep'||step.ctx==='rivq'){s+=5;fb.push('Devolveu a provocação com firmeza.')}
    else{s-=4;fb.push('Atacou sem ser perguntado. Soou como fuga.')}
  }
  const caps=t.replace(/[^A-Za-zÀ-ú]/g,''),up=caps.replace(/[^A-ZÀ-Ý]/g,'').length;
  if(caps.length>20&&up/caps.length>.6){s-=8;fb.push('Pareceu que você estava gritando.')}
  if(timeout){s-=8;fb.push('Estourou o tempo: a resposta foi cortada no meio.')}
  s=clamp(Math.round(s+R(-5,5)),5,95);
  if(!fb.length)fb.push(s>=55?'Resposta correta, sem grandes brilhos.':'Resposta morna. Não convenceu.');
  return {s,fb:fb.slice(0,3)};
}

function buildDebate(kind){
  const C=S.camp,riv=active().filter(c=>!c.me);
  if(kind==='sab'){
    const j=JOURN[C.sab],qs=shuffle(SABQ).slice(0,3);
    return {kind,j:C.sab,i:0,res:[],rivS:[],steps:[{t:'intro'},...qs.map((q,k)=>({t:'q',who:j.nome,cor:j.cor,label:`${j.nome} · pergunta ${k+1} de 3`,text:q.q,kw:q.kw,sug:q.o,time:90,ctx:'sab',num:!!j.num,plain:!!j.plain}))]};
  }
  const med=pick(MEDS),q=pick(DEBQ),asker=pick(riv),fl=pick(FLANKS[arch(me().ideo)]);
  const n=(C.round===2?4:0)+C.debatesDone.length+1;
  return {kind,med,tv:pick(TVS),n,i:0,res:[],rivS:[],steps:[
    {t:'intro'},
    {t:'q',who:med,cor:'#7D8E9E',label:`${med} · mediação`,text:q.q,kw:q.kw,sug:q.o,time:90,ctx:'med'},
    {t:'ask'},
    {t:'q',who:asker.nome,cor:asker.cor,label:`${asker.nome} pergunta`,text:fl.ask,kw:fl.kw,sug:REPL.map(r=>[r[0].replace('O senhor fugiu da pergunta, e o eleitor percebeu. ',''),r[1]]),time:90,ctx:'rivq'},
    {t:'q',who:med,cor:'#7D8E9E',label:'Considerações finais',text:'Considerações finais. Olhe para a câmera.',kw:['brasil','povo','futuro','vou','compromisso','familia','trabalho','voto','emprego'],sug:FINAL,time:60,ctx:'final'},
  ]};
}
function stepStart(){
  const D=S.camp.debate,st=D.steps[D.i];
  UI.ans='';D.graded=null;
  if(st&&st.t==='q')D.deadline=Date.now()+st.time*1000;
}
function debNext(){const D=S.camp.debate;D.i++;stepStart();if(D.i>=D.steps.length)debFinish();save();render();top()}
function debAnswer(timeout){
  const D=S.camp.debate,st=D.steps[D.i];if(!st||st.t!=='q'||D.graded)return;
  const g=gradeAnswer(UI.ans,st,timeout);
  D.graded=g;D.res.push({label:st.label,s:g.s,fb:g.fb});save();render();
}
function debAsk(){
  const D=S.camp.debate,r=S.camp.cands.find(c=>c.id===UI.askR),fi=UI.askF;
  if(!r||fi===null)return toast('Escolha o adversário e o tema.');
  const fl=FLANKS[arch(r.ideo)][fi];
  D.rivS.push(R(38,74));
  D.steps.splice(D.i+1,0,
    {t:'show',who:r.nome,cor:r.cor,label:`${r.nome} responde`,text:pick(fl.def)},
    {t:'q',who:'Você',cor:'#F2C230',label:'Sua réplica',text:`Réplica a ${r.nome} sobre ${fl.t}.`,kw:fl.kw,sug:REPL,time:60,ctx:'rep'});
  UI.askR=null;UI.askF=null;debNext();
}
function debFinish(){
  const C=S.camp,D=C.debate;
  const my=D.res.reduce((a,x)=>a+x.s,0)/Math.max(1,D.res.length)+(D.kind==='deb'?C.prep*3:0);
  D.my=Math.round(clamp(my,0,100));
  if(D.kind==='sab'){
    C.sabs++;
    if(D.my>=60){boost('P','all',.045);D.v='win';D.txt='Saiu maior do que entrou.'}
    else if(D.my>=45){boost('P','all',.01);D.v='draw';D.txt='Entrevista correta. Sem estragos.'}
    else{boost('P','all',-.04);D.v='lose';D.txt='Três evasivas viraram manchete.'}
  }else{
    const rv=(D.rivS.length?D.rivS.reduce((a,b)=>a+b,0)/D.rivS.length:55)*.5+R(48,62)*.5;D.rv=Math.round(rv);
    const diff=D.my-rv;
    if(D.my>=58&&diff>2){D.v='win';D.txt='Você venceu a noite.';boost('P','all',.08);active().filter(c=>!c.me).forEach(c=>boost(c.id,'all',-.02))}
    else if(D.my<45||diff<-8){D.v='lose';D.txt='Você perdeu o debate e virou meme.';boost('P','all',-.06)}
    else{D.v='draw';D.txt='Debate termina sem vencedor claro.';boost('P','all',.015)}
    C.debatesDone.push(C.week);C.prep=0;
  }
  C.lastDebate={kind:D.kind,v:D.v,txt:D.txt,my:D.my,w:C.week,r:C.round};
  clog((D.kind==='sab'?'Sabatina: ':'Debate: ')+D.txt+` Nota ${D.my}.`);
  D.done=true;
}
function debSkip(){
  const C=S.camp,D=C.debate;
  if(D.kind==='deb'){boost('P','all',-.045);C.debatesDone.push(C.week);clog('Você faltou ao debate. A cadeira vazia rodou o país inteiro.')}
  else{boost('P','all',-.015);C.agenda=Math.min(3,C.agenda+1);clog('Você desistiu da sabatina. A cadeira vazia virou manchete.')}
  C.debate=null;S.phase='camp';save();render();top();
}

/* timer dos debates */
const fmtT=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
setInterval(()=>{
  if(!S||S.phase!=='debate'||!S.camp.debate)return;
  const D=S.camp.debate,st=D.steps[D.i];
  if(!st||st.t!=='q'||D.graded||D.done)return;
  const left=Math.max(0,D.deadline-Date.now());
  const el=document.getElementById('tmr'),bar=document.getElementById('tmrb'),box=document.getElementById('tmrx');
  if(el)el.textContent=fmtT(left);
  if(bar)bar.style.width=(left/(st.time*1000)*100)+'%';
  if(box)box.classList.toggle('low',left<15000);
  if(left<=0)debAnswer(true);
},250);

  return clamp(.27-d*.12+(G.aprov-40)/160+pop*.03,.02,.75);

function startGov(fz){

    mods:prev?prev.mods:{pibT:0,inflP:0,divT:0,desT:0,aprovB:0},pending:prev?prev.pending:[],
    integ:S.integ===undefined?80:S.integ,hist:prev?prev.hist:[],used:[],dil:null,dilRes:null,log:[],report:null,
    totalQ:prev?prev.totalQ:0,

  const G=S.gov;

function newQuarter(){
  const G=S.gov;
  G.did={};G.projTried=false;G.emendas=0;G.dilRes=null;
  let pool=GEV.filter(e=>!G.used.includes(e.id)&&(!e.cond||e.cond(G)));
  if(G.integ<60&&!G.used.includes('escandalo')&&Math.random()<(60-G.integ)/80)pool=[GEV.find(e=>e.id==='escandalo')];
  if(!pool.length){G.used=[];pool=GEV.filter(e=>!e.cond||e.cond(G))}
  const e=pick(pool);G.dil=e.id;G.used.push(e.id);
}

function applyEf(ef){
  const G=S.gov,ch=[];
  if(ef.aprov){G.aprov=clamp(G.aprov+ef.aprov,2,95);ch.push(`aprovação ${sg(ef.aprov)}`)}
  if(ef.merc){G.mercado=clamp(G.mercado+ef.merc,0,100);ch.push(`mercado ${sg(ef.merc)}`)}
  if(ef.div){G.divida+=ef.div;ch.push(`dívida ${sg(ef.div)} pp`)}
  if(ef.pibS){G.pibS=(G.pibS||0)+ef.pibS;ch.push(`PIB ${sg(ef.pibS)} pp`)}
  if(ef.inflS){G.inflS=(G.inflS||0)+ef.inflS;ch.push(`inflação ${sg(ef.inflS)} pp`)}
  if(ef.pc){G.pc=clamp(G.pc+ef.pc,0,12);ch.push(`capital político ${ef.pc>0?'+':''}${ef.pc}`)}
  if(ef.integ)G.integ=clamp(G.integ+ef.integ,0,100);
  const satF=(f,v)=>{for(const k in G.coal)if(f(PT(k)))G.coal[k]=clamp(G.coal[k]+v,0,100)};
  if(ef.satAll){satF(()=>true,ef.satAll);ch.push(`base aliada ${ef.satAll>0?'satisfeita':'irritada'}`)}
  if(ef.satCentrao)satF(p=>p.centrao,ef.satCentrao);
  if(ef.satRight)satF(p=>p.ideo>.4,ef.satRight);
  if(ef.satLeft)satF(p=>p.ideo<-.4,ef.satLeft);
  ['pibT','inflP','divT','desT','aprovB'].forEach(k=>{if(ef[k])G.mods[k]+=ef[k]});
  return ch.join(' · ');
}
function dilChoose(i){
  const G=S.gov,e=GEV.find(x=>x.id===G.dil),o=e.o[i];
  const ch=applyEf(o.ef);G.dilRes={t:e.t,o:o.t,ch};glog(`${e.t}: ${o.t}.`);G.dil=null;save();render();
}
function sendProj(id){
  const G=S.gov,p=PJ(id);
  if(G.projTried)return toast('Só um projeto por trimestre.');
  if(G.pc<p.pc)return toast('Capital político insuficiente.');
  G.pc-=p.pc;G.projTried=true;
  let y=0;PARTIES.forEach(pt=>{y+=seatsOf(pt.id)*clamp(partyYes(pt,p)+R(-.08,.08),0,1)});
  y+=(AVULSOS-14)*clamp(avulsoYes()+R(-.1,.1),0,1);y=Math.round(y);
  const need=QUORUM[p.tipo],ok=y>=need;
  G.lastVote={id,y,need,ok};
  if(ok){
    G.passed.push(id);applyEf(p.ef);
    if(p.later)G.pending.push({at:G.totalQ+(p.lag||0),ef:p.later,nome:p.nome});
    for(const k in G.coal){const d=Math.abs(PT(k).ideo-p.ideo);G.coal[k]=clamp(G.coal[k]+(1-d)*6,0,100)}
    glog(`APROVADO: ${p.nome} (${y} votos, precisava ${need}).`);
    const pr=G.prom.find(x=>x.id===id&&x.st==='pend');
    if(pr){pr.st='ok';G.aprov=clamp(G.aprov+2,2,95);glog(`Promessa de campanha cumprida: ${p.nome}.`)}
  }else{
    G.failed.push(id);G.aprov=clamp(G.aprov-2,2,95);
    glog(`DERROTA: ${p.nome} teve só ${y} votos (precisava ${need}).`);
  }
  save();render();
}
const GACT={
  emendas:{nome:'Liberar emendas',desc:'Verba para as bases dos deputados. Aumenta a fidelidade nas votações deste trimestre.',pc:2},
  minis:{nome:'Oferecer ministério',desc:'Traz um partido para a base do governo.',pc:3},
  pron:{nome:'Pronunciamento em rede',desc:'Fala à nação em cadeia de rádio e TV.',pc:1},
  viagem:{nome:'Viagem internacional',desc:'Busca investimentos e acordos lá fora.',pc:2},
};
function gAct(a,arg){
  const G=S.gov,A=GACT[a];
  if(G.did[a])return toast('Já feito neste trimestre.');
  if(G.pc<A.pc)return toast('Capital político insuficiente.');
  switch(a){
    case 'emendas':G.emendas=.12;G.divida+=.25;for(const k in G.coal)G.coal[k]=clamp(G.coal[k]+10,0,100);glog('Emendas liberadas: base mais fiel, contas públicas piores.');break;
    case 'minis':{const p=PT(arg);if(!p||inCoal(p.id))return;const d=Math.abs(p.ideo-PT(S.player.partido).ideo);
      if(d>2.2&&Math.random()<.6){G.pc-=1;G.did[a]=true;UI.minis=false;glog(`${p.nome} recusa o ministério: distância ideológica grande demais.`);save();render();return}
      G.coal[p.id]=d>1.5?45:60;G.aprov=clamp(G.aprov-1,2,95);G.integ=clamp(G.integ-2,0,100);UI.minis=false;glog(`${p.nome} ganha um ministério e entra na base (+${seatsOf(p.id)} deputados).`);break}
    case 'pron':{const v=G.aprov<30?R(-2,2):R(-1,3);G.aprov=clamp(G.aprov+v,2,95);glog(`Pronunciamento em rede nacional: aprovação ${sg(v)}.`);break}
    case 'viagem':G.mercado=clamp(G.mercado+5,0,100);G.aprov=clamp(G.aprov+.5,2,95);glog('Viagem internacional traz anúncios de investimento.');break;
  }
  G.pc-=A.pc;G.did[a]=true;save();render();
}

function endQuarter(){
  const G=S.gov,M=G.mods,before={aprov:G.aprov,pib:G.pib,infl:G.infl,desemp:G.desemp,selic:G.selic,divida:G.divida,mercado:G.mercado,base:baseSeats()};
  const news=[];
  G.totalQ++;
  G.pending=G.pending.filter(p=>{if(G.totalQ>=p.at){applyEf(p.ef);news.push(`Efeitos de longo prazo de "${p.nome}" chegam à economia.`);return false}return true});
  const trend=1.9+M.pibT+(G.mercado-50)*.02-Math.max(0,G.selic-9)*.15;
  G.pib=clamp(.6*G.pib+.4*trend+(G.pibS||0)+R(-.5,.5),-6,8);G.pibS=0;
  const iT=3.5+(G.divida-76)*.04+(50-G.mercado)*.05+Math.max(0,G.pib-2.5)*.5-(G.selic-10.5)*.3+M.inflP;
  G.infl=clamp(G.infl+(iT-G.infl)*.35+(G.inflS||0)+R(-.3,.3),0,25);G.inflS=0;
  const ds=clamp((G.infl-3.5)*.4-(G.selic-9.5)*.15+(G.pib-2)*.08,-1,1.25);
  G.selic=clamp(Math.round((G.selic+ds)*4)/4,2,25);
  G.desemp=clamp(G.desemp-(G.pib-1.6)*.22+M.desT+R(-.15,.15),3,22);
  const dd=.35+M.divT+(G.selic-G.infl-G.pib)*.02;
  G.divida=clamp(G.divida+dd,30,160);
  G.mercado=clamp(G.mercado+(50-G.mercado)*.1-(dd-.4)*4+R(-2,2),0,100);
  const hm=G.q<=2?(G.mandato===1?8:4):0;
  const aT=44+(G.pib-1.5)*3.5-(G.infl-4)*2.5-(G.desemp-8)*2+M.aprovB+hm-(G.mandato===2?3:0);
  G.aprov=clamp(G.aprov+(aT-G.aprov)*.25+R(-1.2,1.2),2,95);
  G.prom.forEach(p=>{if(p.st==='pend'&&G.q>=p.dl){p.st='bad';G.aprov=clamp(G.aprov-4,2,95);news.push(`Promessa quebrada: "${PJ(p.id).nome}" não saiu do papel no prazo. A oposição exibe o vídeo da campanha.`)}});
  for(const k in G.coal){
    const p=PT(k);G.coal[k]=clamp(G.coal[k]-(p.centrao?6:4)+(G.aprov>50?2:0),0,100);
    if(G.coal[k]<20){delete G.coal[k];news.push(`${p.nome} rompe com o governo e deixa a base.`)}
  }
  G.pc=clamp(G.pc+2+Math.floor(G.aprov/25),0,10);
  if(G.selic!==before.selic)news.push(`Banco Central ${G.selic>before.selic?'sobe':'corta'} a Selic para ${f2(G.selic)}%.`);
  let imp=null;
  if(G.aprov<20&&baseSeats()<200&&!G.impeachTried){
    G.impeachTried=true;
    const coalS=PARTIES.filter(p=>inCoal(p.id)&&p.id!==S.player.partido);
    let v=PARTIES.filter(p=>!inCoal(p.id)).reduce((a,p)=>a+seatsOf(p.id),0)*clamp(1.05-G.aprov/80,.4,.97);
    v+=coalS.reduce((a,p)=>a+seatsOf(p.id)*clamp(.38-G.coal[p.id]/250,.02,.4),0);
    v+=(AVULSOS-14)*clamp(1-G.aprov/45,.2,.9);v=Math.round(v*R(.94,1.06));
    imp={v,ok:v>=342};
    if(!imp.ok){G.aprov=clamp(G.aprov+3,2,95);news.push(`A Câmara rejeita o impeachment: ${v} votos a favor, eram precisos 342.`)}
  }
  G.hist.push({aprov:G.aprov,pib:G.pib,infl:G.infl,desemp:G.desemp,m:G.mandato,q:G.q});
  G.report={before,news,imp,label:qLabel(G.q)};
  S.phase='gov_report';save();render();top();
}
function nextQuarter(){
  const G=S.gov;
  if(G.report&&G.report.imp&&G.report.imp.ok){finish('impeach');return}
  G.report=null;G.q++;
  if(G.q>16){S.phase='mandate_end';save();render();top();return}
  newQuarter();S.phase='gov';save();render();top();
}
function startReelection(){
  S.integ=S.gov.integ;
  newCampaign({weeks:6,debates:[3],reelect:true,aprov:S.gov.aprov,allies:Object.keys(S.gov.coal)});
  S.phase='programa';UI.prog=[];save();render();top();
}
function legacy(kind){
  const G=S.gov,h=G?G.hist:[];
  if(!h.length)return {score:0};
  const avg=k=>h.reduce((a,x)=>a+x[k],0)/h.length;
  const a=avg('aprov'),p=avg('pib'),i=avg('infl'),d=avg('desemp');
  const kept=G.prom.filter(x=>x.st==='ok').length,broke=G.prom.filter(x=>x.st==='bad').length;
  let sc=(a-15)+p*5-Math.max(0,i-4)*3-Math.max(0,d-7)*2+G.passed.length+kept*2-broke*2+(G.mandato===2&&kind!=='impeach'?8:0)+(kind==='impeach'?-40:0);
  sc=Math.round(clamp(sc,0,100));
  return {score:sc,a,p,i,d,passed:G.passed.length,kept,broke};
}
function finish(kind){
  S.final={kind,leg:legacy(kind)};
  if(S.final.leg.score){const b=+store.get(BEST)||0;if(S.final.leg.score>b)store.set(BEST,String(S.final.leg.score))}
  S.phase='final';save();render();top();
}

function pollBars(shares,und,cands){
  const list=cands.slice().sort((a,b)=>shares[b.id]-shares[a.id]);
  const mx=Math.max(...list.map(c=>shares[c.id]));
  let h=list.map(c=>{const v=shares[c.id]*(1-und);return `<div class="bar ${c.me?'me':''}"><div class="nm">${esc(c.nome)}${c.me?' (você)':''}<small>${c.partido} · ${ideoLabel(c.ideo)}</small></div><div class="tr"><div style="width:${v/(mx*(1-und))*100}%;background:${c.cor}"></div></div><div class="vl">${pc(v)}</div></div>`}).join('');
  if(und>0)h+=`<div class="bar"><div class="nm muted">Indecisos</div><div class="tr"><div style="width:${und/mx*100}%;background:var(--muted2)"></div></div><div class="vl muted">${pc(und)}</div></div>`;
  return h;
}
function vMap(sharesOf,cands,opts){
  opts=opts||{};
  const cells=[];
  for(let r=0;r<8;r++)for(let c=0;c<6;c++){
    const st=STATES.find(s=>s.c===c&&s.r===r);
    if(!st){cells.push('<div></div>');continue}
    const s=sharesOf(st.id),ids=Object.keys(s).sort((a,b)=>s[b]-s[a]);
    const lead=cands.find(x=>x.id===ids[0]),m=s[ids[0]]-(s[ids[1]]||0);
    const bg=rgba(lead.cor,clamp(.28+m*2.2,.28,.95));
    const lbl=opts.lead?pc(s[ids[0]]):pc(s.P||0);
    cells.push(opts.click?`<button class="tile ${opts.sel===st.id?'on':''}" style="background:${bg}" data-a="st" data-v="${st.id}" aria-label="${st.nome}"><b>${st.id}</b><span>${lbl}</span>${opts.visits&&opts.visits[st.id]?'<i class="dot"></i>':''}</button>`
      :`<div class="tile" style="background:${bg}" title="${st.nome}"><b>${st.id}</b><span>${lbl}</span></div>`);
  }
  return `<div class="map">${cells.join('')}</div><div class="legend">${cands.map(c=>`<span><i style="background:${c.cor}"></i>${esc(c.nome.split(' ')[0])}</span>`).join('')}<span>cor forte = vantagem larga</span></div>`;
}
function vCamp(){
  const C=S.camp,m=me(),ns=natShares(),cs=active();
  const order=Object.keys(ns).sort((a,b)=>ns[b]-ns[a]),pos=order.indexOf('P')+1,myV=ns.P*(1-C.und);
  const prev=C.hist.length?C.hist[C.hist.length-1]:null,dv=prev&&prev.r===C.round?myV-prev.v:null;
  const rLabel=C.reelect?'Reeleição':(C.round===1?'1º turno':'2º turno');
  const nextDeb=C.debates.find(w=>w>=C.week&&!C.debatesDone.includes(w));

  if(C.ev){const e=evOf(C.ev);h+=`<div class="sec"><h4>Aconteceu</h4></div><div class="card"><div class="kick">Urgente</div><h3>${e.t}</h3><p>${e.d}</p>${e.o.map((o,i)=>`<button class="opt" data-a="ev" data-v="${i}">${o.t}</button>`).join('')}</div>`}
  else if(C.evRes)h+=`<div class="sec"><h4>Aconteceu</h4></div><div class="card res"><div class="kick">${C.evRes.t}</div><p class="mt8" style="margin-bottom:0">${C.evRes.r}</p></div>`;
  if(C.sab!==null&&C.sab!==undefined){const j=JOURN[C.sab];h+=`<div class="sec"><h4>Convite</h4></div><div class="card blue"><div class="kick">Hoje · sabatina ${C.sabs+1}</div><h3>${j.nome}</h3><p>${j.estilo} Três perguntas de 90 segundos, com insistência. Aceitar usa 1 atividade da agenda. Recusar libera o dia, mas vira manchete de quem não foi.</p><div class="row2"><button class="opt" data-a="sab" data-v="1" ${C.agenda<=0?'disabled':''}>Sentar na bancada</button><button class="opt" data-a="sab" data-v="0">Recusar</button></div></div>`}
  if(C.offer){const p=PT(C.offer),d=Math.abs(p.ideo-m.ideo);h+=`<div class="sec"><h4>Proposta de aliança</h4></div><div class="card"><div class="kick">${p.id} · ${ideoLabel(p.ideo)}</div><h3>${p.nome}</h3><p>Oferece ${p.seats} deputados, mais tempo de TV e ${mon(p.seats/40)} por semana. ${d>1.1?'<b class="neg">Partido distante do seu: parte da sua base pode estranhar.</b>':'Afinidade razoável com seu programa.'}</p><button class="opt" data-a="offer" data-v="1">Fechar aliança</button><button class="opt" data-a="offer" data-v="0">Recusar</button></div>`}
  h+=`<div class="sec"><h4>A corrida</h4><em>${nextDeb?'Próximo debate: semana '+nextDeb:''}</em></div><div class="panel">${pollBars(ns,C.und,cs)}</div>`;
  const st=ST(UI.st),ss=regShares(st.id),sl=Object.keys(ss).sort((a,b)=>ss[b]-ss[a])[0],slc=C.cands.find(c=>c.id===sl);
  h+=`<div class="sec"><h4>O mapa</h4><em>toque num estado para fazer campanha nele</em></div>`;
  h+=vMap(regShares,cs,{click:true,sel:UI.st,visits:C.visits});

  const dis=a=>{const A=ACTIONS[a];return C.agenda<=0||A.cost>C.money||(A.en>0&&C.energy<A.en)||!!C.ev};
  const acts=Object.keys(ACTIONS).filter(a=>{const A=ACTIONS[a];if(a==='prep'&&!nextDeb)return false;if(A.r2&&(C.round!==2||!C.cands.some(c=>c.out&&!C.endorsed.includes(c.id))))return false;return true});

  if(UI.apoio)h+=`<div class="panel pad mt8"><div class="small muted">Pedir apoio a quem?</div><div class="chips mt8">${C.cands.filter(c=>c.out&&!C.endorsed.includes(c.id)).map(c=>`<button class="chip" data-a="apo" data-v="${c.id}">${esc(c.nome)} · ${pc(c.r1share||0)}</button>`).join('')}<button class="chip" data-a="apox">Cancelar</button></div></div>`;
  if(C.prep&&nextDeb)h+=`<p class="tiny muted mt8 mono">Preparo para debate: ${'●'.repeat(C.prep)}${'○'.repeat(3-C.prep)}</p>`;
  if(C.allies.length)h+=`<p class="tiny muted mt8">Coligação: ${[m.partido,...C.allies].join(' · ')}</p>`;
  if(S.prom&&S.prom.length)h+=`<div class="sec"><h4>O seu programa</h4><em>registrado no TSE</em></div><div class="panel pad small">${S.prom.map(id=>`<div style="margin-bottom:4px"><b>${PJ(id).nome}</b> <span class="tiny muted">${dlLabel(promDeadline(PJ(id)))}</span></div>`).join('')}</div>`;
  h+=`<div class="sec"><h4>Diário de campanha</h4></div><div class="panel"><ul class="log">${C.log.map(l=>`<li><b>${l.r===2?'2T ':''}S${l.w}</b>${esc(l.t)}</li>`).join('')}</ul></div>`;
  h+='</div>';
  const blocked=C.ev||C.offer||(C.sab!==null&&C.sab!==undefined);
  h+=`<div class="foot"><div><button class="btn" data-a="endweek" ${blocked?'disabled':''}>${blocked?'Responda aos acontecimentos da semana':C.week===C.weeks?'Ir para a votação':'Encerrar semana'}</button></div></div>`;
  return h;
}

function shuffleFixed(a,seed){return a.map((x,i)=>[x,(i*7+seed*3)%5]).sort((p,q)=>p[1]-q[1]).map(p=>p[0])}
function vDebate(){
  const C=S.camp,D=C.debate,st=D.steps[D.i];
  const sab=D.kind==='sab',j=sab?JOURN[D.j]:null;
  let h=`<div class="studio"><span class="rec">AO VIVO</span><div class="lbl"><small>${sab?`Sabatina ${C.sabs+(D.done?0:1)} · rádio e coluna`:`Debate ${D.n} · ${D.tv}`}</small><b>${sab?esc(j.nome):'No estúdio'}</b></div></div>`;
  h+=`<div class="wrap">`;
  h+=`<div class="tiny muted mono" style="display:flex;justify-content:space-between;gap:10px;margin:0 2px 10px"><span>${sab?esc(j.estilo):'mediação: '+esc(D.med)}</span><span>${sab?'':(active().length)+' na mesa'}</span></div>`;
  h+=`<div class="panel pad">`;
  if(D.done){
    const col=D.v==='win'?'pos':D.v==='lose'?'neg':'gold';
    h+=`<div class="tiny muted mono">${sab?'A ENTREVISTA':'A NOITE'}</div><div class="score"><b class="${col}">${D.my}</b><span style="font-family:var(--serif);font-size:18px;font-weight:600">${D.txt}</span></div>`;
    if(!sab)h+=`<p class="tiny muted mono" style="margin:0 0 6px">Média dos adversários: ${D.rv}</p>`;
    h+=`<ul class="fb">${D.res.map(r=>`<li><b class="${r.s>=60?'pos':r.s<45?'neg':'gold'}">${r.s}</b>${esc(r.fb[0])}</li>`).join('')}</ul>`;
    h+=`<button class="btn grn mt16" data-a="debend">${sab?'Sair da bancada':'Sair do estúdio'}</button>`;
  }else if(st.t==='intro'){
    h+=sab?`<p style="font-family:var(--serif);font-size:17px;line-height:1.45;margin:0 0 12px">Três perguntas de 90 segundos. Escreva sua resposta: o jogo avalia se você respondeu o que foi perguntado, se trouxe números e propostas, e se falou com o eleitor. Evasivas viram manchete.</p>`
      :`<p style="font-family:var(--serif);font-size:17px;line-height:1.45;margin:0 0 6px">${C.round===2?'Só dois na mesa. Toda pergunta é para você ou para ele.':'Mesa cheia. Uma pergunta da mediação, uma sua para um adversário, uma de um adversário para você e as considerações finais.'}</p><p class="tiny muted" style="margin:0 0 12px">Preparo: ${'●'.repeat(C.prep)}${'○'.repeat(3-C.prep)} (cada ponto soma 3 na nota final). Faltar custa caro e a cadeira vazia roda o país.</p>`;
    h+=`<div class="row2"><button class="btn grn" data-a="debgo">${sab?'Começar':'Entrar no estúdio'}</button><button class="btn sec2" style="width:auto;margin:0" data-a="debskip">Faltar</button></div>`;
  }else if(st.t==='show'){
    h+=speaker(st.who,st.cor,st.label,st.text);
    h+=`<button class="btn grn mt16" data-a="debnext">Réplica · 60 s</button>`;
  }else if(st.t==='ask'){
    const riv=active().filter(c=>!c.me);
    if(!UI.askR&&riv.length===1)UI.askR=riv[0].id;
    const r=riv.find(c=>c.id===UI.askR);
    h+=`<b style="font-size:16px">Sua pergunta</b><p class="small muted" style="margin:4px 0 10px">Escolha quem e por onde. Cada adversário tem os flancos que a imprensa cobra dele.</p>`;
    h+=riv.map(c=>`<button class="opt ${UI.askR===c.id?'on':''}" data-a="askr" data-v="${c.id}" style="display:flex;align-items:center;gap:10px"><span class="avatar" style="background:${c.cor};width:32px;height:32px;font-size:14px">${initials(c.nome)}</span><b>${esc(c.nome)}</b></button>`).join('');
    if(r)h+=`<div class="chips mt12">${FLANKS[arch(r.ideo)].map((f,i)=>`<button class="chip ${UI.askF===i?'on':''}" data-a="askf" data-v="${i}">${f.t}</button>`).join('')}</div>`;
    h+=`<button class="btn grn mt16" data-a="askgo" ${!r||UI.askF===null?'disabled':''}>Perguntar · 60 s</button>`;
  }else if(st.t==='q'){
    h+=speaker(st.who,st.cor,st.label,st.text);
    if(D.graded){
      const g=D.graded,col=g.s>=60?'pos':g.s<45?'neg':'';
      h+=`<div class="score mt12"><b class="${col}">${g.s}</b></div><ul class="fb">${g.fb.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
      const nx=D.steps[D.i+1];
      h+=`<button class="btn grn mt16" data-a="debnext">${!nx?'Encerrar':nx.t==='ask'?'Sua pergunta':nx.ctx==='final'?'Considerações finais · 60 s':'Próxima pergunta'}</button>`;
    }else{
      const left=Math.max(0,(D.deadline||Date.now())-Date.now());
      h+=`<div class="timer ${left<15000?'low':''}" id="tmrx"><b id="tmr">${fmtT(left)}</b><div class="tb"><div id="tmrb" style="width:${left/(st.time*1000)*100}%"></div></div></div>`;

      h+=`<div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn grn" style="width:auto;padding:10px 22px;font-size:16px" data-a="debans">Responder</button></div>`;

    }
  }
  h+=`</div><p class="satire">Ficção. Mediadores, jornalistas e candidatos são inventados. A nota é calculada no seu aparelho, sem IA paga: responda o que foi perguntado, traga números e propostas e fale com o eleitor.</p></div>`;
  return h;
}

function confetti(){
  const cols=['#22B573','#F2C230','#4D8FE6','#ffffff','#E2564B'];
  let s='';for(let i=0;i<60;i++)s+=`<i style="left:${Math.random()*100}%;background:${cols[i%5]};animation-duration:${R(2.5,5).toFixed(2)}s;animation-delay:${R(0,1.5).toFixed(2)}s"></i>`;
  return `<div class="confetti" aria-hidden="true">${s}</div>`;
}
function vResult(){
  const C=S.camp,res=C.result,cs=res.order.map(id=>C.cands.find(c=>c.id===id));
  const won=res.winner==='P',toR2=res.second&&res.second.includes('P'),outR1=res.second&&!res.second.includes('P');
  let verdict,col,txt;
  const keyS=ST(res.key);
  if(won){verdict=C.reelect?'Reeleito(a)!':'Eleito(a) presidente!';col='gold';const m=res.nat.P-(res.nat[res.order[1]]||0);txt=`${m>.08?'Vitória larga.':m>.03?'Vitória clara.':'Vitória apertada, voto a voto.'} Você fez ${pc(res.nat.P)} dos votos válidos. O estado que decidiu foi ${keyS.nome}, por ${f1(res.keyM*100)} pontos.`}
  else if(toR2){verdict='2º turno!';col='gold';const o=cs.find(c=>res.second.includes(c.id)&&!c.me);txt=`Ninguém passou de 50%. Você fez ${pc(res.nat.P)} e enfrenta ${esc(o.nome)} no 2º turno.`}
  else{verdict='Derrota';col='neg';const w=cs[0];txt=outR1?`Você ficou fora do 2º turno com ${pc(res.nat.P)}.`:`${esc(w.nome)} venceu com ${pc(res.nat[w.id])} dos votos válidos. ${keyS.nome} decidiu a eleição.`}
  let h=won?confetti():'';
  h+=hdr(`Apuração · <b>${C.reelect?'reeleição':res.round+'º turno'}</b>`,'100%','Urnas apuradas','27 de 27 estados',[['Abstenção',pc(res.abst)],['Brancos/nulos',pc(res.nulos)],['Válidos',pc(1-res.abst-res.nulos)],['Sua posição',(res.order.indexOf('P')+1)+'º']]);
  h+=`<div class="wrap"><div class="center mt8"><div class="verdict ${col}">${verdict}</div><p class="muted small">${txt}</p></div>`;
  h+=`<div class="sec"><h4>Votos válidos</h4></div><div class="panel">${pollBars(res.nat,0,cs)}</div>`;
  h+=`<div class="sec"><h4>O mapa da apuração</h4><em>% do mais votado em cada estado</em></div>${vMap(sid=>res.reg[sid],cs,{lead:true})}`;
  h+=`<div class="sec"><h4>Por região</h4></div><div class="panel tw"><table><tr><th>Região</th>${cs.map(c=>`<th style="color:${c.cor}">${esc(c.nome.split(' ')[0])}</th>`).join('')}</tr>${REGS.map(r=>{const sts=STATES.filter(s=>s.reg===r.id),w=sts.reduce((a,s)=>a+s.peso,0);const v=id=>sts.reduce((a,s)=>a+res.reg[s.id][id]*s.peso,0)/w;const mx=Math.max(...cs.map(c=>v(c.id)));return `<tr><td>${r.nome}</td>${cs.map(c=>{const x=v(c.id);return `<td class="mono ${x===mx?'gold':''}">${pc(x)}</td>`}).join('')}</tr>`}).join('')}</table></div>`;
  if(C.hist.length>1)h+=`<div class="sec"><h4>Sua campanha semana a semana</h4></div><div class="panel pad">${spark(C.hist.map(x=>x.v*100).concat([res.nat.P*100]),'var(--ac)')}<div class="tiny muted mono">de ${pc(C.hist[0].v)} na largada a ${pc(res.nat.P)} nas urnas</div></div>`;
  h+='<div class="mt16"></div>';
  if(won){
    if(S.gov)h+=`<button class="btn grn" data-a="govnext">Subir a rampa de novo</button>`;
    else h+=`<button class="btn grn" data-a="totrans">Subir a rampa</button>`;
  }else if(toR2)h+=`<button class="btn" data-a="r2">Começar o 2º turno</button>`;
  else{
    if(S.gov)h+=`<button class="btn" data-a="finish" data-v="lostre">Ver legado</button>`;
    else h+=`<button class="btn" data-a="new">Tentar de novo</button><button class="btn sec2" data-a="title">Menu</button>`;
  }
  return h+'</div>';
}

function spark(arr,col,lo,hi){
  if(arr.length<2)return '';
  const w=300,hh=46,mn=lo!==undefined?lo:Math.min(...arr),mx=hi!==undefined?hi:Math.max(...arr),rg=mx-mn||1;
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(hh-3-(v-mn)/rg*(hh-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function efHint(p){
  const e=Object.assign({},p.ef,p.later||{}),t=[];
  if(e.aprov)t.push(e.aprov>0?'popular':'impopular');
  if(e.merc)t.push(e.merc>0?'mercado gosta':'mercado não gosta');
  if(e.divT||e.div)t.push((e.divT||e.div)>0?'aumenta gastos':'melhora as contas');
  if(e.pibT)t.push('crescimento'+(p.lag?' a longo prazo':''));
  if(e.inflP)t.push(e.inflP>0?'pressiona inflação':'reduz inflação');
  if(e.desT&&e.desT<0)t.push('gera empregos');
  return t.length?'<em style="font-style:normal;color:var(--muted2)">('+t.join(', ')+')</em>':'';
}

  return h;

  h+=`<div class="sec"><h4>Indicadores do trimestre</h4></div><div class="panel tw"><table><tr><th>Indicador</th><th>Antes</th><th>Agora</th><th>Var.</th></tr>
  ${row('Aprovação',b.aprov,G.aprov,'%',true)}${row('PIB (anual)',b.pib,G.pib,'%',true)}${row('Inflação',b.infl,G.infl,'%',false)}${row('Desemprego',b.desemp,G.desemp,'%',false)}${row('Dívida/PIB',b.divida,G.divida,'%',false)}${row('Mercado',b.mercado,G.mercado,'',true)}
  <tr><td>Base aliada</td><td class="mono">${b.base}</td><td class="mono">${baseSeats()}</td><td class="mono ${baseSeats()<b.base?'neg':baseSeats()>b.base?'pos':''}">${baseSeats()-b.base>0?'+':''}${baseSeats()-b.base}</td></tr></table></div>`;
  if(r.news.length)h+=`<div class="sec"><h4>Manchetes</h4></div><div class="panel"><ul class="log">${r.news.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
  if(G.aprov<25&&!r.imp)h+=`<p class="small neg mt12">Aprovação muito baixa. Se cair abaixo de 20% com a base fraca, a oposição abre um processo de impeachment.</p>`;
  h+='</div>';
  h+=`<div class="foot"><div><button class="btn" data-a="nextq">${r.imp&&r.imp.ok?'Ver o fim da história':G.q>=16?'Fim do mandato':'Próximo trimestre'}</button></div></div>`;
  return h;
}
function vMandateEnd(){
  const G=S.gov,can=G.mandato===1&&G.aprov>=25;
  let h=hdr(`Fim do ${G.mandato}º mandato`,f1(G.aprov)+'%','Aprovação final','',[['PIB',sg(G.pib)+'%'],['Inflação',f1(G.infl)+'%'],['Desemp.',f1(G.desemp)+'%'],['Projetos',G.passed.length]]);
  h+='<div class="wrap center">';
  if(G.mandato===1){
    h+=`<div class="verdict ${can?'gold':'neg'} mt16">${can?'Reeleição?':'Sem clima'}</div><p class="muted small">${can?'Seu governo chega competitivo à eleição. Você pode disputar mais quatro anos, mas os adversários vêm fortes.':'Com aprovação abaixo de 25%, o partido não banca sua reeleição.'}</p>`;
    if(can)h+=`<button class="btn mt16" data-a="reelect">Disputar a reeleição</button>`;
    h+=`<button class="btn sec2 ${can?'':'mt16'}" data-a="finish" data-v="end">Encerrar e ver legado</button>`;
  }else h+=`<div class="verdict gold mt16">Missão cumprida</div><p class="muted small">Oito anos de governo. Hora de passar a faixa.</p><button class="btn mt16" data-a="finish" data-v="end">Ver legado</button>`;
  return h+'</div>';
}
function vFinal(){
  const F=S.final,L=F.leg,G=S.gov,sc=L.score||0;
  let grade,col;
  if(F.kind==='impeach'){grade='Afastado(a)';col='neg'}
  else if(sc>=80){grade='Estadista';col='gold'}
  else if(sc>=62){grade='Bom governo';col='pos'}
  else if(sc>=45){grade='Mandato morno';col=''}
  else{grade='Desastre';col='neg'}
  const best=+store.get(BEST)||0;
  let h=hdr('Fim de jogo',sc+' pts','Legado','Recorde: '+best+' pts',[['Aprov. média',L.a!==undefined?f1(L.a)+'%':'—'],['PIB médio',L.p!==undefined?sg(L.p)+'%':'—'],['Promessas',L.kept!==undefined?L.kept+' ok · '+L.broke+' x':'—'],['Projetos',L.passed||0]]);
  h+=`<div class="wrap center"><div class="verdict ${col} mt16">${grade}</div><p class="muted small">${F.kind==='impeach'?'A Câmara aprovou seu afastamento. Seu governo termina antes do fim.':F.kind==='lostre'?'Você perdeu a reeleição e entrega a faixa ao adversário.':G&&G.mandato===2?'Você governou por dois mandatos completos.':'Você completou o mandato.'}</p>`;
  if(G&&G.hist.length>1)h+=`<div class="panel pad mt12" style="text-align:left"><div class="tiny muted mono">APROVAÇÃO</div>${spark(G.hist.map(x=>x.aprov),'var(--ac)',0,100)}<div class="tiny muted mono mt8">PIB</div>${spark(G.hist.map(x=>x.pib),'var(--green)')}<div class="tiny muted mono mt8">INFLAÇÃO</div>${spark(G.hist.map(x=>x.infl),'var(--red)')}</div>`;
  h+=`<button class="btn mt16" data-a="new">Nova candidatura</button><button class="btn sec2" data-a="title">Menu</button></div>`;
  return h;
}

function render(){
  let h='';
  if(UI.screen==='title')h=vTitle();
  else if(UI.screen==='setup')h=vSetup();
  else switch(S.phase){
    case 'programa':h=vPrograma();break;
    case 'camp':h=vCamp();break;
    case 'debate':h=vDebate();break;
    case 'result':h=vResult();break;
    case 'trans':h=vTrans();break;
    case 'faz':h=vFaz();break;
    case 'gov':h=vGov();break;
    case 'gov_report':h=vReport();break;
    case 'mandate_end':h=vMandateEnd();break;
    case 'final':h=vFinal();break;
  }
  if(UI.toast)h+=`<div class="toast">${esc(UI.toast)}</div>`;
  $app.innerHTML=h;
}

function act(a,v){
  switch(a){
    case 'new':UI.screen='setup';UI.setup.nome='';render();top();break;
    case 'title':UI.screen='title';render();break;
    case 'continue':S=load();if(S){UI.screen='game';render()}break;
    case 'set':{const [k,x]=v.split(':');UI.setup[k]=x;render();break}
    case 'launch':{
      const u=UI.setup,nome=(u.nome||'').trim();
      if(nome.length<2)return toast('Digite o nome na urna.');
      S={v:2,player:{nome,partido:u.partido,perfil:u.perfil,home:u.home,vice:u.vice},integ:80,phase:'camp'};
      UI.screen='game';
      UI.st=STATES.filter(s=>s.reg===u.home).sort((a,b)=>b.peso-a.peso)[0].id;
      newCampaign({weeks:10,debates:[4,8]});
      S.phase='programa';UI.prog=[];
      save();render();top();break}
    case 'prog':{const i=UI.prog.indexOf(v);if(i>=0)UI.prog.splice(i,1);else if(UI.prog.length<5)UI.prog.push(v);else return toast('Máximo de 5 propostas.');render();break}
    case 'progok':confirmPrograma();break;
    case 'st':UI.st=v;render();break;
    case 'act':
      if(v==='ataque'){UI.atk=!UI.atk;UI.apoio=false;render();return}
      if(v==='apoio'){UI.apoio=!UI.apoio;UI.atk=false;render();return}
      doAction(v);break;
    case 'atk':doAction('ataque',v);break;
    case 'atkx':UI.atk=false;render();break;
    case 'apo':doAction('apoio',v);break;
    case 'apox':UI.apoio=false;render();break;
    case 'ev':evChoose(+v);break;
    case 'offer':offerAnswer(v==='1');break;
    case 'sab':sabAnswer(v==='1');break;
    case 'endweek':UI.atk=false;UI.apoio=false;endWeek();break;
    case 'debgo':debNext();break;
    case 'debskip':debSkip();break;
    case 'debnext':debNext();break;
    case 'debans':debAnswer(false);break;
    case 'sug':{const D=S.camp.debate,st=D.steps[D.i];UI.ans=st.sug[+v][0];render();const t=document.getElementById('ans');if(t)t.focus();break}
    case 'askr':UI.askR=v;UI.askF=null;render();break;
    case 'askf':UI.askF=+v;render();break;
    case 'askgo':debAsk();break;
    case 'debend':S.camp.debate=null;S.phase='camp';save();render();top();break;
    case 'r2':startRound2();break;
    case 'totrans':{const res=S.camp.result;S.runner=S.camp.cands.find(c=>c.id===res.order[1]);S.phase='trans';save();render();top();break}
    case 'trans':transChoose(v==='1');break;
    case 'faz':startGov(v);break;
    case 'govnext':startGov(S.gov.fazenda);break;
    case 'dil':dilChoose(+v);break;
    case 'proj':sendProj(v);break;
    case 'gact':if(v==='minis'){UI.minis=!UI.minis;render();return}gAct(v);break;
    case 'minp':gAct('minis',v);break;
    case 'minx':UI.minis=false;render();break;
    case 'endq':UI.minis=false;endQuarter();break;
    case 'nextq':nextQuarter();break;
    case 'reelect':startReelection();break;
    case 'finish':finish(v);break;
  }
}
$app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b.dataset.v)});
$app.addEventListener('input',e=>{if(e.target.id==='nm')UI.setup.nome=e.target.value;if(e.target.id==='ans')UI.ans=e.target.value});

window.__rampa={get S(){return S},UI,act,natShares:()=>S&&S.camp?natShares():null,gradeAnswer};
render();
})();
</script>
<script src="./bnf-config.js"></script>
<script src="./bnf-analytics.js" data-page="Rampa"></script>
</body>
</html>
