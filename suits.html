      ...(out?[{id:'f5',t:`A autora possui inscrição anterior, legítima, por dívida com a ${c.v.loja2}.`,rel:0,why:'Fato que joga contra a cliente: não se narra na inicial. O que muda é o pedido (veja os pedidos).'}]:[]),
      {id:'f6',t:'A autora frequenta a igreja do bairro e é muito querida pelos vizinhos.',rel:0,why:'Irrelevante para o pedido.'}]},
    {k:'fund',t:'Fundamentos jurídicos',a:['CPC-319'],opts:[
      {l:'CDC, art. 14: responsabilidade objetiva do fornecedor de serviços',ok:1,a:['CDC-14']},
      {l:'CDC, art. 6º, VIII: inversão do ônus da prova',ok:1,a:['CDC-6']},
      {l:'CC, arts. 186 e 927: ato ilícito e dever de indenizar',ok:1,a:['CC-186','CC-927']},
      {l:'CDC, art. 43, §2º: comunicação da abertura de cadastro',ok:.5,why:'Vale como reforço, mas o dever de avisar é do órgão do cadastro, não da operadora.',a:['CDC-43']},
      {l:'Súmula 359 do STJ: a operadora não notificou a autora',ok:0,why:'Pegadinha: a Súmula 359 obriga o órgão mantenedor do cadastro a notificar, não o credor. Contra a operadora, não serve.',a:['SUM-STJ359']},
      {l:'Súmula 385 do STJ',ok:0,why:'Essa súmula joga contra a autora: afasta o dano moral quando há inscrição anterior legítima.',a:['SUM-STJ385']},
      {l:'Código Civil de 1916, art. 159',ok:0,why:'Lei revogada. O Código Civil vigente é o de 2002.'},
      {l:'Lei 8.245/91, art. 59',ok:0,why:'Lei errada: é a Lei do Inquilinato.'}]},
    {k:'ped',t:'Pedidos',a:['CPC-319','CPC-292'],opts:[
      {id:'tut',l:'Tutela de urgência para excluir o nome do cadastro',ok:1,a:['CPC-300']},
      {id:'cit',l:'Citação da ré',ok:1},
      {id:'decl',l:`Declaração de inexistência do débito de ${money(c.v.div)}`,ok:1,val:c.v.div},
      {id:'dm',l:`Indenização por dano moral de ${money(c.v.dm)}`,ok:out?0:1,val:c.v.dm,why:out?'Com inscrição anterior legítima, a Súmula 385 afasta o dano moral. Pedir assim é perder esse pedido e queimar crédito com o juiz.':'',a:out?['SUM-STJ385']:[]},
      {id:'inv',l:'Inversão do ônus da prova',ok:1,a:['CDC-6']},
      {id:'suc',l:'Condenação da ré em honorários de sucumbência',ok:jec?0:1,why:jec?'No Juizado não há sucumbência no 1º grau (Lei 9.099, art. 55).':'',a:jec?['L9099-55']:[]},
      {id:'mat',l:'Danos materiais de R$ 20.000',ok:0,val:20000,why:'Não decorre dos fatos: nenhum prejuízo material foi narrado.'}]},
    {k:'valor',t:'Valor da causa',a:['CPC-292']},
    {k:'prov',t:'Provas',a:['CPC-319'],opts:[
      {l:'Documental: extrato do cadastro'+(c.rev.prot&&c.hid.prot?' e protocolos':''),ok:1},
      {l:'Depoimento pessoal do representante da ré',ok:1},
      {l:'Perícia grafotécnica',ok:jec?0:.5,why:jec?'O Juizado não comporta perícia complexa. E não há assinatura a periciar: a autora nunca assinou nada.':'Não há assinatura a periciar: a autora nunca assinou nada.'},
      {l:'Inspeção judicial na loja',ok:0,why:'Prova inútil para o caso. Pedir prova sem utilidade irrita o juízo.'}]}
  ]},
  base(c){let t=.78;if(c.hid.prot)t+=.06;return t},
  val(c){return c.v.div+(c.hid.outra?0:c.v.dm)},

    {tp:'choice',tit:'A contestação da ré',txt:`No Juizado, a defesa vem na própria audiência. O ${c.rivalT} entrega a contestação: diz que a linha foi contratada por telefone e junta uma <b>tela do sistema</b> da própria empresa${out?`. E anexa um extrato: <b>${esc(first(c.cli.n))} já tinha outra inscrição, da ${esc(c.v.loja2)}</b>`:''}.`+(out&&!c.rev.outra?` <br><br>${esc(first(c.cli.n))} aperta seu braço. "Eu esqueci, ${DOUT()}..." Você foi pego de surpresa.`:''),
      opts:[
        {l:'Impugnar a tela: é prova unilateral, produzida pela própria ré, sem assinatura nem gravação',ok:1,fb:'Exato: a tela de sistema é documento produzido unilateralmente. E, com a inversão do ônus, cabe à ré provar a contratação.',a:['CDC-6','CPC-373'],eff:c=>{c.sc.prova+=.2}},
        {l:'Pedir prazo para se manifestar depois',ok:.4,fb:'No Juizado tudo se concentra na audiência. Deixar para depois enfraquece a impugnação.',eff:c=>{c.sc.prova+=.05}},
        {l:'Ficar em silêncio para não piorar',ok:0,fb:'Silêncio diante de documento novo é deixar a versão da ré de pé.',eff:c=>{c.sc.prova-=.1}}]},
    {tp:'perg',tit:'Depoimento da preposta da ré',txt:'A preposta da operadora senta, ajeita o crachá e evita olhar para a sua cliente. Você pode fazer duas perguntas.',pick:2,qs:[
      {l:'A empresa tem a gravação da suposta contratação por telefone?',ok:1,ans:'"Não... não localizamos a gravação." O juiz anota.',eff:.18},
      {l:'Que documento a autora assinou para contratar a linha?',ok:1,ans:'"Não há documento assinado. A venda foi por telefone." O juiz anota de novo.',eff:.14},
      {l:'A senhora confirma que a empresa errou, não confirma?',ok:0,ans:'"Indefiro a pergunta, doutor(a): ela induz a resposta." O juiz nem levanta os olhos.',a:['CPC-459'],eff:0,fx:[['jz',-2]]},
      {l:'A senhora gosta de trabalhar na empresa?',ok:0,ans:'"Indefiro. Sem relação com os fatos." Alguém ri baixinho no fundo da sala.',a:['CPC-459'],eff:0,fx:[['jz',-1]]}]}
  ]},
  alg(c){return {kw:['nunca contrat*','cadastro','negativa*','inscri*','tela','unilateral','gravac*','protocolo*','inversao','onus','responsabilidade objetiva','constrang*',norm(ITEMN(c)).split(' ')[0],'credito','dano moral','cancelamento','inexist*','sumula 385','preexist*'],neg:['contratou a linha','assinou o contrato','a divida existe','deve mesmo','talvez tenha contratado','ela esqueceu de pagar'],
    q:c.hid.outra?{q:'E a anotação anterior da autora, doutor(a)? A Súmula 385 não afasta o dano moral?',kw:['cancelamento','exclus*','inexist*','declara*','limpar','retirada','baixa'],neg:['nao existe','e falsa','nunca teve','nao se aplica'],fact:'s385'}:{q:'A ré juntou a tela do sistema com o contrato. Isso não prova a contratação, doutor(a)?',kw:['tela','unilateral','propria re','sistema','assinatura','gravac*','onus','inversao','prova'],neg:['prova sim','realmente prova','contratou']}}},
  dispo(c,r){const L=[];if(r.decl)L.push(`declarar inexistente o débito de ${money(c.v.div)} e determinar a exclusão definitiva do nome da autora dos cadastros de inadimplentes`);if(r.dm)L.push(`condenar a ré a pagar à autora ${money(r.dm)} a título de danos morais, com correção e juros`);return L},
  epi(c,w){return w?`<p>Três semanas depois, chega uma foto no seu celular. ${esc(ITEM(c)).replace(/^./,x=>x.toUpperCase())} novinh${ITEM(c).startsWith('uma')?'a':'o'}, ainda com o plástico, e ${QUEM[c.v.quem||0][1]} ${esc(c.v.neta)} fazendo careta na frente.</p><p>"Obrigada, ${DOUT()}. Hoje eu dormi a noite inteira."</p>`:`<p>${esc(first(c.cli.n))} escuta a explicação em silêncio. Agradece, educada, e vai embora devagar.</p><p>Na semana seguinte, você passa em frente à ${esc(c.v.loja)}. ${esc(ITEM(c)).replace(/^./,x=>x.toUpperCase()).replace(/^Uma? /,m=>m==='Uma '?'A ':'O ')} ainda está na vitrine.</p>`},
  msgs:{wait:c=>`Bom dia, ${DOUT()}. Desculpa incomodar. Tem alguma novidade? Minha ${QUEM[c.v.quem||0][0]} perguntou d${ITEM(c).startsWith('uma')?'a':'o'} ${esc(ITEMN(c))} de novo.`,aud:c=>`Comprei uma blusa nova pra audiência. Precisa levar alguma coisa?`}
},
acid:{
  nome:'Acidente de trânsito (defesa)',area:'Responsabilidade civil',lado:'reu',peca:'contest',
  make(){const veh=pick(Object.keys(VEHS));const cli={n:pname(false),f:false,idade:RI(24,52),prof:VEHS[veh].prof};const aut=pname(chance(.3));
    return {cli,rito:'comum',v:{aut,dmat:RI(9,16)*1000+RI(1,9)*100,dmor:pick([10000,15000]),filhos:RI(1,3),cruz:pick(['Av. Brasil com a Rua Tupis','Rua Padre Eustáquio com a Av. Silva Lobo','Av. Amazonas com a Rua Goitacazes']),farm:pick(['Drogaria Popular','Farmácia Bom Preço','Drogaria Central']),testA:pick(FN_F)+' '+pick(SN),testR:pname(chance(.5)),ped:pname(true),veh,vara:RI(1,32)},hid:{cam:chance(.75),cel:chance(.8),amass:chance(.65)}}},
  intro:c=>`<p>${esc(first(c.cli.n))} chega ${VEH(c).chega}. Tem ${c.cli.idade} anos e ${c.v.filhos} ${c.v.filhos>1?'filhos':'filho'}. Coloca o mandado de citação na mesa como se fosse uma bomba.</p><p>"Ele tá me cobrando ${money(c.v.dmat+c.v.dmor)}, ${DOUT()}. Diz que eu furei o sinal na ${esc(c.v.cruz)}. Mentira. Ele mudou de faixa sem dar seta e ${VEH(c).queda}. Eu fiquei duas semanas sem trabalhar."</p><p>"Se eu perder, vão levar ${VEH(c).a==='a'?'minha':'meu'} ${VEH(c).n}. ${VEH(c).a==='a'?'A':'O'} ${VEH(c).n} é o meu trabalho."</p>`,
  atq:[
    {id:'cam',f:'cam',q:'Tinha alguma câmera ou testemunha por perto?',a:(c,rv)=>!c.hid.cam?'"Tinha gente na calçada, mas câmera eu acho que não. Era tudo casa ali."':rv?`"Tinha a ${esc(c.v.farm)} na esquina! O farmacêutico, ${esc(c.v.testR)}, viu tudo e falou que a câmera deles pega o cruzamento."`:`"Câmera? Não reparei, ${DOUT()}. Eu tava no chão."`,good:1},
    {id:'loc',f:'cam',q:'O que tem em cada esquina daquele cruzamento?',a:(c,rv)=>!c.hid.cam?'"Casa, um terreno baldio e um ponto de ônibus."':rv?`"Uma padaria, o ponto de ônibus e a ${esc(c.v.farm)}... Opa! A farmácia tem câmera virada pra rua. E o farmacêutico, ${esc(c.v.testR)}, saiu pra me ajudar."`:'"Ah, padaria, ponto de ônibus, uma farmácia... comércio normal."',good:1},
    {id:'socorro',f:'cam',q:'Quem te ajudou a levantar depois da batida?',a:(c,rv)=>!c.hid.cam?'"Ninguém, eu levantei sozinho. O cara do carro nem desceu."':rv?`"O farmacêutico da ${esc(c.v.farm)}, ${esc(c.v.testR)}. Disse que viu tudo e que a câmera da loja pega o cruzamento."`:'"Um senhor de jaleco. Não peguei o nome, eu tava zonzo."',good:1},
    {id:'cel',f:'cel',q:'Você viu o que o motorista estava fazendo antes da batida?',a:(c,rv)=>!c.hid.cel?'"Tava olhando pra frente, acho. Só mudou de faixa sem seta."':rv?'"Tava com o celular na mão, mexendo. Eu vi quando ele virou a cabeça pra baixo."':'"Não deu pra ver direito, foi tudo muito rápido."',good:1},
    {id:'dist',f:'cel',q:'Ele freou ou buzinou antes de bater?',a:(c,rv)=>!c.hid.cel?'"Freou em cima. Mas já tava na minha faixa."':rv?'"Nem freou! Tava olhando pra baixo, pro celular. Eu vi a luz da tela."':'"Freou em cima, já era tarde."',good:1},
    {id:'amass',f:'amass',q:'O orçamento que ele juntou bate com o estrago da batida?',a:(c,rv)=>!c.hid.amass?'"Bate, sim. Eu bati na frente dele, do lado direito."':rv?'Você lê o orçamento com ele. "Peraí: porta traseira esquerda? Eu bati na frente, do lado direito!" O orçamento cobra um dano que não é dessa batida.':`"Orçamento? Nem li direito, ${DOUT()}."`,good:1},
    {id:'fotos',f:'amass',q:'Você tirou fotos dos dois veículos na hora?',a:(c,rv)=>!c.hid.amass?'"Tirei. Batida na frente, lado direito, igualzinho ao orçamento dele."':rv?'Ele mostra as fotos no celular: o carro do autor foi atingido na frente, do lado direito. Mas o orçamento cobra a porta traseira esquerda!':'"Tirei não. Tava preocupado com o prejuízo."',good:1},
    {id:'ponto',q:'Tinha alguém no ponto de ônibus que viu a batida?',a:c=>`"Uma moça, ${esc(c.v.ped||'Sandra')}. Ela me deu o telefone e disse que testemunhava se precisasse."`,rev:'ped',good:1},
    {id:'cnh',q:'Sua CNH e o licenciamento do veículo estão em dia?',a:()=>'"Tudo em dia. Eu vivo disso, não posso dar mole."',good:1},
    {id:'beb',q:'Você tinha bebido?',a:()=>'Ele se ofende. "Eram dez da manhã, eu tava trabalhando!" Pergunta válida, mas o jeito pesou.',good:0,fx:[['cli',-2]]},
    {id:'cul',q:'Você assume alguma culpa?',a:()=>'"Eu tava a uns 40, no limite da via. Talvez eu pudesse ter freado antes, sei lá." Anote: isso pode virar culpa concorrente.',good:1}
  ],
  estrat:c=>[
    {id:'hon',l:'Honorários',opts:[
      {l:'Fixos de R$ 3.000, em 4 parcelas, por escrito',ok:1,fb:'Na defesa não há "êxito" em dinheiro para o cliente: honorário fixo, parcelado e por escrito é o mais justo.',a:['CED-48','EAOAB-22'],set:c=>{c.hon={pct:0,fixo:3000}}},
      {l:'40% do valor que ele deixar de pagar',ok:.3,fb:'Possível, mas confuso e caro para quem já está apertado. Ele desconfia.',fx:[['cli',-3]],set:c=>{c.hon={pct:0,fixo:4500}}},
      {l:`${VEH(c).a==='a'?'A':'O'} ${VEH(c).n} como garantia dos honorários`,ok:0,fb:'Pegar o instrumento de trabalho do cliente como garantia é desproporcional e cria conflito de interesses com a própria causa.',a:['CED-50'],fx:[['et',-3],['cli',-4]],set:c=>{c.hon={pct:0,fixo:3000}}}]},
    {id:'proc',l:'Procuração',opts:[
      {l:'Colher a procuração hoje',ok:1,a:['EAOAB-5']},
      {l:'Contestar primeiro, procuração depois',ok:0,fb:'Não há urgência que justifique: o prazo de contestação nem começou. Procuração primeiro.',a:['CPC-104'],fx:[['jz',-1]]}]},

saude:{

  atq:[

    {id:'risco',f:'laudo',q:'O que o médico disse que acontece se esperar?',a:(c,rv)=>!c.hid.laudo?'"Que é melhor não esperar. Mas não quis pôr no papel."':rv?'"Que pode piorar a qualquer momento. Eu pedi pra ele escrever." Ela acha o laudo: "indicação cirúrgica urgente, risco de agravamento".':'"Que é melhor não esperar." Ela não lembra de mais nada.',good:1},
    {id:'car',q:'Há quanto tempo vocês têm o plano?',a:c=>`"Faz ${c.v.anos} anos. O ${esc(c.v.filho)} entrou como dependente quando nasceu." Qualquer carência já passou faz tempo.`,rev:'car',good:1},

    {id:'culpa',q:'A senhora escondeu alguma doença quando contratou?',a:()=>'Ela fica vermelha. "Como eu ia saber? Ele nasceu depois do contrato!" Pergunta pertinente, mas doeu.',good:.5,fx:[['cli',-1]]},

      {l:'Juizado Especial Cível',ok:0,fb:`O valor passa do teto do Juizado: 40 salários mínimos (${money(40*SM)}). E pode haver perícia médica, que o Juizado não comporta.`,a:['L9099-3'],set:c=>{c.rito='comum'},fx:[['jz',-1]]}]},

const FASE={atend:'Atendimento',estrat:'Estratégia e contrato',inicial:'Petição inicial',contest:'Contestação',emenda:'Emenda da inicial',aguarda:'Aguardando o juízo',conc:'Audiência de conciliação',aij:'Audiência de instrução',alg:'Alegações finais',replica:'Réplica',saneamento:'Rol de testemunhas',agravo:'Agravo de instrumento',pos:'Sentença publicada',cumpr:'Cumprimento de sentença',fim:'Encerrado'};

const hoursDay=()=>{const st=S.g.ind.st;return 8-(st>=70?1:0)-(st>=85?1:0)};

const partes=c=>c.t==='neg'?{a:c.cli.n,r:c.v.emp}:c.t==='acid'?{a:c.v.aut,r:c.cli.n}:{a:`${c.v.filho} ${c.cli.n.split(' ').slice(1).join(' ')}, representado por sua mãe, ${c.cli.n}`,r:c.v.plano};
const vara=c=>c.rito==='jec'?`Juizado Especial Cível de ${CITY()}`:`${c.v.vara||RI(1,9)}ª Vara Cível de ${CITY()}`;
const casesOpen=()=>S.g.cases.filter(c=>!c.done);

const needs=c=>!c.done&&(c.fb||c.ai||c.jc||ACT.includes(c.fase)||(c.aud&&c.aud.d===S.g.date&&!c.aud.ok));
function auto(c,t){c.autos.push({d:S.g.date,t})}
function msg(from,txt,cid){S.g.msgs.unshift({d:S.g.date,from,txt,c:cid||null});S.g.msgs=S.g.msgs.slice(0,40)}
function log(t){S.g.log.unshift({d:S.g.date,t});S.g.log=S.g.log.slice(0,80)}
function spend(h){const G=S.g;if(G.h<h-1e-9){toast(`Faltam horas hoje (precisa de ${h}h, restam ${G.h}h). Encerre o dia ou vire a noite.`);return false}G.h=Math.round((G.h-h)*10)/10;return true}
function setPrazo(c,tp,n,lbl,a){c.prazo={tp,n,ini:S.g.date,ate:addUteis(S.g.date,n),lbl,a:a||[]};return c.prazo}
function waitEv(c,ev,n){c.wait={ev,d:addUteis(S.g.date,n)};c.fase='aguarda'}
function audAt(c,tp,n){c.aud={tp,d:addUteis(S.g.date,n)};c.fase='aguarda';auto(c,`Designada ${tp==='conc'?'audiência de conciliação':'audiência de instrução e julgamento'} para ${fmtD(c.aud.d)}.`)}
function dje(c,tit,txt,a,extra){S.g.pop.push({k:'dje',c:c.id,tit,txt,a:a||[],pz:c.prazo&&c.prazo.ini===S.g.date?Object.assign({},c.prazo):null,extra:extra||''});auto(c,tit+(c.prazo&&c.prazo.ini===S.g.date?` Prazo: ${c.prazo.lbl}, até ${fmtD(c.prazo.ate)}.`:''));snd('bell')}
function pz(c,tp,n,lbl,a){return setPrazo(c,tp,n,lbl,a)}

function newGame(){const st=UI.setup,f=st.sx==='f';
  S={v:SCHEMA,saveVersion:SAVE_VERSION,ver:VERSION,seenV:VERSION,nome:(st.nome||'').trim().slice(0,40)||(f?'Helena Duarte':'Rafael Duarte'),sx:st.sx,uf:st.uf,phase:'tut',tut:0,tutA:null,ex:null,exN:0,usedQ:[],p2:null,
    vm:{seen:{},fav:{},hl:{},n:0},
    g:{date:'2028-01-24',h:8,ind:{rep:6,cli:60,et:76,jz:50,st:18},gain:{},cx:900,cases:[],advRec:{},deck:[],lastT:null,pop:[],msgs:[],log:[],evDone:[],nextEv:null,nextCase:null,tplN:0,rival:{w:0,l:0,a:0},stats:{won:0,lost:0,part:0,acc:0,miss:0,closed:0},inf:0,ted:[],cargo:'bacharel',oab:'',night:false,week:0,fee:0,earn:0}};
  save();
}
function startCareer(){const G=S.g;G.cargo='assoc';let d=G.date;while(wd(d)!==1||!isWork(d))d=addD(d,1);G.date=d;G.h=hoursDay();
  G.nextCase=addUteis(d,RI(4,5));G.nextEv=addUteis(d,RI(8,11));
  msg(MENTOR.t,`Bem-vind${g('a','o')} à ${MENTOR.firm}, ${DR()} ${S.nome.split(' ').slice(-1)[0]}. Sua sala é a do fim do corredor. Já deixei o primeiro caso na sua mesa. Regra da casa: aqui ninguém perde prazo.`);
  newCase('neg');S.phase='car';UI.tab='painel';save();
}
function buildAtq(c){const T=TPL[c.t],facts={};T.atq.forEach(q=>{if(q.f)(facts[q.f]=facts[q.f]||[]).push(q.id)});
  const rv={},offer=new Set();Object.keys(facts).forEach(f=>{const ids=shuffle(facts[f]);rv[ids[0]]=1;offer.add(ids[0]);if(ids[1]&&chance(.6))offer.add(ids[1])});
  const rest=shuffle(T.atq.filter(q=>!q.f).map(q=>q.id));while(offer.size<7&&rest.length)offer.add(rest.pop());
  c.atq={offer:shuffle([...offer]),rv}}
function atqOffer(c){const T=TPL[c.t];if(!c.atq||!c.atq.offer)return T.atq;return c.atq.offer.map(id=>T.atq.find(q=>q.id===id)).filter(Boolean)}
const atqRv=(c,q)=>!q.f||!c.atq||!c.atq.rv||!!c.atq.rv[q.id];
function pickAdv(){const G=S.g;const recent=G.cases.slice(-2).map(c=>c.adv);if(chance(.32)&&!recent.every(a=>a==='prado'))return 'prado';const ks=Object.keys(ADV).filter(k=>k!=='prado'&&!recent.includes(k));return pick(ks.length?ks:Object.keys(ADV))}
function newCase(t){const G=S.g,T=TPL[t],m=T.make(),jf=chance(.5);
  const used=new Set(G.cases.map(x=>first(x.cli.n)));let k=0;while(used.has(first(m.cli.n))&&k++<15)m.cli.n=pname(m.cli.f);
  const c=Object.assign({id:'c'+Date.now().toString(36)+RI(100,999),t,num:'',lado:T.lado,fase:'atend',autos:[],asked:[],rev:{},sc:{peca:.5,prova:.5,alg:.5,pen:0},sat:66,start:G.date,juiz:{n:(jf?'Dra. ':'Dr. ')+pname(jf),f:jf,rig:R(.86,1.18)},fa:{},prazo:null,wait:null,aud:null,fb:null,done:false,rol:null},m);
  c.adv=pickAdv();c.rivalT=advT(c);c.num=cnj();buildAtq(c);
  if(c.lado==='reu'){auto(c,`Distribuída a ação de indenização movida por ${c.v.aut}. Patrono do autor: ${advT(c)}.`);auto(c,`Citação de ${c.cli.n}.`)}
  G.cases.push(c);G.tplN++;G.pop.push({k:'novo',c:c.id});return c}
function spawnCase(){const G=S.g;const open=casesOpen();
  /* baralho de modelos: não repete um tipo de caso antes de esgotar os outros */
  let t;if(G.tplN<TPL_ORDER.length)t=TPL_ORDER[G.tplN];else{if(!G.deck||!G.deck.length){G.deck=shuffle(TPL_ORDER);if(G.deck[0]===G.lastT)G.deck.push(G.deck.shift())}const busy=new Set(open.map(c=>c.t));const i=G.deck.findIndex(x=>!busy.has(x));t=G.deck.splice(i>=0?i:0,1)[0]}
  if(open.length<5){G.lastT=t;const c=newCase(t);const a=advOf(c);msg(MENTOR.t,c.lado==='reu'?`Chegou uma defesa para você. Do outro lado, ${advT(c)}: ${a.st.charAt(0).toLowerCase()+a.st.slice(1)}`:`Mais um caso para você. Atenda com calma: cliente bem ouvido é metade da causa.`,c.id)}
  G.nextCase=addUteis(G.date,G.tplN<TPL_ORDER.length?RI(5,8):RI(12,20))}
function spawnEv(){const G=S.g;const left=EVT.filter(e=>!G.evDone.includes(e.id));if(left.length){const e=pick(left);G.pop.push({k:'ev',id:e.id,who:e.who()})}G.nextEv=left.length>1?addUteis(G.date,RI(7,12)):null}

/* ---------- fim do dia ---------- */
function endDay(){const G=S.g;
  casesOpen().forEach(c=>{if(c.aud&&c.aud.d<=G.date&&!c.aud.ok)missAud(c)});
  const used=hoursDay()-G.h;bump('st',G.night?7:used>=7?3:used<=3?-2:0);
  const prev=G.date;G.date=nextWork(G.date);G.night=false;
  if(D0(G.date)-D0(prev)>=3*864e5||wd(G.date)<wd(prev))weekly();
  G.h=hoursDay();
  if(G.ind.st>=95){bump('st',-40);G.date=nextWork(G.date);G.h=hoursDay();G.pop.push({k:'info',tit:'Você apagou',sub:'Estresse',txt:`<p>Na quarta xícara de café, a mão tremeu. Você acordou no sofá do escritório com a ${MENTOR.t} te cobrindo com o paletó dela.</p><p>"Vai pra casa. Dois dias. Prazo de processo a gente cumpre. Prazo do corpo, também." Você perdeu um dia útil inteiro.</p>`});}
  casesOpen().forEach(c=>{syncFase(c);
    if(c.wait&&c.wait.d<=G.date){const ev=c.wait.ev;c.wait=null;COURT[ev](c)}
    if(c.prazo&&c.prazo.ate<G.date)missPrazo(c);
    if(c.aud&&c.aud.d===G.date&&!c.aud.ok){c.fase=c.aud.tp;G.pop.push({k:'info',tit:`Hoje: ${c.aud.tp==='conc'?'audiência de conciliação':'audiência de instrução'}`,sub:c.num,txt:`<p>${esc(vara(c))}. Cliente: ${esc(c.cli.n)}. Do outro lado, ${advT(c)}.</p><p>Abra o processo para entrar na sala. Faltar tem consequência.</p>`,c:c.id});snd('alert')}
    if(['atend','estrat','inicial'].includes(c.fase)&&uteisAte(c.start,G.date)>8&&chance(.35)){c.sat=clamp(c.sat-4,0,100);bump('cli',-1);if(chance(.5))msg(c.cli.n,TPL[c.t].msgs.wait(c),c.id)}
  });
  if(G.nextCase&&G.date>=G.nextCase)spawnCase();
  if(G.nextEv&&G.date>=G.nextEv)spawnEv();
  checkTED();save();
}
function weekly(){const G=S.g;G.week++;G.cx+=1050-650;log('Salário de associado (R$ 1.050) menos o custo de vida da semana (R$ 650).');
  ['rep','cli','et','jz'].forEach(k=>{if(G.ind[k]>90&&!G.gain[k])G.ind[k]-=1});G.gain={};
  if(G.week===8&&G.stats.closed>=1)msg(MENTOR.t,`Dois meses de casa. Você está indo bem. Continue explicando tudo ao cliente: é isso que traz indicação.`)}
function fastForward(){let n=0;const G=S.g;do{endDay();n++}while(n<15&&!G.pop.length&&!casesOpen().some(c=>needs(c)||(c.prazo&&uteisAte(G.date,c.prazo.ate)<=2)));render();top()}

function rep(c,p){if(chance(p)){S.g.inf++;bump('et',-8);S.g.ted.push({d:S.g.date,t:`Representação de ${c.cli.n} por prejuízo ao patrocínio (prazo perdido no processo ${c.num}).`});return true}return false}
function missPrazo(c){const G=S.g,P=c.prazo;c.prazo=null;G.stats.miss++;const ch=fx([['cli',-12],['rep',-4],['st',8]]);c.sat=clamp(c.sat-30,0,100);let t='',a=[];
  if(P.tp==='emenda'){t='Você não emendou a inicial no prazo. O juiz indeferiu a petição inicial.';a=['CPC-321'];closeCase(c,'indef')}

  else if(b.k==='valor'){const V=valorOpts(c);s=a.sel===V.sum?1:0;fb.push(s?[1,`Correto: ${money(V.sum)}, a soma dos pedidos com valor econômico.`]:[0,`Valor errado. Com pedidos cumulados, o valor da causa é a soma de todos eles: ${money(V.sum)} (CPC, art. 292, V e VI).`,['CPC-292']])}
  else if(b.k==='imp'){const v=a.v||{};let ok=0;b.items.forEach((it,i)=>{const ans=v[i];const want=typeof it.imp==='function'?it.imp(c):it.imp;if(ans===want)ok++;else if(want&&ans!==1)fb.push([0,`Não impugnado: "${it.t}" presume-se verdadeiro. ${it.why}`,['CPC-341']]);else fb.push([0,`"${it.t}": ${it.why}`,['CPC-80']])});s=ok/b.items.length;if(s>=.99)fb.push([1,'Cada fato foi enfrentado de forma específica.'])}

function protocol(c,ctx){const B=montBlocks(c);const res=B.map(b=>({k:b.k,t:b.t,a:b.a,...gradeBlock(c,b)}));const sc=res.reduce((x,r)=>x+r.s,0)/res.length;

    if(e&&e.s<.5){bump('jz',-3);c.redistrib=1}auto(c,'Petição inicial protocolada.'+(c.redistrib?' Endereçamento equivocado: autos redistribuídos.':''));
    if(c.t==='saude')waitEv(c,'tutela',RI(2,4)+(c.redistrib?6:0));else waitEv(c,'despacho',RI(3,6)+(c.redistrib?8:0))}

function concInfo(c){const T=TPL[c.t],claim=T.val(c)||1000,s=strength(c);

  const fair=claim*(1-s),offer=round100(claim*(c.concR||(c.concR=R(.5,.7)))/A.off);return {claim,fair,offer,counter:round100(claim*.3)}}

    auto(c,`Acordo homologado: ${money(I.offer)}.`);c.fb={tit:'Audiência de conciliação',items,ch};closeCase(c,'acordo',{amt:I.offer,good})}
  else if(v==='contra'){const p=clamp((c.lado==='autor'?strength(c)-.12:strength(c)-.05)+advOf(c).cnt,.08,.85);if(chance(p)){items.push({ok:1,l:'Contraproposta',c:`Aceita: ${money(I.counter)}`,t:`${advT(c)} consulta o cliente por telefone e aceita.`,a:['CPC-3']});auto(c,`Acordo homologado: ${money(I.counter)}.`);c.fb={tit:'Audiência de conciliação',items,ch};closeCase(c,'acordo',{amt:I.counter,good:true})}
    else{items.push({ok:.5,l:'Contraproposta',c:'Recusada',t:`"Sem chance, ${DOUT()}." Sem acordo, o processo segue.`});c.fb={tit:'Audiência de conciliação',items,ch};noDeal(c)}}
  else{items.push({ok:good?.5:1,l:'Proposta',c:'Recusada',t:good?'A proposta era razoável. Recusar é apostar na sentença.':'Recusar uma proposta ruim foi a decisão certa.'});c.fb={tit:'Audiência de conciliação',items,ch};noDeal(c)}
  save();render();top()}

const STOP=new Set('a o e de da do das dos em no na nos nas um uma uns umas que se por para pra com sem nao mas ou como ao aos foi ser sao era esta esse essa isso este isto ele ela eles elas seu sua seus suas meu minha nosso nossa ja tambem quando entao porque pois mais muito ha tem ter foram sido pelo pela pelos pelas sobre entre ate depois antes so mesmo assim todo toda cada qual quem onde lhe me te nos vos excelencia doutor doutora senhor senhora juiz juiza'.split(' '));
const JARG=['data venia','in casu','outrossim','destarte','ex positis','mormente','precipuamente'];
function esc2(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function findTerm(n,t){const pre=t.endsWith('*'),b=esc2(pre?t.slice(0,-1):t);const re=new RegExp('(^|[^a-z0-9])('+b+(pre?'[a-z]*':'s?')+')(?![a-z0-9])','g');const out=[];let m;while((m=re.exec(n)))out.push({i:m.index+m[1].length,w:m[2]});return out}
const has2=(n,list)=>list.filter(t=>findTerm(n,t).length);
function negated(n,i){const before=n.slice(Math.max(0,i-60),i).trim().split(/\s+/).slice(-5).join(' ');return /(^| )(nao|nunca|jamais|nem|sem)( |$)|alega que|diz que|afirma que|sustenta que|segundo o autor|segundo a re|teria/.test(before)}
function sentences(t){return String(t||'').split(/(?<=[.!?;])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>3)}
function gradeAlg(t,A){const ss=sentences(t),n=norm(t),words=n.split(/[^a-z0-9%]+/).filter(Boolean),w=words.length,fb=[];let s=22;const seen=new Set(),hits=[];
  ss.forEach(se=>{const ns=norm(se);const m=has2(ns,A.kw).filter(x=>!seen.has(x)&&findTerm(ns,x).some(z=>!negated(ns,z.i))).slice(0,2);m.forEach(x=>seen.add(x));if(m.length)hits.push(se)});
  const kf=seen.size;s+=Math.min(kf,6)*8;fb.push([kf>=3?1:0,kf>=3?`Usou os fatos e as provas do caso (${kf} pontos)`:'Faltou trazer os fatos e as provas do caso. Diga o que aconteceu e o que provou.',hits.slice(0,2)]);
  const jg=has2(n,JARG).length;if(jg>=2){s-=4;fb.push([0,'Juridiquês demais. Juiz quer clareza, não latim.'])}
  const ped=has2(n,['requer*','pede*','pedido*','procedencia','improcedencia','condena*','julg*','reconhec*']).length>0;if(ped)s+=10;fb.push([ped?1:0,ped?'Fechou com um pedido claro':'Terminou sem pedir nada: diga o que quer que o juiz decida.']);
  const bad=[];ss.forEach(se=>{const ns=norm(se);A.neg.forEach(k=>findTerm(ns,k).forEach(m=>{if(!negated(ns,m.i)&&!bad.includes(se))bad.push(se)}))});if(bad.length){s-=24;fb.push([0,'Argumento contra o próprio cliente',bad.slice(0,2)])}
  const stop=words.filter(x=>STOP.has(x)).length;if(w>=8&&stop/w<.2){s-=30;fb.push([0,'Parece uma lista de palavras soltas, não uma argumentação.'])}
  if(w<30){s-=15;fb.push([0,`Curto demais (${w} palavras). Você tem 20 minutos.`])}else if(w>280){s-=5;fb.push([0,`Longo demais (${w} palavras). Seja objetivo.`])}else s+=8;
  return {s:Math.round(clamp(s,0,100)),fb}}
/* checa a resposta contra os fatos do caso (ex.: Súmula 385 com anotação anterior legítima) */
function factCheck(t,c,fact){const n=norm(t);
  if(fact==='s385'&&c.hid.outra){const insists=/nao se aplica|afast\w* a sumula|sumula 385 nao|cabe dano moral|dano moral (e|é) devido|mantem o dano moral|ainda assim.{0,40}dano moral|direito ao dano moral|merece (a )?indeniza/.test(n);
    const admits=/(reconhec|admit|de fato|realmente|aplica-se|se aplica|legitim|procede)/.test(n)&&!/nao se aplica/.test(n);
    if(insists||!admits)return {cap:40,msg:'A anotação anterior da cliente era legítima: a Súmula 385 se aplica e afasta o dano moral. A resposta honesta reconhece isso e defende o cancelamento e a declaração de inexistência do débito.',a:['SUM-STJ385']}}
  return null}
function gradeQ(t,Q,c){const n=norm(t),ss=sentences(t);let k=0;const seen=new Set();ss.forEach(se=>{const ns=norm(se);has2(ns,Q.kw).forEach(x=>{if(findTerm(ns,x).some(z=>!negated(ns,z.i)))seen.add(x)})});k=seen.size;let s=k>=2?90:k===1?60:20;const bad=ss.filter(se=>Q.neg.some(x=>findTerm(norm(se),x).some(m=>!negated(norm(se),m.i))));if(bad.length)s-=40;if(n.split(/\s+/).length<6)s-=15;const fc=c&&Q.fact?factCheck(t,c,Q.fact):null;if(fc)s=Math.min(s,fc.cap);return {s:clamp(s,0,100),bad,fc}}
function algSubmit(c){const A=TPL[c.t].alg(c);if(!c.algR){if(norm(UI.txt).split(/\s+/).filter(Boolean).length<5)return toast('Escreva suas alegações (pelo menos algumas frases).');const r=gradeAlg(UI.txt,A);if(c.t==='neg'&&c.hid.outra&&c.rev.outra&&/dano moral/.test(norm(UI.txt))&&!/385/.test(norm(UI.txt))){r.s=Math.max(0,r.s-15);r.fb.push([0,'Você sabia da inscrição anterior legítima e pediu dano moral sem enfrentar a Súmula 385.'])}c.algR={t:UI.txt,r};UI.txt2='';snd('tick')}
  else if(!c.algR.q){if(norm(UI.txt2).split(/\s+/).filter(Boolean).length<3)return toast('Responda ao juiz em uma ou duas frases.');c.algR.q=gradeQ(UI.txt2,A.q,c);c.algR.qt=UI.txt2;c.sc.alg=(c.algR.r.s*.7+c.algR.q.s*.3)/100;c.algDone=1;fx(c.sc.alg>=.7?[['jz',2]]:c.sc.alg<.4?[['jz',-1]]:[]);snd(c.sc.alg>=.6?'ok':'no')}

  if(P.k==='miss')return `<div class="ov" style="background:rgba(80,0,0,.7)"><div class="md" style="border-top-color:var(--er)"><div class="mh2"><small style="color:var(--er)">Prazo perdido · ${esc(P.lbl)} · venceu em ${fmtD(P.ate)}</small><h2>${c?esc(c.cli.n):''}</h2></div><div class="mbd"><p class="big" style="margin-top:0">${esc(P.t)}</p>${leis(P.a)}${P.rep?`<div class="alert er" style="margin-top:10px"><div><b>Representação na OAB</b>O cliente levou o caso ao Tribunal de Ética.${leis(['EAOAB-34'])}</div></div>`:''}${chipsH(P.ch)}<p class="sm mu">"${esc(MENTOR.t)}: aqui ninguém perde prazo." Você lembra da frase a noite inteira.</p></div><div class="mft"><button class="btn er" data-a="popOk">Assumir o erro</button></div></div></div>`;
  if(P.k==='ev'){const E=EVT.find(e=>e.id===P.id),w=P.who;let h=`<div class="ov"><div class="md"><div class="mh2"><small>Dilema · ${esc(w.r)}</small><h2>${esc(E.tit)}</h2></div><div class="mbd"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="av" style="width:52px;height:52px">${face(w.n,w.f)}</div><div class="story">${E.scene(w)}</div></div><div style="height:10px"></div>`;
    E.opts.forEach((o,i)=>{h+=`<button class="ro ${P.sel===i?'on':''}" data-a="evC" data-v="${i}" ${P.sel!=null?'disabled':''}><i></i><div><b>${esc(o.l)}</b></div></button>`});
    if(P.sel!=null){const o=E.opts[P.sel];h+=`<div class="alert ${o.ok>=1?'ok':o.ok>0?'':'er'}"><div><b>${o.ok>=1?'Conduta correta.':o.ok>0?'Zona cinzenta.':'Infração.'}</b>${esc(o.fb)}<div>${leis(o.a)}</div>${o.inf?'<div class="er b sm" style="margin-top:4px">Gerou representação no Tribunal de Ética e Disciplina.</div>':''}${chipsH(P.ch)}</div></div>`}

    return `<div class="ov"><div class="md" style="border-top-color:${w>=1?'var(--ok)':w>0?'var(--go)':'var(--er)'}"><div class="mh2"><small>${esc(TPL[c.t].nome)} · epílogo</small><h2>${head}</h2></div><div class="mbd"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="av" style="width:56px;height:56px">${face(c.cli.n,c.cli.f)}</div><div class="story">${TPL[c.t].epi(c,w>=.5||c.how==='acordo')}</div></div><p class="sm mu">${rl}</p><div class="pz">Honorários do escritório: <b>${money(c.fee||0)}</b> · sua parte (25%): <b>${money(c.share||0)}</b></div>${chipsH(P.ch)}</div><div class="mft"><button class="btn" data-a="popOk">Fechar o processo</button></div></div></div>`}
  if(P.k==='ted'){const t=['','Censura','Suspensão','Exclusão'][P.lv];return `<div class="ov" style="background:rgba(30,0,0,.75)"><div class="md" style="border-top-color:var(--er)"><div class="mh2"><small style="color:var(--er)">Tribunal de Ética e Disciplina · OAB/${S.uf}</small><h2>${t}</h2></div><div class="mbd big"><p>${P.lv===3?'Seis representações. O Conselho Seccional decide pela sua exclusão dos quadros da Ordem. A carteira vermelha volta para a gaveta da Seccional.':P.lv===2?'O Tribunal de Ética aplica a suspensão. Clientes leem no Diário. Alguns ligam; outros não ligam mais.':'O Tribunal de Ética aplica a pena de censura. Fica no seu histórico. A próxima será pior.'}</p>${leis(['EAOAB-35',P.lv===3?'EAOAB-38':'EAOAB-36'])}</div><div class="mft"><button class="btn er" data-a="popOk">${P.lv===3?'Fim da carreira':'Seguir em frente'}</button></div></div></div>`}
  return ''}
function vSent(c,isPop){const st=c.sent,T=sentText(c),w=winOf(c),cls=w>=1?'w':w>0?'p':'l',n=T.L.length;
  return `<div class="sent"><div class="pg"><div class="hdr"><b>PODER JUDICIÁRIO · ${TJ()}</b>${esc(vara(c))}<br><span class="mono">Processo ${c.num}</span></div><p style="text-align:center;letter-spacing:.14em;font-family:var(--sans);font-weight:700;animation-delay:.1s">SENTENÇA</p>${T.L.map((l,i)=>`<p class="${i===n-3?'dsp':''}" style="animation-delay:${.5+i*.9}s">${l}</p>`).join('')}
  <div class="stamp ${cls}" style="animation-delay:${.5+(n-3)*.9+.6}s">${T.lbl}</div>
  <div class="after" style="animation-delay:${.5+n*.9+.4}s"><div class="hr"></div><b class="sm" style="font-family:var(--sans)">Por que ${w>=1?'você venceu':w>0?'a vitória foi parcial':'você perdeu'}</b><ul class="fb" style="margin-top:6px">${st.F.map(f=>`<li class="${f.sg>0?'y':f.sg<0?'n':''}"><i>${f.sg>0?'+':f.sg<0?'−':'·'}</i><div class="sm" style="font-family:var(--sans)">${esc(f.t)}${f.a?`<div>${leis(f.a)}</div>`:''}</div></li>`).join('')}</ul><p class="xs mu" style="font-family:var(--sans)">Força da causa estimada: ${Math.round(st.s*100)}/100 · chance de êxito: ${Math.round(st.p*100)}%</p><button class="btn full" data-a="${isPop?'popOk':'sentClose'}">${isPop?'Continuar':'Fechar'}</button></div></div></div>`}
function vNews(){return `<div class="ov" data-a="newsClose"><div class="md" data-stop="1"><div class="mh2"><small>Novidades · versão ${VERSION}</small><h2>${esc(CHANGELOG[0].t)}</h2></div><div class="mbd">${CHANGELOG.map(c=>`<div class="b sm">${c.v} · ${c.d}</div><ul class="fb">${c.i.map(x=>`<li class="y"><i>✓</i><div class="sm">${esc(x)}</div></li>`).join('')}</ul>`).join('<div class="hr"></div>')}<div class="hr"></div><div class="b sm">Próximas atualizações</div><ul class="fb">${ROADMAP.map(x=>`<li><i>○</i><div class="sm">${esc(x)}</div></li>`).join('')}</ul><p class="note">Seu save continua valendo nas próximas versões.</p></div><div class="mft"><button class="btn" data-a="newsClose">Fechar</button></div></div></div>`}
function vConfirm(){return `<div class="ov"><div class="md"><div class="mh2"><small>Nova carreira</small><h2>Começar do zero?</h2></div><div class="mbd"><p>A carreira atual será apagada: processos, clientes, Vade Mecum estudado e o placar contra o ${RIVAL.t}.</p></div><div class="mft"><button class="btn sec" data-a="confNo">Cancelar</button><button class="btn er" data-a="new">Apagar e recomeçar</button></div></div></div>`}
function vFim(){const G=S.g;return `<div class="cover"><div class="frame"></div><div class="kick">Fim da carreira</div><h1 style="font-size:clamp(40px,9vw,72px)">EXCLUÍD${g('A','O')}</h1><div class="tag">O Tribunal de Ética falou por último.</div><div class="lines">${G.stats.closed} processos encerrados · ${G.stats.won} vitórias · ${G.inf} representações · ${S.vm.n} artigos estudados.<br><br>A advocacia é feita de prazos, de clientes e de ética. Faltou a terceira.</div><div class="btns"><button class="btn gold" data-a="new">Nova carreira</button><button class="btn sec" data-a="cover">Capa</button></div></div>`}

/* ---------- render ---------- */

  else if(S){switch(S.phase){case 'tut':h=vTut();break;case 'oab1':h=vOab1();break;case 'oab1res':h=vOab1Res();break;case 'oab2':h=vOab2();break;case 'oab2res':h=vOab2Res();break;case 'posse':h=vPosse();break;case 'fim':h=vFim();break;
    default:{let inner;if(UI.open&&byId(UI.open))inner=vCase(byId(UI.open));else inner={painel:vPainel,processos:vProcessos,prazos:vPrazos,clientes:vClientes,escritorio:vEscritorio,vade:vVade,oab:vOAB}[UI.tab]();h=shell(inner);if(S.g.pop.length)h+=vPop();if(UI.sent)h+=vSent(byId(UI.sent),false)}}
    if(S.phase!=='car'&&UI.tab==='vade'&&S.phase!=='fim')h=preBar('Vade Mecum')+`<div class="wrap" style="margin:0 auto;max-width:760px"><button class="lnk sm" data-a="vmBack">← Voltar</button><div style="height:8px"></div>${vVade()}</div>`;}
  if(UI.vm)h+=vDrawer();if(UI.modal==='news')h+=vNews();if(UI.modal==='confirm')h+=vConfirm();

setInterval(()=>{if(!S||UI.screen!=='game')return;let dl,tot;if(S.phase==='oab1'&&!S.ex.shown){dl=S.ex.dl;tot=QT}else if(S.phase==='oab2'&&S.p2.st==='peca'){dl=S.p2.dl;tot=PT}else return;
  const left=Math.max(0,dl-Date.now()),t=document.getElementById('tt'),b=document.getElementById('tb'),x=document.getElementById('tx');if(t)t.textContent=fmtT(left);if(b)b.style.width=(left/tot*100)+'%';if(x)x.classList.toggle('low',left<tot*.15);
  if(left<=0){if(S.phase==='oab1'){for(let i=S.ex.i;i<20;i++)if(S.ex.ans[i]==null)S.ex.ans[i]=-1;S.phase='oab1res';toast('Tempo esgotado. Prova recolhida.')}else{examPeca()}save();render()}},500);

/* ---------- ações ---------- */
function startOab1(){const used=new Set(S.usedQ);let pickQ=[];Object.keys(DIST).forEach(d=>{let pool=QB.map((q,i)=>i).filter(i=>QB[i].d===d&&!used.has(i));if(pool.length<DIST[d])pool=QB.map((q,i)=>i).filter(i=>QB[i].d===d);pickQ=pickQ.concat(shuffle(pool).slice(0,DIST[d]))});pickQ=shuffle(pickQ);
  S.usedQ=S.usedQ.concat(pickQ);S.ex={q:pickQ,perm:pickQ.map(()=>shuffle([0,1,2,3])),i:0,ans:[],dl:Date.now()+QT,shown:false};S.phase='oab1';save();render();top()}
function startOab2(){const c={t:'neg',num:'—',lado:'autor',rito:'jec',rev:{prot:1,ext:1},asked:[],sc:{},autos:[],m:null};Object.assign(c,TPL.neg.make());c.rito='jec';c.hid.outra=false;c.hid.prot=true;c.rev={prot:1};
  S.p2={st:'peca',c,dl:Date.now()+PT,sc:0,res:null,disc:{q:shuffle(D2.map((x,i)=>i)).slice(0,4),i:0,ans:[]}};S.phase='oab2';save();render();top()}
function examPeca(){const P=S.p2;if(P.st!=='peca')return;mInit(P.c);P.sc=protocol(P.c,'exam')||0;P.res=P.c.mres.res;P.st='disc';save();render();top()}
function curCase(){return UI.open?byId(UI.open):null}
function act(a,v,el){const G=S&&S.g,c=S&&S.phase==='car'?curCase():(S&&S.phase==='oab2'?S.p2.c:null);
  switch(a){

  case 'cover':UI.screen='cover';UI.open=null;UI.vm=null;render();top();break;

  case 'sx':UI.setup.sx=v;render();break;

  case 'tut':S.tut++;save();render();top();break;
  case 'tutPick':S.tutA=v;snd(v===addUteis('2027-04-16',5)?'ok':'no');save();render();break;

  case 'ans1':if(S.ex.shown)return;S.ex.ans[S.ex.i]=+v;S.ex.shown=true;snd(+v===QB[S.ex.q[S.ex.i]].c?'ok':'no');save();render();break;
  case 'next1':if(S.ex.i<19){S.ex.i++;S.ex.shown=false}else S.phase='oab1res';save();render();top();break;
  case 'retry1':S.exN++;S.g.date=addD(S.g.date,120);S.g.cx-=300;S.g.ind.st=clamp(S.g.ind.st+10,0,100);startOab1();break;
  case 'oab2':startOab2();break;
  case 'ans2':{const D=S.p2.disc;if(D.ans[D.i]!=null)return;D.ans[D.i]=+v;snd(+v===D2[D.q[D.i]].c?'ok':'no');save();render();break}
  case 'next2':{const D=S.p2.disc;if(D.i<3)D.i++;else S.phase='oab2res';save();render();top();break}

  case 'popOk':{const P=G.pop.shift();if(P&&P.k==='ted'&&P.lv===3){S.phase='fim'}save();render();break}

  case 'ask':ask(c,v);break;case 'endAt':if(c.asked.length<1)return toast('Faça ao menos uma pergunta.');endAtend(c);break;

  case 'mUp':case 'mDn':{const A=mInit(c).a.fatos,i=+v,j=a==='mUp'?i-1:i+1;[A.ord[i],A.ord[j]]=[A.ord[j],A.ord[i]];render();break}
  case 'mOff':{const A=mInit(c).a.fatos;A.off[v]=!A.off[v];render();break}
  case 'mImp':{const [i,x]=v.split(':');mInit(c).a.imp.v[i]=+x;render();break}
  case 'mNext':{const b=montBlocks(c)[c.m.i],A=c.m.a[b.k];if((b.k==='end'||b.k==='prelim'||b.k==='valor')&&A.sel==null)return toast('Escolha uma opção.');if(b.k==='imp'&&Object.keys(A.v).length<b.items.length)return toast('Decida sobre todos os fatos.');c.m.i++;mInit(c);save();render();top();break}
  case 'mPrev':c.m.i=Math.max(0,c.m.i-1);render();top();break;
