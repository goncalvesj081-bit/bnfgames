<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<meta name="description" content="Distintivo - simulador de carreira de delegado: concurso, delegacia no interior, combate ao roubo de celular em São Paulo e à letalidade violenta no Rio de Janeiro. Grátis.">
<title>Distintivo</title>
<link rel="icon" href="./bnf-favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --hd:#0B2545;--hd2:#13315C;--bg:#E8ECF1;--pn:#FFFFFF;--pn2:#F5F7FA;--ln:#D2D9E2;--ln2:#E6EAF0;
  --tx:#1B2430;--tx2:#3A4656;--mu:#5B6777;--mu2:#8A95A3;
  --pr:#1D4E89;--pr2:#E6EEF8;--ok:#1E7B4D;--ok2:#E5F4EC;--wa:#946200;--wa2:#FFF3D1;--er:#B42318;--er2:#FDEBE9;
  --sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--serif:'IBM Plex Serif',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
#app{max-width:820px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:86px}
.mono{font-family:var(--mono)} .mu{color:var(--mu)} .mu2{color:var(--mu2)} .ok{color:var(--ok)} .er{color:var(--er)} .wa{color:var(--wa)} .pr{color:var(--pr)}
.sm{font-size:12.5px} .xs{font-size:11.5px} .b{font-weight:600}

/* barra do sistema */
.sys{background:var(--hd);color:#fff}
.sys .r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .lg{width:28px;height:28px;border-radius:3px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand b{font-weight:700;letter-spacing:.06em;font-size:14px}
.brand span{font-size:11px;color:#9FB3CF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usr{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#C9D6E8;text-align:right;line-height:1.25;flex-shrink:0}
.usr .av{width:28px;height:28px;border-radius:3px;overflow:hidden;background:#24456F}
.usr .av svg{display:block;width:100%;height:100%}
.sys2{background:var(--hd2);color:#C9D6E8;font-size:11.5px;display:flex;justify-content:space-between;gap:10px;padding:6px 12px;white-space:nowrap;overflow:hidden}
.sys2 b{color:#fff;font-weight:600}
.mods{display:flex;overflow-x:auto;background:var(--pn);border-bottom:1px solid var(--ln);scrollbar-width:none;position:sticky;top:0;z-index:20}
.mods::-webkit-scrollbar{display:none}
.mod{flex-shrink:0;padding:11px 13px 10px;font-size:13px;font-weight:500;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.mod.on{color:var(--pr);border-bottom-color:var(--pr);font-weight:600}
.mod i{font-style:normal;display:inline-block;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:9px;background:var(--er);color:#fff;font-size:10.5px;margin-left:5px;padding:0 4px}
.wrap{padding:12px}
.ttl{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:2px 0 10px}
.ttl h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.ttl .sub{font-size:12px;color:var(--mu)}

/* painéis */
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:4px;overflow:hidden}
.pn+.pn{margin-top:12px}
.pn>h3{margin:0;padding:8px 12px;background:var(--pn2);border-bottom:1px solid var(--ln);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);display:flex;justify-content:space-between;gap:8px}
.pn>h3 span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--mu)}
.pb{padding:12px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.kv>div{padding:9px 12px;border-bottom:1px solid var(--ln2);border-right:1px solid var(--ln2);min-width:0}
.kv>div:nth-child(2n){border-right:0}
.kv label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu2);font-weight:600}
.kv b{display:block;font-size:13.5px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:640px){.kv.k4{grid-template-columns:repeat(4,1fr)}.kv.k4>div:nth-child(2n){border-right:1px solid var(--ln2)}.kv.k4>div:nth-child(4n){border-right:0}}

/* tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--pn2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--ln2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.ck{cursor:pointer} tr.ck:hover td{background:#F7F9FC}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}

/* selos */
.bd{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:var(--pn2);color:var(--mu);border:1px solid var(--ln);white-space:nowrap}
.bd.ok{background:var(--ok2);color:var(--ok);border-color:#B7DEC8}
.bd.wa{background:var(--wa2);color:var(--wa);border-color:#F1DB9B}
.bd.er{background:var(--er2);color:var(--er);border-color:#F3C1BB}
.bd.pr{background:var(--pr2);color:var(--pr);border-color:#BFD2EA}
.bar{height:6px;background:var(--ln2);border-radius:1px;overflow:hidden;min-width:60px}
.bar>div{height:100%;background:var(--pr)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:3px;background:var(--pr);color:#fff;font-size:13px;font-weight:600;border:1px solid var(--pr)}
.btn.sec{background:#fff;color:var(--pr);border-color:#AFC3DD}
.btn.er{background:#fff;color:var(--er);border-color:#F0B8B1}
.btn.full{width:100%;height:42px}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--ln);box-shadow:0 -4px 14px rgba(11,37,69,.06);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.foot>div{max-width:796px;margin:0 auto;display:flex;align-items:center;gap:10px}
.foot .inf{flex:1;font-size:11.5px;color:var(--mu);line-height:1.35;min-width:0}
.foot .inf b{color:var(--tx)}

/* ofício */
.memo{background:#fff;border:1px solid var(--ln);border-radius:2px;box-shadow:0 1px 0 var(--ln2)}
.memo .mh{display:flex;justify-content:space-between;gap:10px;padding:12px 14px 10px;border-bottom:2px solid var(--hd)}
.memo .mh b{font-size:12.5px;letter-spacing:.04em}
.memo .mb{padding:14px;font-family:var(--serif);font-size:15px;line-height:1.6;color:#222}
.memo .mb p{margin:0 0 10px}
.memo .meta{font-family:var(--sans);font-size:12px;color:var(--mu);margin-bottom:10px;line-height:1.5}
.memo .meta b{color:var(--tx)}
.desp{border-top:1px dashed var(--ln);padding:12px 14px 14px;background:var(--pn2)}
.desp>label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--tx2);margin-bottom:8px}
.ro{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;width:100%;padding:10px 12px;background:#fff;border:1px solid var(--ln);border-radius:3px;margin-bottom:6px}
.ro i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mu2);margin-top:2px}
.ro.on{border-color:var(--pr);background:var(--pr2)} .ro.on i{border:5px solid var(--pr)}
.ro b{display:block;font-size:13.5px;font-weight:600}
.ro span{display:block;font-size:12px;color:var(--mu);margin-top:2px}

/* plano de ação */
.pol{padding:12px;border-bottom:1px solid var(--ln2)}
.pol:last-child{border-bottom:0}
.pol .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pol .h b{font-size:13.5px;font-weight:600}
.pol p{margin:5px 0 8px;font-size:12.5px;color:var(--tx2)}
.spec{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--mu);margin-bottom:8px}
.spec b{color:var(--tx);font-weight:600;font-family:var(--mono)}
.chart{display:block;width:100%;height:auto}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--mu);padding:0 12px 10px}
.leg i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:4px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:60;background:var(--hd);color:#fff;border-radius:3px;padding:9px 14px;font-size:13px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.note{font-size:11.5px;color:var(--mu);margin:10px 2px 0;line-height:1.5}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid #F1DB9B;background:var(--wa2);border-radius:3px;font-size:12.5px;margin-bottom:12px}
.alert.er{border-color:#F3C1BB;background:var(--er2)}
.alert.ok{border-color:#B7DEC8;background:var(--ok2)}
.alert b{display:block}
/* concurso */
.al{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--ln2)}
.al:last-child{border-bottom:0}
.stp{display:flex;align-items:center;border:1px solid var(--ln);border-radius:3px;overflow:hidden}
.stp button{width:32px;height:30px;background:var(--pn2);font-size:16px;font-weight:600;text-align:center;color:var(--pr)}
.stp span{width:30px;text-align:center;font-family:var(--mono);font-weight:600}
.opt{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;width:100%;padding:11px 12px;border:1px solid var(--ln);background:#fff;border-radius:3px;font-size:14px;margin-bottom:6px}
.opt .L{width:26px;height:26px;border-radius:2px;border:1px solid var(--ln);background:var(--pn2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--tx2)}
.opt.c{border-color:var(--ok);background:var(--ok2)} .opt.c .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.w{border-color:var(--er);background:var(--er2)} .opt.w .L{background:var(--er);color:#fff;border-color:var(--er)}
.clock{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.clock b{font-family:var(--mono);font-size:16px;font-weight:600;min-width:48px}
.clock .bar{flex:1;height:5px}
.clock.low b{color:var(--er)} .clock.low .bar>div{background:var(--er)}
textarea{width:100%;min-height:230px;resize:vertical;border:1px solid var(--ln);border-radius:3px;padding:12px;font-family:var(--serif);font-size:15px;line-height:1.6;background:#fff}
input.in{width:100%;height:40px;border:1px solid var(--ln);border-radius:3px;padding:0 10px;font-size:14px;background:#fff}
textarea:focus,input.in:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
.big{font-size:40px;font-weight:700;line-height:1;font-family:var(--mono);letter-spacing:-.02em}
.face{width:30px;height:30px;border-radius:2px;overflow:hidden;background:#DDE4EC;flex-shrink:0}
.face svg{display:block;width:100%;height:100%}
.who{display:flex;align-items:center;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;border:1px solid var(--ln);border-radius:3px;background:#fff;font-size:12.5px;margin:0 6px 6px 0}
.chk.on{border-color:var(--pr);background:var(--pr2);color:var(--pr);font-weight:600}
.chk.busy{opacity:.55}
.cover{min-height:100vh;display:flex;flex-direction:column}
.login{max-width:420px;margin:0 auto;padding:22px 16px}
.seal{width:64px;height:64px;margin:0 auto 10px;display:block}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--ln)}
.tl>div{position:relative;padding:4px 0 12px}
.tl>div::before{content:"";position:absolute;left:-21px;top:7px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--mu2)}
.tl>div.d::before{background:var(--ok);border-color:var(--ok)}
.tl>div.n::before{background:var(--pr);border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================================================================
   DISTINTIVO — simulador de carreira de delegado (BNF Games)
   Números de criminalidade são simulados e não são estatística oficial.
   Pessoas, casos e a cidade inicial são fictícios.
================================================================= */
(function(){
'use strict';
const $=document.getElementById('app');
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f0=x=>Math.round(x).toLocaleString('pt-BR');
const f1=x=>(Math.round(x*10)/10).toFixed(1).replace('.',',');
const pct=x=>(x>0?'+':'')+f1(x*100)+'%';
const money=x=>'R$ '+f1(x)+' mil';
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const KEY='distintivo_v2',BEST='distintivo_best2';
const store={mem:{},set(k,v){try{localStorage.setItem(k,v)}catch(e){this.mem[k]=v}},get(k){try{const r=localStorage.getItem(k);return r===null?(this.mem[k]||null):r}catch(e){return this.mem[k]||null}}};
let S=null;
let UI={screen:'cover',mod:'painel',ip:null,memo:null,sel:null,setup:{nome:'',fundo:'rec',sexo:'f'},ans:'',toast:null};
function save(){if(S)store.set(KEY,JSON.stringify(S))}
function load(){try{const r=store.get(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function toast(t){UI.toast=t;render();clearTimeout(toast.h);toast.h=setTimeout(()=>{UI.toast=null;render()},2400)}
const top=()=>window.scrollTo(0,0);
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function dateOf(w){const d=new Date(2027,2,1);d.setDate(d.getDate()+7*(w-1));return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
const SEAL='<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3l24 9v18c0 15-10.5 26-24 31C18.5 56 8 45 8 30V12z" fill="#0B2545"/><path d="M32 9l19 7v14c0 12-8.3 20.8-19 25-10.7-4.2-19-13-19-25V16z" fill="none" stroke="#C9A54C" stroke-width="1.6"/><path d="M32 18l3.5 7.2 7.9 1.1-5.7 5.5 1.4 7.8L32 35.9l-7.1 3.7 1.4-7.8-5.7-5.5 7.9-1.1z" fill="#C9A54C"/></svg>';
const SEAL_S='<svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><path d="M32 3l24 9v18c0 15-10.5 26-24 31C18.5 56 8 45 8 30V12z" fill="#0B2545"/><path d="M32 16l4 8.2 9 1.3-6.5 6.3 1.5 8.9L32 36.5l-8 4.2 1.5-8.9L19 25.5l9-1.3z" fill="#C9A54C"/></svg>';

/* ---------- rostos (SVG próprio) ---------- */
function hashS(t){let h=7;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return h}
function face(name,fem){
  const h=hashS(name),sk=['#F3D0B0','#E8B993','#D49A70','#B9794F','#8D5A3B'][h%5],hc=['#1F1712','#3A2A1E','#6B4A2E','#2A2A2A','#B08A5A','#9A9A9A'][(h>>3)%6];
  const sty=fem?['long','bun','bob'][(h>>6)%3]:['short','buzz','bald','quiff'][(h>>6)%4],beard=!fem&&(h>>9)%3===0,gl=(h>>11)%5===0;
  let o=`<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#D7DFE9"/>`;
  if(sty==='long')o+=`<path d="M17 30C15 14 49 14 47 30C49 42 50 50 46 58H18C14 50 15 42 17 30Z" fill="${hc}"/>`;
  o+=`<path d="M8 64C10 51 20 46 32 46S54 51 56 64Z" fill="#2B3A52"/><path d="M27 46L32 53L37 46Z" fill="#F3F4F6"/>`;
  o+=`<rect x="27" y="37" width="10" height="10" rx="3" fill="${sk}"/><circle cx="20" cy="29" r="2.8" fill="${sk}"/><circle cx="44" cy="29" r="2.8" fill="${sk}"/><ellipse cx="32" cy="28" rx="12" ry="14" fill="${sk}"/>`;
  if(sty==='short')o+=`<path d="M19.3 29.5C16.5 9.5 47.5 9.5 44.7 29.5C44 23 41.5 20.4 37.5 20C33 21.2 28 21 24.5 19.8C21.5 21 20 24 19.3 29.5Z" fill="${hc}"/>`;
  if(sty==='buzz')o+=`<path d="M20 26C19.5 13 44.5 13 44 26C42 20 37 18.5 32 18.5S22 20 20 26Z" fill="${hc}" opacity=".8"/>`;
  if(sty==='quiff')o+=`<path d="M19.6 27C18 13 30 9 38 12C44 14 46 19 44.4 27C43 21 39 18.5 33 18.5C27 18.5 21.5 21 19.6 27Z" fill="${hc}"/>`;
  if(sty==='bald')o+=`<path d="M19.8 30C19.5 25 20.5 22.5 22.5 21.5L22.8 30ZM44.2 30C44.5 25 43.5 22.5 41.5 21.5L41.2 30Z" fill="${hc}"/>`;
  if(sty==='long'||sty==='bob')o+=`<path d="M19.5 29C19 15 45 15 44.5 29C42 22 36 19 31 20.5C27 22 22 24 19.5 29Z" fill="${hc}"/>`;
  if(sty==='bob')o+=`<path d="M19 26C17 36 18 40 21 41L22 30ZM45 26C47 36 46 40 43 41L42 30Z" fill="${hc}"/>`;
  if(sty==='bun')o+=`<path d="M19.5 28C19 15 45 15 44.5 28C42 21 37 19 32 19S22 21 19.5 28Z" fill="${hc}"/><circle cx="32" cy="12.5" r="5.5" fill="${hc}"/>`;
  if(beard)o+=`<path d="M21 30C21.5 40 26 42.5 32 42.5S42.5 40 43 30C41.5 35 38 37.3 32 37.6C26 37.3 22.5 35 21 30Z" fill="${hc}" opacity=".85"/>`;
  o+=`<path d="M24.5 24.3Q27 23 29.4 24.1M34.6 24.1Q37 23 39.5 24.3" stroke="${hc}" stroke-width="1.3" stroke-linecap="round" fill="none"/><ellipse cx="27" cy="27.6" rx="1.5" ry="1.7" fill="#1A1410"/><ellipse cx="37" cy="27.6" rx="1.5" ry="1.7" fill="#1A1410"/><path d="M28.5 35.2Q32 36.6 35.5 35.2" stroke="#7A3530" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;
  if(gl)o+=`<g fill="none" stroke="#111" stroke-width="1.1"><rect x="23.2" y="25" width="7.6" height="5.6" rx="2"/><rect x="33.2" y="25" width="7.6" height="5.6" rx="2"/><path d="M30.8 27Q32 26.2 33.2 27"/></g>`;
  return o+'</svg>';
}

/* ================================================================
   CONCURSO
================================================================= */
const MAT=[{id:'penal',nome:'Direito Penal'},{id:'proc',nome:'Processo Penal'},{id:'const',nome:'Direito Constitucional'},{id:'adm',nome:'Direito Administrativo'},{id:'esp',nome:'Legislação Especial'},{id:'crim',nome:'Criminologia e Medicina Legal'}];
const ATV=[...MAT.map(m=>({id:m.id,nome:m.nome})),{id:'treino',nome:'Treino físico (TAF)'},{id:'trab',nome:'Trabalho remunerado (+R$ 1,4 mil)'},{id:'desc',nome:'Descanso'}];

function studyMonth(){
  const C=S.c;if(usedB()!==C.blocos)return toast(`Distribua os ${C.blocos} blocos do mês.`);
  const eff=C.en<25?.55:C.en<45?.8:1,ch=[];
  MAT.forEach(m=>{const n=C.alloc[m.id]||0;if(!n)return;let g=0;for(let i=0;i<n;i++)g+=10*(1-C.k[m.id]/115)*eff*R(.85,1.15)*Math.pow(.85,i);C.k[m.id]=clamp(C.k[m.id]+g,0,100);ch.push(`${m.nome.split(' ').pop()} +${f0(g)}`)});
  const tr=C.alloc.treino||0;if(tr){const g=tr*7*(1-C.fit/120);C.fit=clamp(C.fit+g,0,100);ch.push(`TAF +${f0(g)}`)}
  const tb=C.alloc.trab||0;C.money+=tb*1.4-2.2;
  const sb=MAT.reduce((a,m)=>a+(C.alloc[m.id]||0),0);
  C.en=clamp(C.en-sb*7-tr*4-tb*5+(C.alloc.desc||0)*22+8,0,100);
  MAT.forEach(m=>{if(!C.alloc[m.id])C.k[m.id]=clamp(C.k[m.id]-1.2,0,100)});
  if(C.money<0){C.en=clamp(C.en-12,0,100);ch.push('contas em atraso')}
  C.log.unshift(`Mês ${C.mes}: `+(ch.join(' · ')||'sem estudo'));
  C.mes++;if(C.mes>C.meses){startExam();return}
  C.ev=Math.random()<.5?pick(STEV.filter(e=>!e.cond||e.cond(C))).id:null;
  save();render();top();
}
function startExam(){S.phase='objetiva';S.ex={qs:balQs(),i:0,ans:[],dl:Date.now()+45000,shown:false};save();render();top()}
function balQs(){const by={};QB.forEach((q,i)=>(by[q.m]=by[q.m]||[]).push(i));const out=[];['const','proc','proc','penal','esp','esp','adm','crim','penal','const'].forEach(m=>{const p=(by[m]||[]).filter(i=>!out.includes(i));if(p.length)out.push(pick(p))});return out}
function finishObj(){const E=S.ex,C=S.c,hits=E.qs.filter((q,k)=>E.ans[k]===QB[q].c).length,kav=MAT.reduce((a,m)=>a+C.k[m.id],0)/MAT.length;E.hits=hits;E.nota=Math.round(clamp(hits*10*.5+kav*.55+5+R(-3,3),0,100));S.notas={obj:E.nota};S.phase='objres'}
function gradeDisc(t){
  const n=norm(t||''),w=(t||'').trim().split(/\s+/).filter(Boolean).length,fb=[];let s=18;
  s+=DISC.kw.filter(g=>g.some(k=>n.includes(norm(k)))).length*6;
  fb.push(n.includes('312')?'Indicou o art. 312 do CPP como fundamento legal.':'Ausência de indicação do art. 312 do CPP.');
  if(/ordem publica/.test(n))fb.push('Fundamentação na garantia da ordem pública.');
  fb.push(/instrucao/.test(n)?'Demonstrou risco à instrução criminal (ameaça a testemunhas).':'Não explorou a conveniência da instrução criminal.');
  fb.push(/materialidade|existencia do crime/.test(n)&&/autoria/.test(n)?'Demonstrou materialidade e indícios de autoria.':'Faltou demonstrar materialidade e indícios suficientes de autoria.');
  if(w<60){s-=12;fb.push('Texto insuficiente para uma peça processual.')}else if(w>140)s+=6;
  s+=(S.c.k.proc-50)*.25;
  return {s:Math.round(clamp(s+R(-4,4),0,100)),fb};
}
function runTAF(){const F=S.c.fit,c=Math.round(1700+F*13+R(-180,180)),b=Math.max(0,Math.round(F/9+R(-2,2))),a=Math.round(18+F*.42+R(-5,5));S.taf={res:[{n:'Corrida de 12 minutos',v:c+' m',ok:c>=2400,min:'2.400 m'},{n:'Barra fixa',v:b+' rep.',ok:b>=3,min:'3 rep.'},{n:'Abdominal (1 min)',v:a+' rep.',ok:a>=35,min:'35 rep.'}],i:0};S.taf.ok=S.taf.res.every(r=>r.ok);S.phase='taf'}
function finishOral(){const O=S.oral,pts=O.ans.reduce((a,x)=>a+x,0),kav=MAT.reduce((a,m)=>a+S.c.k[m.id],0)/MAT.length;S.notas.oral=Math.round(clamp(pts/(O.qs.length*3)*70+kav*.3+R(-3,3),0,100));const fin=S.notas.obj*.4+S.notas.disc*.35+S.notas.oral*.25;S.notas.fin=Math.round(fin*10)/10;S.notas.vagas=60;S.notas.rank=Math.max(1,Math.round(60*Math.exp((71-fin)/7.5)));S.notas.ok=S.notas.rank<=60;S.phase='resultado'}

const DIL={
  oitiva:{n:'Oitivas (vítimas e testemunhas)',atos:1,cost:0},
  cameras:{n:'Análise de imagens de câmeras',atos:1,cost:0},
  pericia:{n:'Requisição de perícia',atos:1,cost:1},
  quebra:{n:'Representação por quebra de sigilo',atos:1,cost:0},
  intercep:{n:'Representação por interceptação telefônica',atos:2,cost:3},
  busca:{n:'Mandado de busca e apreensão / prisão',atos:2,cost:2},
  relatar:{n:'Relatório final ao Ministério Público',atos:1,cost:0},
  arquivar:{n:'Relatório sem autoria definida',atos:1,cost:0},
};
function canDil(cs,k){
  const G=S.g,D=DIL[k];
  if(G.atos<D.atos)return 'sem atos disponíveis';if(D.cost>G.orc)return 'orçamento insuficiente';
  if(k==='cameras'&&(!cs.cams||cs.dil.cameras))return cs.cams?'já realizada':'sem câmeras na área';
  if(k==='pericia'&&cs.dil.pericia)return 'já requisitada';
  if(k==='intercep'&&(cs.g<3||cs.dil.intercep))return cs.g<3?'incabível (pena de detenção/baixa gravidade)':'já deferida';
  if(k==='quebra'&&(cs.dil.quebra||0)>=2)return 'pedidos esgotados';
  if(k==='busca'&&(cs.prog<55||cs.preso))return cs.preso?'investigado já preso':'requer 55% de andamento';
  if(k==='relatar'&&cs.prog<75)return 'requer 75% de andamento';
  return '';
}
function doDil(id,k){
  const G=S.g,cs=caseOf(id),D=DIL[k],why=canDil(cs,k);if(why)return toast('Indisponível: '+why);
  G.atos-=D.atos;G.orc-=D.cost;cs.dil[k]=(cs.dil[k]||0)+1;
  const tp=cs.team.reduce((a,i)=>a+((agentOf(i)||{}).sk||0),0),inv=1+(G.bonus.inv||0);let m='';
  switch(k){
    case 'oitiva':{const g=(10+tp*1.5)*Math.pow(.7,cs.dil.oitiva-1)*inv/Math.sqrt(cs.d);cs.prog=clamp(cs.prog+g,0,100);m=`Termos de depoimento juntados (+${f0(g)}%).`;break}
    case 'cameras':{const ok=Math.random()<.7,g=ok?R(14,22)*inv:4;cs.prog=clamp(cs.prog+g,0,100);m=ok?`Imagens identificam o suspeito (+${f0(g)}%).`:'Imagens de baixa qualidade.';break}
    case 'pericia':{G.pend=G.pend||[];G.pend.push({at:G.sem+2,id,g:R(18,26),t:'Laudo pericial'});m='Requisição enviada ao Instituto de Criminalística. Prazo: 2 semanas.';break}
    case 'quebra':if(Math.random()<.42+G.rel.jud/250+(G.bonus.int||0)){const g=R(20,30)*inv;cs.prog=clamp(cs.prog+g,0,100);relAdj('jud',1);m=`Quebra de sigilo deferida (+${f0(g)}%).`}else{relAdj('jud',-2);m='Pedido indeferido por insuficiência de fundamentação.'}break;
    case 'intercep':if(Math.random()<.4+G.rel.jud/250+(G.bonus.int||0)){G.pend=G.pend||[];G.pend.push({at:G.sem+2,id,g:R(30,42),t:'Relatório de interceptação'});m='Interceptação deferida por 15 dias.'}else{relAdj('jud',-2);m='Interceptação indeferida.'}break;
    case 'busca':if(Math.random()<clamp(.3+cs.prog/200+cs.team.length*.06+(G.bonus.ges||0)/2,.2,.92)){cs.preso=true;const g=R(18,28);cs.prog=clamp(cs.prog+g,0,100);relAdj('imp',cs.g>=3?2:0);m=`Mandado cumprido. Investigado preso (+${f0(g)}%).`}else{cs.prog=clamp(cs.prog-10,0,100);m='Investigado não localizado no endereço.'}break;
    case 'relatar':if(Math.random()<clamp(.45+(cs.prog-75)/45+G.rel.mp/400,.3,.97)){cs.st='relatado';G.solved++;release(cs);relAdj('mp',1.5);if(cs.g>=4)relAdj('imp',3);m='Relatório final aceito. Denúncia oferecida pelo MP.'}else{cs.prog=65;relAdj('mp',-2);m='Autos devolvidos pelo MP com requisição de novas diligências.'}break;
    case 'arquivar':cs.st='sem autoria';G.unsolved++;release(cs);if(cs.g>=4){relAdj('imp',-4);relAdj('com',-3)}m='Relatório sem autoria encaminhado.';break;
  }
  cs.log.unshift({s:G.sem,t:m});save();render();toast(m);
}
function release(cs){cs.team.forEach(i=>{const a=agentOf(i);if(a&&a.al==='c'+cs.id)a.al=null});cs.team=[]}
function toggleAgent(cid,aid){const cs=caseOf(cid),a=agentOf(aid);if(!cs||!a)return;
  if(cs.team.includes(aid)){cs.team=cs.team.filter(x=>x!==aid);a.al=null}
  else{if(a.al&&a.al.startsWith('p'))return toast('Servidor alocado em ação estratégica.');if(cs.team.length>=3)return toast('Máximo de 3 servidores por inquérito.');if(a.al){const o=caseOf(+a.al.slice(1));if(o)o.team=o.team.filter(x=>x!==aid)}a.al='c'+cid;cs.team.push(aid)}
  save();render()}

function polStatus(id){const G=S.g,P=POL[id],a=G.pol[id];if(a&&a.on)return 'ativa';for(const k in (P.req||{}))if(G.rel[k]<P.req[k])return 'req';return 'disp'}
function togglePol(id){
  const G=S.g,P=POL[id],a=G.pol[id];
  if(a&&a.on){a.on=false;G.team.forEach(x=>{if(x.al==='p'+id)x.al=null});memoLog(`Ação encerrada: ${P.n}.`);save();render();return}
  for(const k in (P.req||{}))if(G.rel[k]<P.req[k])return toast(`Requer relação com ${relName(k)} acima de ${P.req[k]}.`);
  if(G.orc<P.once+P.c)return toast('Orçamento insuficiente para implantar.');
  const fr=G.team.filter(x=>!x.al||x.al.startsWith('c'));
  const free=G.team.filter(x=>!x.al);
  if(fr.length<P.ef)return toast('Efetivo insuficiente.');
  // aloca: primeiro livres, depois retira de inquéritos
  let need=P.ef;for(const x of free.concat(fr.filter(y=>y.al))){if(!need)break;if(x.al&&x.al.startsWith('c')){const cs=caseOf(+x.al.slice(1));if(cs)cs.team=cs.team.filter(z=>z!==x.id)}x.al='p'+id;need--}
  G.orc-=P.once;G.pol[id]={on:true,ramp:a?a.ramp:0,since:G.sem};
  for(const k in (P.fx||{}))if(k in G.rel)relAdj(k,P.fx[k]);
  memoLog(`Ação implantada: ${P.n}.`);save();render();toast('Ação estratégica implantada.');
}

function memo(id){
  const G=S.g,M=MEMOS[id];const n=String(RI(100,980)).padStart(4,'0')+'/'+(2027+Math.floor((G.sem-1)/52));
  G.memos.push({id,n,s:G.sem,done:false});
}
function memoBody(m){
  const M=MEMOS[m.id],G=S.g;
  if(m.id==='posse'){const P=PC();return {tipo:M.tipo,de:M.de,ass:M.ass,b:[`Designo ${S.sexo==='f'?'a Delegada':'o Delegado'} de Polícia ${S.nome}, matrícula ${S.mat}, para responder pela ${G.P.unidade}${G.post===0?', '+G.P.cidade:''}.`,G.P.d,`Metas pactuadas para as próximas ${P.semanas} semanas: ${P.metas.map(metaLabel).join('; ')}.`,'Publique-se. Cumpra-se.'],o:[{t:'Ciente. Assumir a unidade.',s:'',fx:{}}]}}
  return M;
}
function despachar(i,oi){
  const G=S.g,m=G.memos[i],M=memoBody(m),o=M.o[oi],fx=o.fx||{};
  for(const k in fx){
    if(k in G.rel)relAdj(k,fx[k]);
    else if(k==='integ')G.integ=clamp(G.integ+fx[k],0,100);
    else if(k==='stress')G.stress=clamp(G.stress+fx[k],0,100);
    else if(k==='orc')G.orc+=fx[k];
    else if(k==='atos')G.atos=Math.max(0,G.atos+fx[k]);
    else if(k==='moral')G.team.forEach(a=>a.mor=clamp(a.mor+fx[k],0,100));
    else if(k==='temp')fx.temp.forEach(([c,v,w])=>{if(G.crimes[c])G.temp.push({k:c,v,w})});
    else if(k==='due')open().forEach(c=>c.due+=fx[k]);
    else if(k==='pad'){if(Math.random()<.25+G.integ/100){G.integ=clamp(G.integ+10,0,100);memoLog('PAD concluído com advertência.')}else{G.exon=true}}
  }
  m.done=true;m.r=o.t;memoLog(`Despacho em "${M.ass}": ${o.t}.`);UI.memo=null;UI.sel=null;
  if(G.exon){endGame('exon');return}
  save();render();top();toast('Despacho assinado.');
}
const pendMemos=()=>S.g.memos.filter(m=>!m.done);

/* ---------- semana ---------- */
const lateN=()=>open().filter(c=>S.g.sem>c.due).length;
function metaOk(m){return m.k==='venc'?lateN()<=m.max:reduction(m.k)>=m.r}
function metaLabel(m){return m.k==='venc'?`no máximo ${m.max} inquéritos fora do prazo`:`reduzir ${PC().crimes[m.k].n.toLowerCase()} em ${Math.round(m.r*100)}%`}
function crimeNow(k){const h=S.g.crimes[k].hist;return h[h.length-1]}
function avgLast(k,n){const h=S.g.crimes[k].hist,s=h.slice(-n);return s.reduce((a,b)=>a+b,0)/s.length}
function reduction(k){const G=S.g;return 1-avgLast(k,4)/G.crimes[k].base}
function endWeek(){
  const G=S.g;if(pendMemos().length)return toast('Há despachos pendentes no Expediente.');
  const B={sem:G.sem,res:[],newC:[],before:{}};
  for(const k in G.crimes)B.before[k]=crimeNow(k);
  // resultados de perícia/interceptação
  G.pend=(G.pend||[]).filter(p=>{if(G.sem+1>=p.at){const cs=caseOf(p.id);if(cs&&cs.st==='andamento'){cs.prog=clamp(cs.prog+p.g,0,100);cs.log.unshift({s:G.sem+1,t:`${p.t} juntado aos autos (+${f0(p.g)}%).`});B.res.push(`${p.t} — IP ${cs.num}`)}return false}return true});
  // equipe nos inquéritos
  open().forEach(cs=>{let g=0;cs.team.forEach(i=>{const a=agentOf(i);if(a)g+=(5+a.sk*3)*(.5+a.mor/200)});g=g*(1+(G.bonus.inv||0))/cs.d;cs.prog=clamp(cs.prog+g,0,cs.preso?100:92)});
  // ações estratégicas: maturação
  for(const id in G.pol){const a=G.pol[id];a.ramp=a.on?Math.min(1,a.ramp+1/POL[id].mat):Math.max(0,a.ramp-.25)}
  // custos semanais
  let cost=0;for(const id in G.pol)if(G.pol[id].on)cost+=POL[id].c;G.orc+=PC().orc-cost;B.cost=cost;
  if(G.orc<0){for(const id in G.pol)if(G.pol[id].on){G.pol[id].on=false;G.team.forEach(x=>{if(x.al==='p'+id)x.al=null});memoLog(`Ação suspensa por falta de orçamento: ${POL[id].n}.`);break}}
  // criminalidade
  const relF=k=>(G.rel[k]-50)/400;
  const det=1-clamp((esclar()-40)/600,-.05,.08);
  for(const k in G.crimes){
    let m=1;for(const id in G.pol){const P=POL[id],a=G.pol[id];if(!a.ramp)continue;const q=1+relF('com')+(P.req&&P.req.pm?relF('pm'):0);if(P.e[k])m*=1-P.e[k]*.75*a.ramp*q;if(P.disp&&P.disp[k])m*=1+P.disp[k]*a.ramp}
    G.temp.filter(t=>t.k===k).forEach(t=>m*=1+t.v);
    if(['homicidio','letal','roubo','rua','transeunte'].includes(k))m*=det;
    const season=1+.05*Math.sin((G.sem+k.length)/4);
    G.crimes[k].hist.push(Math.max(0,G.crimes[k].base*m*season*R(.92,1.08)));
  }
  G.temp.forEach(t=>t.w--);G.temp=G.temp.filter(t=>t.w>0);
  // prazos
  let late=0;open().forEach(cs=>{if(G.sem>cs.due){late++;relAdj('mp',-.4)}});
  // efetivo e titular
  const load=open().length/Math.max(1,G.team.filter(a=>!a.al||a.al.startsWith('c')).length);
  G.team.forEach(a=>a.mor=clamp(a.mor+(load>2.2?-2:load<1.2?1:0)+R(-1,1),0,100));
  const used=5-G.atos;G.stress=clamp(G.stress+used*.8+Math.min(late,6)*.45+(load>2.5?1.2:0)-3.2,0,100);
  for(const k in G.rel)G.rel[k]=clamp(G.rel[k]+(50-G.rel[k])*.02,0,100);
  // novos inquéritos
  const [a,b]=PC().nCases;const n=a+(Math.random()<.5?b-a:0);for(let i=0;i<n;i++)B.newC.push(newCase(false));
  G.sem++;G.w++;G.atos=5;G.did={};
  if(G.stress>=100){G.burn++;G.stress=55;G.atos=1;memoLog('Titular afastado(a) por licença médica (esgotamento).');B.burn=true;if(G.burn>=3){endGame('burn');return}}
  // expediente
  if(G.integ<38&&!G.padDone&&Math.random()<.35){memo('pad');G.padDone=true}
  else if(Math.random()<.6){G.used=G.used||[];const pool=Object.keys(MEMOS).filter(id=>!MEMOS[id].special&&id!=='posse'&&MEMOS[id].p.includes(G.post)&&!G.used.includes(id));if(pool.length){const id=pick(pool);G.used.push(id);memo(id)}}
  G.hist.push({sem:G.sem,esc:esclar()});
  // avaliação de desempenho
  if(G.w>=G.dl){evaluate();return}
  G.rep=B;UI.mod='rel';save();render();top();
}
function evaluate(){
  const G=S.g,P=PC(),res=P.metas.map(m=>m.k==='venc'?{k:m.k,n:'Inquéritos fora do prazo',venc:1,alvo:m.max,atual:lateN(),ok:metaOk(m)}:{k:m.k,n:P.crimes[m.k].n,alvo:m.r,atual:reduction(m.k),ok:metaOk(m)});
  const ok=res.every(r=>r.ok);G.eval={res,ok,ext:G.ext};UI.mod='aval';save();render();top();
}
function afterEval(){
  const G=S.g,E=G.eval;
  if(E.ok){if(G.post===2){endGame('win');return}const np=G.post+1;G.eval=null;startPost(np);return}
  if(!G.ext){G.ext=true;G.dl+=12;G.eval=null;memoLog('Prazo de avaliação prorrogado por 12 semanas.');UI.mod='painel';save();render();top();return}
  endGame(G.post===2?'exon_gov':'estag');
}
function endGame(kind){
  const G=S.g;S.fim={kind,sem:G.sem,post:G.post,solved:G.solved,esc:esclar(),integ:G.integ};
  S.fim.score=Math.round(G.solved*2+esclar()*.5+G.post*120+(kind==='win'?200:0)-(kind==='exon'?80:0));
  const b=+store.get(BEST)||0;if(S.fim.score>b)store.set(BEST,String(S.fim.score));
  S.phase='fim';save();render();top();
}

function chart(k){
  const G=S.g,P=PC(),h=G.crimes[k].hist,base=G.crimes[k].base,meta=(P.metas.find(m=>m.k===k&&m.r)||{}).r;
  const W=600,H=170,pl=44,pr=10,pt=12,pb=22,mx=Math.max(...h,base)*1.12,mn=0,n=h.length;
  const x=i=>pl+(W-pl-pr)*(n<=1?0:i/(n-1)),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Série semanal de ${P.crimes[k].n}">`;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EAF0"/><text x="${pl-6}" y="${y(v)+4}" font-size="10" fill="#8A95A3" text-anchor="end" font-family="IBM Plex Mono">${mx<10?f1(v):f0(v)}</text>`}
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(base)}" y2="${y(base)}" stroke="#8A95A3" stroke-dasharray="4 4"/>`;
  if(meta)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(base*(1-meta))}" y2="${y(base*(1-meta))}" stroke="#1E7B4D" stroke-dasharray="6 3"/>`;
  s+=`<line x1="${x(3)}" x2="${x(3)}" y1="${pt}" y2="${H-pb}" stroke="#BFD2EA"/><text x="${x(3)+4}" y="${pt+10}" font-size="10" fill="#1D4E89" font-family="IBM Plex Sans">posse</text>`;
  s+=`<polyline points="${h.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="#1D4E89" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  return s+'</svg>';
}

    return `<div class="pol"><div class="h"><b>${A.n}</b>${st==='ativa'?'<span class="bd ok">Ativa</span>':st==='req'?'<span class="bd er">Bloqueada</span>':'<span class="bd">Disponível</span>'}</div><p>${A.d}</p>

    <div class="spec"><span>Efeito esperado: ${effTxt(A)}</span></div>
    ${a&&a.ramp>0?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="xs mu">Maturação</span><div class="bar" style="flex:1"><div style="width:${a.ramp*100}%;background:var(--ok)"></div></div><span class="xs mono">${f0(a.ramp*100)}%</span></div>`:''}
    <button class="btn sm ${st==='ativa'?'er':''}" data-a="pol" data-v="${id}" ${st==='req'?'disabled':''}>${st==='ativa'?'Encerrar ação':'Implantar'}</button></div>`}).join('')}</div>`;
  h+=`<p class="note">O efeito cresce até a maturação e depende da confiança da comunidade e, quando houver integração, da relação com a PM. Ações que deslocam o crime estão sinalizadas em vermelho.</p>`;
  return h;
}
function vExp(){
  const G=S.g;
  if(UI.memo!==null&&G.memos[UI.memo]){
    const m=G.memos[UI.memo],M=memoBody(m);
    let h=`<button class="btn sm sec" data-a="memox" style="margin-bottom:10px">← Expediente</button><div class="memo"><div class="mh"><b>${M.tipo} Nº ${m.n}</b><span class="xs mu mono">${dateOf(m.s)}</span></div><div class="mb"><div class="meta">De: <b>${esc(M.de)}</b><br>Para: <b>${esc(S.nome)}</b> — ${esc(G.P.unidade)}<br>Assunto: <b>${esc(M.ass)}</b></div>${M.b.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
    if(m.done)return h+`<div class="desp"><label>Despacho</label><div class="sm">${esc(m.r)}</div></div></div>`;
    h+=`<div class="desp"><label>Despacho do(a) titular</label>${M.o.map((o,i)=>`<button class="ro ${UI.sel===i?'on':''}" data-a="osel" data-v="${i}"><i></i><div><b>${esc(o.t)}</b>${o.s?`<span>${esc(o.s)}</span>`:''}</div></button>`).join('')}<button class="btn full" style="margin-top:6px" data-a="assina" ${UI.sel===null?'disabled':''}>Assinar despacho</button></div></div>`;
    return h;
  }
  const L=G.memos.map((m,i)=>[m,i]).reverse();
  return `<div class="ttl"><div><h1>Expediente</h1><div class="sub">Documentos recebidos pela unidade</div></div></div><div class="pn"><div class="tw"><table><tr><th>Documento</th><th>Assunto</th><th>Situação</th></tr>${L.map(([m,i])=>{const M=memoBody(m);return `<tr class="ck" data-a="memo" data-v="${i}"><td class="mono xs" style="white-space:nowrap">${M.tipo}<br>${m.n}</td><td class="sm"><b>${esc(M.ass)}</b><div class="xs mu">${esc(M.de)} · ${dateOf(m.s)}</div></td><td>${m.done?'<span class="bd ok">Despachado</span>':'<span class="bd er">Pendente</span>'}</td></tr>`}).join('')}</table></div></div>`;
}
function vIps(){
  const G=S.g;
  if(UI.ip!==null){const c=caseOf(UI.ip);if(c)return vIp(c)}
  const oc=open().sort((a,b)=>(a.due-G.sem)-(b.due-G.sem)||b.g-a.g),done=G.cases.filter(c=>c.st!=='andamento').slice(-10).reverse();
  let h=`<div class="ttl"><div><h1>Inquéritos policiais</h1><div class="sub">${oc.length} em andamento · esclarecimento ${f0(esclar())}%</div></div></div>`;
  h+=`<div class="pn"><div class="tw"><table><tr><th>IP nº</th><th>Natureza / Fato</th><th class="n">Andamento</th><th>Prazo</th></tr>${oc.map(c=>{const late=G.sem>c.due,l=c.due-G.sem;return `<tr class="ck" data-a="ip" data-v="${c.id}"><td class="mono xs">${c.num}</td><td class="sm"><b>${CR[c.tipo].n}</b>${c.g>=4?' <span class="bd er">grave</span>':''}<div class="xs mu">${esc(c.t)} · ${c.team.length?c.team.length+' servidor(es)':'<span class="er">sem equipe</span>'}</div></td><td class="n">${f0(c.prog)}%</td><td>${late?`<span class="bd er">Vencido ${G.sem-c.due} sem.</span>`:l<=1?'<span class="bd wa">Vence</span>':`<span class="bd">${l} sem.</span>`}</td></tr>`}).join('')||'<tr><td colspan="4" class="sm mu">Nenhum inquérito em andamento.</td></tr>'}</table></div></div>`;
  if(done.length)h+=`<div class="pn"><h3>Concluídos recentemente</h3><div class="tw"><table>${done.map(c=>`<tr><td class="mono xs">${c.num}</td><td class="sm">${esc(c.t)}</td><td><span class="bd ${c.st==='relatado'?'ok':''}">${c.st}</span></td></tr>`).join('')}</table></div></div>`;
  return h;
}
function vIp(c){
  const G=S.g,late=G.sem>c.due;
  let h=`<button class="btn sm sec" data-a="ipx" style="margin-bottom:10px">← Inquéritos</button>`;
  h+=`<div class="pn"><h3>Inquérito Policial nº ${c.num} <span>${c.st==='andamento'?'em andamento':c.st}</span></h3><div class="kv k4"><div><label>Natureza</label><b>${CR[c.tipo].n}</b></div><div><label>Gravidade</label><b>${c.g}/5</b></div><div><label>Instauração</label><b>${dateOf(c.open)}</b></div><div><label>Prazo</label><b class="${late?'er':''}">${dateOf(c.due)}</b></div></div><div class="pb"><div class="b">${esc(c.t)}</div><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span class="xs mu">Andamento</span><div class="bar" style="flex:1;height:8px"><div style="width:${c.prog}%;background:${c.prog>=75?'var(--ok)':'var(--pr)'}"></div></div><b class="mono sm">${f0(c.prog)}%</b></div>${c.preso?'<div style="margin-top:8px"><span class="bd ok">Investigado preso</span></div>':''}</div></div>`;
  if(c.st==='andamento'){
    h+=`<div class="pn"><h3>Equipe designada <span>${c.team.length}/3</span></h3><div class="pb">${G.team.map(a=>{const on=c.team.includes(a.id),busy=a.al&&a.al!=='c'+c.id;return `<button class="chk ${on?'on':''} ${busy?'busy':''}" data-a="ag" data-v="${a.id}"><span class="face" style="width:22px;height:22px">${face(a.nome,a.fem)}</span>${esc(a.nome.split(' ')[0])} · N${a.sk}</button>`}).join('')}<div class="xs mu">A equipe avança o inquérito semanalmente. Sem prisão do investigado, o andamento automático para em 92%.</div></div></div>`;
    h+=`<div class="pn"><h3>Diligências <span>${G.atos} ato(s) · ${money(G.orc)}</span></h3><div class="tw"><table>${Object.keys(DIL).map(k=>{const D=DIL[k],why=canDil(c,k);return `<tr><td><div class="b sm">${D.n}</div><div class="xs ${why?'mu2':'mu'}">${why||'Disponível'}</div></td><td class="n xs">${D.atos} ato${D.atos>1?'s':''}${D.cost?'<br>'+money(D.cost):''}</td><td><button class="btn sm sec" data-a="dil" data-v="${k}" ${why?'disabled':''}>Executar</button></td></tr>`}).join('')}</table></div></div>`;
  }
  h+=`<div class="pn"><h3>Andamento processual</h3><div class="tw"><table>${c.log.slice(0,10).map(l=>`<tr><td class="mono xs" style="white-space:nowrap">${dateOf(l.s)}</td><td class="sm">${esc(l.t)}</td></tr>`).join('')}</table></div></div>`;
  return h;
}
function vEfe(){
  const G=S.g;
  return `<div class="ttl"><div><h1>Efetivo</h1><div class="sub">${G.team.length} servidores lotados</div></div></div><div class="pn"><div class="tw"><table><tr><th>Servidor</th><th>Nível</th><th class="n">Moral</th><th>Alocação</th></tr>${G.team.map(a=>{const al=!a.al?'<span class="bd">Disponível</span>':a.al[0]==='p'?`<span class="bd pr">Ação estratégica</span>`:`<span class="bd ok">IP ${(caseOf(+a.al.slice(1))||{}).num||''}</span>`;return `<tr><td><div class="who"><span class="face">${face(a.nome,a.fem)}</span><div><div class="b sm">${esc(a.nome)}</div><div class="xs mu">${a.cargo} · Mat. ${a.mat}</div></div></div></td><td class="mono sm">N${a.sk}</td><td class="n ${a.mor<40?'er':''}">${f0(a.mor)}</td><td>${al}</td></tr>`}).join('')}</table></div></div>`;
}
function vCar(){
  const G=S.g;
  const stg=[['Delegado(a) de 3ª Classe','Delegacia no interior paulista','Reduzir furtos e violência doméstica'],['Delegado(a) Seccional','Centro de São Paulo','Reduzir furto e roubo de celular em 20%'],['Secretário(a) de Polícia Civil','Rio de Janeiro','Reduzir letalidade violenta e roubo de rua']];
  return `<div class="ttl"><div><h1>Carreira</h1><div class="sub">${esc(S.nome)} · matrícula ${S.mat}</div></div></div>
  <div class="pn"><h3>Trajetória</h3><div class="pb"><div class="tl">${stg.map((s,i)=>`<div class="${i<G.post?'d':i===G.post?'n':''}"><div class="b sm">${s[0]}</div><div class="xs mu">${s[1]} · ${s[2]}</div></div>`).join('')}</div></div></div>
  <div class="pn"><h3>Histórico funcional</h3><div class="tw"><table><tr><th>Unidade</th><th>Desde</th></tr>${G.posts.map(p=>`<tr><td class="sm">${esc(p.nome)}</td><td class="mono xs">${dateOf(p.from)}</td></tr>`).join('')}</table></div></div>
  <div class="pn"><div class="kv"><div><label>Inquéritos relatados</label><b>${G.solved}</b></div><div><label>Esclarecimento</label><b>${f0(esclar())}%</b></div><div><label>Licenças por esgotamento</label><b>${G.burn}</b></div><div><label>Integridade</label><b>${f0(G.integ)}/100</b></div></div></div>
  <div class="pn"><h3>Registro de atos</h3><div class="tw"><table>${G.news.slice(0,12).map(n=>`<tr><td class="mono xs" style="white-space:nowrap">${dateOf(n.s)}</td><td class="sm">${esc(n.t)}</td></tr>`).join('')}</table></div></div>`;
}
function vRel(){
  const G=S.g,B=G.rep,P=PC();
  let h=`<div class="ttl"><div><h1>Relatório semanal</h1><div class="sub">Semana ${B.sem} · consolidado em ${dateOf(G.sem)}</div></div></div>`;
  if(B.burn)h+=`<div class="alert er"><div><b>Licença médica</b>O(a) titular foi afastado(a) por esgotamento. Atos reduzidos nesta semana.</div></div>`;
  h+=`<div class="pn"><h3>Ocorrências</h3><div class="tw"><table><tr><th>Natureza</th><th class="n">Anterior</th><th class="n">Semana</th><th class="n">Var.</th></tr>${Object.keys(G.crimes).map(k=>{const a=B.before[k],v=crimeNow(k),d=a?v/a-1:0;return `<tr><td>${P.crimes[k].n}</td><td class="n">${f0(a)}</td><td class="n">${f0(v)}</td><td class="n ${d<-.01?'ok':d>.01?'er':''}">${pct(d)}</td></tr>`}).join('')}</table></div></div>`;
  h+=`<div class="pn"><h3>Metas</h3><div class="tw"><table><tr><th>Indicador</th><th class="n">Meta</th><th class="n">Atual</th><th></th><th>Status</th></tr>${metaRows()}</table></div></div>`;
  h+=`<div class="pn"><div class="kv"><div><label>Novos inquéritos</label><b>${B.newC.length}</b></div><div><label>Laudos e relatórios</label><b>${B.res.length}</b></div><div><label>Custo das ações</label><b>${money(B.cost)}</b></div><div><label>Novos documentos</label><b>${pendMemos().length}</b></div></div></div>`;
  return h;
}
function vAval(){
  const G=S.g,E=G.eval;
  let h=`<div class="ttl"><div><h1>Avaliação de desempenho</h1><div class="sub">${esc(G.P.unidade)}</div></div></div><div class="pn"><div class="tw"><table><tr><th>Meta</th><th class="n">Alvo</th><th class="n">Resultado</th><th>Situação</th></tr>${E.res.map(r=>`<tr><td class="b sm">${r.n}</td><td class="n">${r.venc?'≤ '+r.alvo:'−'+Math.round(r.alvo*100)+'%'}</td><td class="n ${r.ok?'ok':'er'}">${r.venc?r.atual:pct(-r.atual)}</td><td><span class="bd ${r.ok?'ok':'er'}">${r.ok?'Atingida':'Não atingida'}</span></td></tr>`).join('')}</table></div></div>`;
  const nx=['','Promoção e remoção para a 1ª Delegacia Seccional — Centro de São Paulo.','Convite do governador do Rio de Janeiro para assumir a Secretaria de Estado de Polícia Civil.',''];
  h+=E.ok?`<div class="alert ok" style="margin-top:12px"><div><b>Metas cumpridas</b>${G.post===2?'Missão cumprida no Rio de Janeiro.':nx[G.post+1]}</div></div>`:!E.ext?`<div class="alert" style="margin-top:12px"><div><b>Metas não atingidas</b>A chefia concedeu prorrogação de 12 semanas para recuperar os indicadores.</div></div>`:`<div class="alert er" style="margin-top:12px"><div><b>Metas não atingidas após prorrogação</b>${G.post===2?'O governador decide trocar o comando da Polícia Civil.':'Sua carreira fica estagnada nesta unidade.'}</div></div>`;
  return h;
}
function vFim(){
  const F=S.fim,T={win:['Missão cumprida','Os indicadores do Rio de Janeiro caíram sob o seu comando. Seu nome entra para a história da segurança pública.'],exon:['Demissão','A Corregedoria concluiu o processo disciplinar pela sua demissão.'],burn:['Aposentadoria precoce','Três licenças por esgotamento encerraram a carreira.'],estag:['Carreira estagnada','As metas não foram atingidas e você permanece na unidade sem novas promoções.'],exon_gov:['Exoneração do cargo','O governador troca o comando da Polícia Civil.']}[F.kind];
  return sysbar('Encerramento de sessão',dateOf(F.sem))+`<div class="wrap"><div class="pn"><h3>Resultado da carreira</h3><div class="pb"><div style="font-size:20px;font-weight:700">${T[0]}</div><p class="sm" style="color:var(--tx2);margin:6px 0 0">${T[1]}</p></div><div class="kv"><div><label>Pontuação</label><b class="pr">${F.score}</b></div><div><label>Estágio alcançado</label><b>${['Interior','São Paulo','Rio de Janeiro'][F.post]}</b></div><div><label>Inquéritos relatados</label><b>${F.solved}</b></div><div><label>Esclarecimento</label><b>${f0(F.esc)}%</b></div></div></div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn" data-a="new">Nova carreira</button><button class="btn sec" data-a="cover">Início</button></div></div>`;
}
function vCareer(){
  const G=S.g;
  if(UI.mod==='aval'&&G.eval)return carBar()+'<div class="wrap">'+vAval()+'</div>'+`<div class="foot"><div><div class="inf"></div><button class="btn" data-a="aval">${G.eval.ok?(G.post===2?'Encerrar':'Assumir nova função'):!G.eval.ext?'Continuar':'Encerrar'}</button></div></div>`;
  if(UI.mod==='rel'&&G.rep)return carBar()+mods()+'<div class="wrap">'+vRel()+'</div>'+`<div class="foot"><div><div class="inf">${pendMemos().length?`<b>${pendMemos().length}</b> documento(s) novo(s) no Expediente`:''}</div><button class="btn" data-a="relok">Ir para o painel</button></div></div>`;
  const body=UI.mod==='ind'?vInd():UI.mod==='plano'?vPlano():UI.mod==='exp'?vExp():UI.mod==='ips'?vIps():UI.mod==='efe'?vEfe():UI.mod==='car'?vCar():vPainel();
  return carBar()+mods()+'<div class="wrap">'+body+'</div>'+foot();
}
function render(){
  let h='';
  if(UI.screen==='cover')h=vCover();else if(UI.screen==='setup')h=vSetup();
  else switch(S.phase){
    case 'estudo':h=vEstudo();break;case 'objetiva':h=vObj();break;case 'objres':h=vObjRes();break;case 'disc':h=vDisc();break;
    case 'taf':h=vTaf();break;case 'oral':h=vOral();break;case 'resultado':h=vResultado();break;case 'acad':h=vAcad();break;case 'lot':h=vLot();break;
    case 'car':h=vCareer();break;case 'fim':h=vFim();break;
  }
  if(UI.toast)h+=`<div class="toast">${esc(UI.toast)}</div>`;
  $.innerHTML=h;
}
setInterval(()=>{
  if(!S)return;let dl,tot;
  if(S.phase==='objetiva'&&!S.ex.shown){dl=S.ex.dl;tot=45000}else if(S.phase==='disc'&&!S.disc.res){dl=S.disc.dl;tot=360000}else return;
  const left=Math.max(0,dl-Date.now()),t=document.getElementById('tt'),b=document.getElementById('tb'),x=document.getElementById('tx');
  if(t)t.textContent=fmtT(left);if(b)b.style.width=(left/tot*100)+'%';if(x)x.classList.toggle('low',left<(tot>60000?60000:10000));
  if(left<=0){if(S.phase==='objetiva'){S.ex.ans[S.ex.i]=-1;S.ex.shown=true}else{S.disc.res=gradeDisc(UI.ans);S.notas.disc=S.disc.res.s}save();render()}
},250);

function act(a,v){
  switch(a){
    case 'new':UI.screen='setup';UI.setup.nome='';render();top();break;
    case 'cover':UI.screen='cover';render();top();break;
    case 'continue':S=load();if(S){UI.screen='game';UI.mod='painel';render()}break;
    case 'sx':UI.setup.sexo=v;render();break;
    case 'fd':UI.setup.fundo=v;render();break;
    case 'inscr':{const n=(UI.setup.nome||'').trim();if(n.length<3)return toast('Informe o nome completo.');newStudy(n,UI.setup.fundo,UI.setup.sexo);UI.screen='game';save();render();top();break}
    case 'al':{const [id,d]=v.split(':'),C=S.c;C.alloc[id]=clamp((C.alloc[id]||0)+(+d),0,C.blocos);if(usedB()>C.blocos)C.alloc[id]--;save();render();break}
    case 'sev':{const C=S.c,e=STEV.find(x=>x.id===C.ev);C.log.unshift(`${e.t}: ${e.o[+v].f(C)}`);C.ev=null;save();render();break}
    case 'mes':studyMonth();break;
    case 'qa':if(!S.ex.shown){S.ex.ans[S.ex.i]=+v;S.ex.shown=true;save();render()}break;
    case 'qn':{const E=S.ex;E.i++;E.shown=false;E.dl=Date.now()+45000;if(E.i>=E.qs.length)finishObj();save();render();top();break}
    case 'todisc':S.phase='disc';S.disc={dl:Date.now()+360000};UI.ans='';save();render();top();break;
    case 'discok':S.disc.res=gradeDisc(UI.ans);S.notas.disc=S.disc.res.s;save();render();top();break;
    case 'totaf':runTAF();save();render();top();break;
    case 'tafn':S.taf.i++;save();render();break;
    case 'tooral':S.phase='oral';S.oral={qs:shuffle(ORAL).slice(0,3),i:0,ans:[],ord:shuffle([0,1,2])};save();render();top();break;
    case 'or':{const O=S.oral;O.ans.push(O.qs[O.i].o[+v][1]);O.i++;O.ord=shuffle([0,1,2]);if(O.i>=O.qs.length)finishOral();save();render();top();break}
    case 'retry':{const C=S.c;C.mes=1;C.meses=6;C.tent++;C.en=Math.max(C.en,70);C.log.unshift(`Novo edital publicado. Tentativa ${C.tent}.`);S.phase='estudo';autoAlloc();delete S.ex;delete S.notas;save();render();top();break}
    case 'toacad':S.phase='acad';save();render();top();break;
    case 'ac':S.bonus={inv:v==='inv'?.12:0,int:v==='int'?.08:0,ges:v==='ges'?.1:0};S.phase='lot';save();render();top();break;
    case 'lot':startPost(0,S.lotOpts[+v]);break;
    case 'mod':UI.mod=v;UI.ip=null;UI.memo=null;UI.sel=null;render();top();break;
    case 'ip':UI.ip=+v;render();top();break;
    case 'ipx':UI.ip=null;render();break;
    case 'ag':toggleAgent(UI.ip,v);break;
    case 'dil':doDil(UI.ip,v);break;
    case 'gest':doGest(v);break;
    case 'pol':togglePol(v);break;
    case 'memo':UI.memo=+v;UI.sel=null;render();top();break;
    case 'memox':UI.memo=null;render();break;
    case 'osel':UI.sel=+v;render();break;
    case 'assina':if(UI.sel!==null)despachar(UI.memo,UI.sel);break;
    case 'week':endWeek();break;
    case 'relok':S.g.rep=null;UI.mod=pendMemos().length?'exp':'painel';save();render();top();break;
    case 'aval':afterEval();break;
  }
}
$.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b.dataset.v)});
$.addEventListener('input',e=>{if(e.target.id==='nm')UI.setup.nome=e.target.value;if(e.target.id==='ans')UI.ans=e.target.value});
window.__dist={get S(){return S},UI,act,QB,POL,POSTS};
render();
})();
</script>
