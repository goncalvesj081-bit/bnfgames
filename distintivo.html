<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090C11">
<meta name="description" content="Distintivo - passe no concurso de delegado, assuma uma delegacia no interior e construa sua carreira até a chefia da Polícia Civil. Grátis.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Distintivo</title>
<link rel="icon" href="./bnf-favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090C11;--s1:#10141B;--s2:#151A23;--s3:#1C2330;--b1:#1E2531;--b2:#2A3342;
  --tx:#E9EDF3;--tx2:#C5CCD8;--mu:#8B95A7;--mu2:#5E687A;
  --ac:#F2A93B;--ac2:rgba(242,169,59,.12);--blue:#4C8DFF;--blue2:rgba(76,141,255,.12);--red:#F0524F;--red2:rgba(240,82,79,.12);--grn:#2FBF71;--grn2:rgba(47,191,113,.12);
  --disp:'Archivo',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.45}
body{overscroll-behavior:none;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:disabled{cursor:not-allowed;opacity:.38}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}

/* tipografia */
.d{font-family:var(--disp);font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.02}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.mono{font-family:var(--mono)}
.mu{color:var(--mu)} .mu2{color:var(--mu2)} .ac{color:var(--ac)} .red{color:var(--red)} .grn{color:var(--grn)} .blue{color:var(--blue)}
.sm{font-size:13px} .xs{font-size:11.5px}

/* barra superior */
.top{position:sticky;top:0;z-index:30;background:rgba(9,12,17,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--b1)}
.top .row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{display:flex;align-items:center;gap:9px}
.logo b{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:15px;letter-spacing:.06em}
.chipd{font-family:var(--mono);font-size:11px;color:var(--tx2);background:var(--s2);border:1px solid var(--b1);padding:5px 9px;border-radius:999px;white-space:nowrap}
.sub{display:flex;gap:8px;align-items:center;padding:0 16px 11px;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden}
.sub b{color:var(--tx2);font-weight:600}
.sub i{width:3px;height:3px;border-radius:50%;background:var(--mu2);flex-shrink:0}

.scr{padding:16px 16px 140px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 12px}
.sec h2{margin:0;font-family:var(--disp);font-stretch:125%;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.sec span{font-size:12px;color:var(--mu)}

/* hero */
.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--b1);background:#0B1020}
.hero svg{display:block;width:100%;height:auto}
.hero .ov{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 14px;background:linear-gradient(180deg,rgba(9,12,17,0),rgba(9,12,17,.55) 40%,rgba(9,12,17,.94) 100%)}
.hero .ov .d{font-size:clamp(20px,6vw,27px)}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--s3);color:var(--tx2);border:1px solid var(--b2)}
.tag.ac{background:var(--ac2);color:var(--ac);border-color:rgba(242,169,59,.3)}
.tag.red{background:var(--red2);color:var(--red);border-color:rgba(240,82,79,.3)}
.tag.grn{background:var(--grn2);color:var(--grn);border-color:rgba(47,191,113,.3)}
.tag.blue{background:var(--blue2);color:var(--blue);border-color:rgba(76,141,255,.3)}

/* cartões */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:18px;padding:16px}
.card+.card{margin-top:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:14px}
.kpi .v{font-family:var(--disp);font-stretch:112%;font-weight:800;font-size:28px;line-height:1;margin-top:8px}
.kpi .v small{font-size:14px;color:var(--mu);font-weight:700}
.kpi .s{font-size:12px;color:var(--mu);margin-top:6px}
.meter{height:6px;border-radius:99px;background:var(--s3);overflow:hidden;margin-top:10px}
.meter>div{height:100%;border-radius:99px;background:var(--ac);transition:width .4s}

/* evento */
.desk{border:1px solid rgba(242,169,59,.45);background:linear-gradient(180deg,rgba(242,169,59,.08),var(--s1) 40%);border-radius:20px;padding:18px}
.desk h3{margin:8px 0 8px;font-family:var(--disp);font-stretch:112%;font-weight:800;font-size:21px;line-height:1.12}
.desk p{margin:0 0 14px;color:var(--tx2);font-size:14.5px;line-height:1.55}
.choice{display:block;width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:14px;padding:13px 14px;margin-top:8px}
.choice b{display:block;font-size:14.5px;font-weight:600}
.choice span{display:block;font-size:12.5px;color:var(--mu);margin-top:3px}
.choice:not(:disabled):active{background:var(--s3)}
.choice.on{border-color:var(--ac);background:var(--ac2)}

/* casos */
.case{display:block;width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:14px 14px 14px 18px;position:relative;overflow:hidden}
.case+.case{margin-top:8px}
.case::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gc,var(--mu2))}
.case .t{font-weight:600;font-size:15px;line-height:1.3}
.case .m{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:12px;color:var(--mu)}
.case .meter{height:5px;margin-top:11px}
.case .row{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:12px}
.g1{--gc:#5E687A}.g2{--gc:#4C8DFF}.g3{--gc:#F2A93B}.g4{--gc:#F07B3F}.g5{--gc:#F0524F}

/* ações */
.act{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:16px;padding:12px 14px}
.act+.act{margin-top:8px}
.act .ic{width:40px;height:40px;border-radius:12px;background:var(--s3);display:flex;align-items:center;justify-content:center;color:var(--ac)}
.act b{display:block;font-size:14.5px;font-weight:600}
.act span{display:block;font-size:12.5px;color:var(--mu);margin-top:2px;line-height:1.35}
.act .c{font-family:var(--mono);font-size:11px;color:var(--ac);text-align:right;white-space:nowrap}
.act:not(:disabled):active{background:var(--s2)}

/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:14px;background:var(--ac);color:#1A1205;font-family:var(--disp);font-stretch:118%;font-weight:800;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.btn.gh{background:var(--s2);color:var(--tx);border:1px solid var(--b2)}
.btn.sm2{height:44px;font-size:13px}
.btn+.btn{margin-top:10px}
.fab{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));z-index:25;padding:14px 16px 10px;background:linear-gradient(180deg,rgba(9,12,17,0),rgba(9,12,17,.96) 40%)}
.fab>div{max-width:488px;margin:0 auto}
.fab.nobar{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,17,23,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--b1);padding-bottom:env(safe-area-inset-bottom)}
.tabs>div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;color:var(--mu2);font-size:10.5px;font-weight:600;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ac)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--ac)}
.tab .bd{position:absolute;top:6px;left:56%;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* equipe */
.agent{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center}
.agent+.agent{margin-top:14px;padding-top:14px;border-top:1px solid var(--b1)}
.face{width:52px;height:52px;border-radius:14px;overflow:hidden;background:var(--s3)}
.face svg{display:block;width:100%;height:100%}
.stars{font-size:12px;letter-spacing:2px;color:var(--ac)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pk{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--s2);border:1px solid var(--b2);font-size:13px}
.pk .face{width:28px;height:28px;border-radius:50%}
.pk.on{border-color:var(--ac);background:var(--ac2);color:var(--ac)}
.pk.busy{opacity:.55}

/* barras de relação */
.rel{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.rel+.rel{margin-top:12px}
.rel .meter{margin:0}
.rel b{font-family:var(--mono);font-size:12px;text-align:right}

/* listas */
.news{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13.5px;line-height:1.45}
.news+.news{margin-top:12px;padding-top:12px;border-top:1px solid var(--b1)}
.news .k{padding-top:2px}

/* concurso */
.steps{display:flex;gap:4px;padding:0 16px 12px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--s3)}
.steps i.on{background:var(--ac)} .steps i.done{background:rgba(242,169,59,.45)}
.alloc{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0}
.alloc+.alloc{border-top:1px solid var(--b1)}
.alloc b{font-size:14.5px;font-weight:600}
.alloc .sub2{font-size:12px;color:var(--mu);margin-top:2px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:10px;background:var(--s3);border:1px solid var(--b2);font-size:18px;font-weight:600;text-align:center}
.step .n{width:24px;text-align:center;font-family:var(--disp);font-weight:800;font-size:18px}
.know{display:grid;grid-template-columns:110px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.know+.know{margin-top:10px}
.know .meter{margin:0}
.q{font-size:17px;line-height:1.45;font-weight:600;margin:6px 0 16px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:13px 14px;font-size:14.5px;line-height:1.4}
.opt+.opt{margin-top:8px}
.opt .L{width:30px;height:30px;border-radius:9px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:14px}
.opt.ok{border-color:var(--grn);background:var(--grn2)} .opt.ok .L{background:var(--grn);color:#04150B}
.opt.bad{border-color:var(--red);background:var(--red2)} .opt.bad .L{background:var(--red);color:#fff}
.timer{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.timer b{font-family:var(--mono);font-size:22px;font-weight:600;min-width:62px}
.timer .meter{flex:1;margin:0}
.timer.low b{color:var(--red)} .timer.low .meter>div{background:var(--red)}
textarea{width:100%;min-height:220px;resize:vertical;background:#06080C;border:1px solid var(--b2);border-radius:14px;padding:14px;font-size:15px;line-height:1.55}
textarea:focus,input:focus{outline:none;border-color:var(--ac)}
input.inp{width:100%;height:50px;background:var(--s1);border:1px solid var(--b2);border-radius:14px;padding:0 14px;font-size:16px}
.big{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:64px;line-height:.9}
.score{display:flex;align-items:baseline;gap:8px}
.fb{margin:12px 0 0;padding:0;list-style:none}
.fb li{position:relative;padding-left:18px;font-size:14px;line-height:1.5;color:var(--tx2)}
.fb li+li{margin-top:6px}
.fb li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.taf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:14px 0}
.taf+.taf{border-top:1px solid var(--b1)}
.ladder{position:relative;padding-left:26px}
.ladder::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--b2)}
.rung{position:relative;padding:8px 0}
.rung::before{content:"";position:absolute;left:-23px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--s3);border:2px solid var(--b2)}
.rung.done::before{background:var(--ac);border-color:var(--ac)}
.rung.now::before{background:var(--bg);border-color:var(--ac);box-shadow:0 0 0 4px var(--ac2)}
.rung b{font-size:14.5px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:60;background:var(--s3);border:1px solid var(--b2);border-radius:12px;padding:10px 14px;font-size:13.5px;max-width:88vw;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mu);margin-bottom:12px}
.cover{min-height:100vh;display:flex;flex-direction:column;padding:0 0 30px}
.cover .hero{border-radius:0;border:0}
.cover .in{padding:0 20px;margin-top:-6px}
.feat{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.feat+.feat{margin-top:14px}
.feat .ic{width:36px;height:36px;border-radius:10px;background:var(--ac2);color:var(--ac);display:flex;align-items:center;justify-content:center}
.feat b{display:block;font-size:14.5px}
.feat span{display:block;font-size:13px;color:var(--mu);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.optc{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:12px;text-align:left}
.optc b{display:block;font-size:14px}
.optc span{display:block;font-size:12px;color:var(--mu);margin-top:3px;line-height:1.35}
.optc.on{border-color:var(--ac);background:var(--ac2)}
.dl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:9px 0}
.dl+.dl{border-top:1px solid var(--b1)}
.dl b{font-family:var(--mono);font-weight:500}
@keyframes sir{0%,100%{opacity:.25}50%{opacity:.95}}
.sirR{animation:sir 1.1s infinite}.sirB{animation:sir 1.1s .55s infinite}
@media (prefers-reduced-motion:reduce){.sirR,.sirB{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================================================================
   DISTINTIVO — carreira de delegado de polícia (BNF Games)
   Cidades, pessoas e casos são fictícios.
================================================================= */
(function(){
'use strict';
const $=document.getElementById('app');
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f0=x=>Math.round(x).toString();
const f1=x=>(Math.round(x*10)/10).toFixed(1).replace('.',',');
const money=x=>'R$ '+(Math.round(x*10)/10).toFixed(1).replace('.',',')+' mil';
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const KEY='distintivo_v1',BEST='distintivo_best';
const store={mem:{},set(k,v){try{localStorage.setItem(k,v)}catch(e){this.mem[k]=v}},get(k){try{const r=localStorage.getItem(k);return r===null?(this.mem[k]||null):r}catch(e){return this.mem[k]||null}}};
let S=null;
let UI={screen:'cover',tab:'del',caso:null,setup:{nome:'',fundo:'rec',sexo:'f'},ans:'',toast:null};
function save(){if(S)store.set(KEY,JSON.stringify(S))}
function load(){try{const r=store.get(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function toast(t){UI.toast=t;render();clearTimeout(toast.h);toast.h=setTimeout(()=>{UI.toast=null;render()},2300)}
const top=()=>window.scrollTo(0,0);

/* ---------- ícones ---------- */
const IC={
  badge:'<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2l2.4 4.2 4.8.9-3.3 3.6.6 4.9L12 13.6 7.5 15.6l.6-4.9L4.8 7.1l4.8-.9z" fill="#F2A93B"/><path d="M6 15.5c1.8 2.6 3.8 4.6 6 6.5 2.2-1.9 4.2-3.9 6-6.5" fill="none" stroke="#F2A93B" stroke-width="1.6" stroke-linecap="round"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6M12 9.5v.01"/></svg>',
  casos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M8 13h8M8 16h5"/></svg>',
  equipe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.3c2.3 0 4 1.5 4.5 4.2"/></svg>',
  cidade:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  carreira:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5L7 21l5-2.5 5 2.5-1.5-7.5"/></svg>',
  ear:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 9a5 5 0 0110 0c0 3-3 3.5-3 6.5a2.5 2.5 0 01-5 0"/><path d="M10 9.5a2 2 0 014 0"/></svg>',
  lab:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 001.3 2h11.4A1.5 1.5 0 0019 19l-5-10V3"/><path d="M7.5 15h9"/></svg>',

/* ---------- ilustração: cidade à noite ---------- */
function rng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
function skyline(porte,seed,h){
  h=h||220;const W=400,r=rng(seed||7),G=h-34;
  let s=`<svg viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <linearGradient id="sk${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset=".6" stop-color="#121A33"/><stop offset="1" stop-color="#2A2440"/></linearGradient>
  <radialGradient id="gr${seed}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F0524F" stop-opacity=".9"/><stop offset="1" stop-color="#F0524F" stop-opacity="0"/></radialGradient>
  <radialGradient id="gb${seed}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4C8DFF" stop-opacity=".9"/><stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="mn${seed}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF6DA" stop-opacity=".35"/><stop offset="1" stop-color="#FFF6DA" stop-opacity="0"/></radialGradient></defs>
  <rect width="${W}" height="${h}" fill="url(#sk${seed})"/>`;
  for(let i=0;i<34;i++)s+=`<circle cx="${(r()*W).toFixed(1)}" cy="${(r()*G*.55).toFixed(1)}" r="${(r()*.9+.2).toFixed(2)}" fill="#fff" opacity="${(r()*.6+.2).toFixed(2)}"/>`;
  const mx=60+r()*280;s+=`<circle cx="${mx}" cy="${30+r()*20}" r="40" fill="url(#mn${seed})"/><circle cx="${mx}" cy="${30+r()*0+40-10}" r="11" fill="#F4EBD0" opacity=".9"/>`;
  const layer=(col,minH,maxH,minW,maxW,winP)=>{let x=-10,o='';while(x<W+10){const w=minW+r()*(maxW-minW),bh=minH+r()*(maxH-minH),y=G-bh;
      o+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>`;
      if(winP>0)for(let wy=y+6;wy<G-6;wy+=9)for(let wx=x+4;wx<x+w-5;wx+=7)if(r()<winP)o+=`<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="3" height="4" fill="${r()<.85?'#F2C46B':'#9CC3FF'}" opacity="${(r()*.5+.45).toFixed(2)}"/>`;
      x+=w+(r()<.3?r()*6:0)}return o};
  if(porte<=1){
    s+=`<path d="M0 ${G-28} Q60 ${G-58} 130 ${G-34} T260 ${G-40} T400 ${G-30} V${G} H0Z" fill="#0F1529"/>`;
    s+=layer('#0B1020',10,26,24,40,.12);
    const cx=150+r()*100;s+=`<rect x="${cx}" y="${G-70}" width="18" height="70" fill="#0B1020"/><path d="M${cx-2} ${G-70} L${cx+9} ${G-92} L${cx+20} ${G-70}Z" fill="#0B1020"/><rect x="${cx+7}" y="${G-104}" width="4" height="14" fill="#0B1020"/><rect x="${cx+3}" y="${G-100}" width="12" height="3" fill="#0B1020"/><circle cx="${cx+9}" cy="${G-55}" r="3.4" fill="#F2C46B" opacity=".8"/>`;
  }else if(porte===2){s+=layer('#111833',30,70,20,40,0);s+=layer('#0A0F1E',16,52,18,36,.16)}
  else if(porte===3){s+=layer('#121A36',50,110,18,34,.05);s+=layer('#0A0F1E',24,80,16,32,.2)}
  else{s+=layer('#131C3A',80,150,16,30,.05);s+=layer('#0A0F1E',36,118,14,28,.22);const tx=40+r()*300;s+=`<rect x="${tx}" y="${G-170}" width="26" height="170" fill="#0A0F1E"/><rect x="${tx+12}" y="${G-188}" width="2" height="18" fill="#0A0F1E"/><circle cx="${tx+13}" cy="${G-188}" r="2" fill="#F0524F"/>`}
  // delegacia em primeiro plano
  const dx=W-150;s+=`<rect x="0" y="${G}" width="${W}" height="${h-G}" fill="#06080F"/><rect x="0" y="${G+12}" width="${W}" height="2" fill="#1A2238"/>`;
  s+=`<rect x="${dx}" y="${G-46}" width="122" height="46" fill="#0E1426" stroke="#1E2A48"/><rect x="${dx-4}" y="${G-50}" width="130" height="6" fill="#141C34"/><rect x="${dx+30}" y="${G-44}" width="62" height="10" rx="1" fill="#16213F"/><text x="${dx+61}" y="${G-36.5}" font-family="Archivo,sans-serif" font-size="6.2" font-weight="800" fill="#F2A93B" text-anchor="middle" letter-spacing=".6">DELEGACIA</text>`;
  for(let i=0;i<5;i++)s+=`<rect x="${dx+10+i*22}" y="${G-28}" width="12" height="9" fill="#F2C46B" opacity="${i===2?0:.55}"/>`;
  s+=`<rect x="${dx+54}" y="${G-22}" width="14" height="22" fill="#1A2440"/>`;
  // viatura
  const vx=dx-78;s+=`<ellipse cx="${vx+26}" cy="${G+6}" rx="60" ry="22" fill="url(#gr${seed})" class="sirR"/><ellipse cx="${vx+34}" cy="${G+6}" rx="60" ry="22" fill="url(#gb${seed})" class="sirB"/>`;
  s+=`<path d="M${vx} ${G+8} L${vx+4} ${G-2} L${vx+16} ${G-4} L${vx+24} ${G-12} L${vx+44} ${G-12} L${vx+52} ${G-4} L${vx+60} ${G-2} L${vx+62} ${G+8}Z" fill="#E9EDF3"/><rect x="${vx+3}" y="${G+1}" width="58" height="3" fill="#1F2D52"/><rect x="${vx+29}" y="${G-15}" width="5" height="3" fill="#F0524F" class="sirR"/><rect x="${vx+34}" y="${G-15}" width="5" height="3" fill="#4C8DFF" class="sirB"/><circle cx="${vx+14}" cy="${G+8}" r="5" fill="#0A0D14"/><circle cx="${vx+48}" cy="${G+8}" r="5" fill="#0A0D14"/>`;
  return s+'</svg>';
}

function gradeDisc(t){

    case 'cameras':{const ok=Math.random()<.7;const g=ok?R(14,22)*inv:4;cs.prog=clamp(cs.prog+g,0,100);msg=ok?`As imagens mostram o suspeito: +${f0(g)}%.`:'Imagens ruins, quase nada aproveitável.';break}
    case 'pericia':{G.pend.push({at:G.sem+2,id,g:R(18,26)*(1+G.estr/200),t:'Laudo pericial'});msg='Perícia requisitada. Laudo em 2 semanas.';break}
    case 'quebra':{const ch=.42+G.relJud/250+(B.int||0);if(Math.random()<ch){const g=R(20,30)*inv;cs.prog=clamp(cs.prog+g,0,100);msg=`Juiz deferiu a quebra de sigilo: +${f0(g)}%.`;G.relJud=clamp(G.relJud+1,0,100)}else{msg='Juiz indeferiu: fundamentação insuficiente.';G.relJud=clamp(G.relJud-2,0,100)}break}
    case 'intercep':{const ch=.4+G.relJud/250+(B.int||0);if(Math.random()<ch){G.pend.push({at:G.sem+2,id,g:R(30,42)*(1+(B.int||0)),t:'Relatório de interceptação'});msg='Interceptação autorizada. Resultados em 2 semanas.'}else{msg='Interceptação negada pelo juiz.';G.relJud=clamp(G.relJud-2,0,100)}break}
    case 'busca':{const ch=clamp(.3+cs.prog/200+cs.team.length*.06+(B.ges||0)/2,.2,.92);
      if(Math.random()<ch){cs.preso=true;const g=R(18,28);cs.prog=clamp(cs.prog+g,0,100);G.imp=clamp(G.imp+cs.g,0,100);G.sens=clamp(G.sens+cs.g*.6,0,100);msg=`Operação bem-sucedida: suspeito preso. +${f0(g)}%.`;if(cs.g>=3)nlog(`Polícia Civil prende suspeito de ${CR[cs.tipo].n.toLowerCase()} no ${cs.b}.`)}
      else{cs.prog=clamp(cs.prog-10,0,100);msg='O suspeito não estava no endereço. Investigação recua.';if(Math.random()<.15){G.ev='confronto';G.evCase=id}}break}
    case 'relatar':{const ch=clamp(.45+(cs.prog-75)/45+G.relMP/400,.3,.97);
      if(Math.random()<ch)solveCase(cs);
      else{cs.prog=65;G.relMP=clamp(G.relMP-2,0,100);msg='O promotor devolveu os autos pedindo novas diligências.'}
      break}
    case 'arquivar':{cs.st='arquivado';G.arch++;releaseTeam(cs);if(cs.g>=4){G.imp=clamp(G.imp-5,0,100);G.sens=clamp(G.sens-3,0,100);nlog(`Sem solução: ${cs.t.toLowerCase()} é encerrado sem autoria definida.`)}msg='Inquérito relatado sem autoria.';break}
  }
  if(msg)cs.log.unshift({s:G.sem,t:msg});
  save();render();if(msg)toast(msg);
}
function solveCase(cs){
  const G=S.g;cs.st='resolvido';G.solved++;G.solvedHere++;releaseTeam(cs);
  const ontime=G.sem<=cs.due;const pts=cs.g*3+(ontime?2:0)+(cs.preso?1:0);G.merito+=pts;
  G.sens=clamp(G.sens+cs.g*.9,0,100);G.relMP=clamp(G.relMP+1.5,0,100);if(cs.g>=4){G.imp=clamp(G.imp+4,0,100);nlog(`Caso resolvido: ${cs.t}. Inquérito relatado ao Ministério Público.`)}
  cs.log.unshift({s:G.sem,t:`Inquérito relatado e aceito pelo MP. +${pts} de mérito.`});
  cs.team.forEach(id=>{const a=agentOf(id);if(a)a.mor=clamp(a.mor+5,0,100)});
}
function releaseTeam(cs){cs.team.forEach(id=>{const a=agentOf(id);if(a&&a.caso===cs.id)a.caso=null});cs.team=[]}
function toggleAgent(cid,aid){
  const cs=caseById(cid),a=agentOf(aid);if(!cs||!a)return;
  if(cs.team.includes(aid)){cs.team=cs.team.filter(x=>x!==aid);a.caso=null}
  else{if(cs.team.length>=3)return toast('Máximo de 3 policiais por caso.');if(a.caso){const o=caseById(a.caso);if(o)o.team=o.team.filter(x=>x!==aid)}a.caso=cid;cs.team.push(aid)}
  save();render();
}

function doGest(k){
  const G=S.g,A=GEST[k];if(G.atos<A.atos)return toast('Sem atos nesta semana.');if(A.cost>G.orc)return toast('Orçamento insuficiente.');

    case 'imprensa':{const rec=G.cases.filter(c=>c.st==='resolvido'&&G.sem-c.open<8).length;if(rec>0||Math.random()<.4){G.imp=clamp(G.imp+5,0,100);G.sens=clamp(G.sens+2,0,100);m='Coletiva bem recebida.'}else{G.imp=clamp(G.imp-5,0,100);m='Sem resultados para mostrar, a coletiva pegou mal.'}break}
    case 'conseg':G.relPref=clamp(G.relPref+6,0,100);G.sens=clamp(G.sens+3,0,100);m='Reunião produtiva com a comunidade.';break;
    case 'folga':G.stress=clamp(G.stress-22,0,100);m='Fim de semana longe da delegacia.';break;
  }
  save();render();toast(m);
}

function endWeek(){
  const G=S.g;if(G.ev)return toast('Resolva o que está na sua mesa.');
  const B={sem:G.sem,newC:[],solvedAuto:[],adv:[],late:[],res:[],promo:null,before:{sens:G.sens,stress:G.stress,imp:G.imp}};
  // resultados pendentes
  G.pend=G.pend.filter(p=>{if(G.sem+1>=p.at){const cs=caseById(p.id);if(cs&&cs.st==='aberto'){cs.prog=clamp(cs.prog+p.g,0,100);cs.log.unshift({s:G.sem+1,t:`${p.t} chegou: +${f0(p.g)}%.`});B.res.push(`${p.t}: ${cs.t} (+${f0(p.g)}%)`)}return false}return true});
  // trabalho da equipe
  openCases().forEach(cs=>{if(!cs.team.length)return;let g=0;cs.team.forEach(id=>{const a=agentOf(id);if(a)g+=(5+a.sk*3)*(.5+a.mor/200)});g=g*(.75+G.estr/200)*(1+(G.bonus.inv||0))/cs.d;if(G.afast)g*=1.2;cs.prog=clamp(cs.prog+g,0,cs.preso?100:92);if(g>0)B.adv.push([cs,g])});
  // atrasos
  let late=0;openCases().forEach(cs=>{if(G.sem>cs.due){late++;G.sens=clamp(G.sens-cs.g*.25,0,100);G.relMP=clamp(G.relMP-.4,0,100);if(!cs.lateNoted&&cs.g>=4){cs.lateNoted=1;G.imp=clamp(G.imp-4,0,100);nlog(`Família cobra respostas: ${cs.t.toLowerCase()} segue sem solução.`)}B.late.push(cs)}});
  // equipe e delegado
  const load=openCases().length/Math.max(1,G.team.length);
  G.team.forEach(a=>{a.mor=clamp(a.mor+(load>2.2?-2:load<1.2?1:0)+R(-1,1),0,100)});
  const used=G.afast?0:4-G.atos;G.stress=clamp(G.stress+used*.9+Math.min(late,6)*.45+(load>2.5?1.2:0)-3,0,100);
  G.sens=clamp(G.sens+(50-G.sens)*.04,0,100);G.imp=clamp(G.imp+(50-G.imp)*.03,0,100);
  // novos casos
  const nNew=[0,1,2,2,2][G.porte]+(Math.random()<[0,.45,.55,.8,.6][G.porte]?1:0)+(G.porte>=3&&Math.random()<.3?1:0);
  for(let i=0;i<nNew;i++){const cs=newCase(false);B.newC.push(cs);if(cs.g>=4){G.sens=clamp(G.sens-cs.g*.5,0,100);nlog(`${cs.t}. A Polícia Civil investiga.`)}}
  // mês
  G.sem++;G.wClass++;G.wPorte++;
  if(G.sem%4===0){G.orc+=budget(G.porte);B.orc=budget(G.porte)}
  // burnout
  if(G.stress>=100){G.burn++;G.afast=2;G.stress=55;G.merito=Math.max(0,G.merito-6);nlog('Delegado(a) é afastado(a) por esgotamento. Equipe segue sem comando por duas semanas.');B.burn=true;if(G.burn>=3){endGame('burn');return}}
  G.atos=G.afast>0?0:4;if(G.afast>0)G.afast--;G.did={};
  // promoção
  const nx=G.classe+1;
  if(nx<CLASSES.length&&G.wClass>=PROMO[nx].w&&G.merito>=PROMO[nx].m){G.classe=nx;G.wClass=0;B.promo=CLASSES[nx];G.promo={classe:nx,offers:offersFor(G.porte)};nlog(`${S.nome} é ${S.sexo==='f'?'promovida':'promovido'} a Delegado(a) de ${CLASSES[nx]}.`)}
  // corregedoria
  if(G.integ<38&&!G.padDone&&Math.random()<.35){G.ev='pad';G.padDone=true}
  else if(!G.ev&&Math.random()<.5){const pool=EV.filter(e=>!G.usedEv.includes(e.id)&&(!e.cond||e.cond(G)));if(pool.length){const e=pick(pool);G.ev=e.id;G.usedEv.push(e.id);if(G.usedEv.length>10)G.usedEv.shift()}}
  G.evRes=null;
  G.hist.push({sem:G.sem,sens:G.sens,stress:G.stress,esc:esclar()});
  // Delegado-Geral
  if(G.porte===4&&G.classe===3&&G.wPorte>=16&&G.imp>=58&&G.integ>=70&&esclar()>=55){endGame('geral');return}
  if(G.sem>=520){endGame('apos');return}
  G.boletim=B;UI.view='boletim';save();render();top();
}
function offersFor(porte){if(porte>=4)return [];const list=shuffle(CITIES[porte+1]).slice(0,porte+1>=4?3:2);return list}
function acceptOffer(i){
  const G=S.g,o=G.promo.offers[i];G.promo=null;startCareer(o,G.porte+1);
}
function endGame(kind){
  const G=S.g;S.fim={kind,sem:G.sem,classe:G.classe,porte:G.porte,solved:G.solved,esc:esclar(),posts:G.posts.length};
  const score=Math.round(G.solved*2+esclar()*.6+G.classe*25+G.porte*15+(kind==='geral'?100:0)-(kind==='exon'?60:0));
  S.fim.score=score;const b=+store.get(BEST)||0;if(score>b)store.set(BEST,String(score));
  S.phase='fim';save();render();top();
}

  h+=Object.keys(GEST).map(k=>{const A=GEST[k],dis=G.atos<A.atos||A.cost>G.orc||(G.did&&G.did[k]);return `<button class="act" data-a="gest" data-v="${k}" ${dis?'disabled':''}><div class="ic">${IC[A.ic]}</div><div><b>${A.n}</b><span>${A.d}</span></div><div class="c">${A.atos} ato${A.atos>1?'s':''}${A.cost?`<br>${money(A.cost)}`:''}</div></button>`}).join('');
  h+=`<div class="fab"><div><button class="btn" data-a="week" ${G.ev?'disabled':''}>${G.ev?'Resolva o que está na mesa':'Encerrar a semana'}</button></div></div>`;
  return h;
}
function vCasos(){
  const G=S.g,oc=openCases().sort((a,b)=>(a.due-G.sem)-(b.due-G.sem)||b.g-a.g),done=G.cases.filter(c=>c.st!=='aberto').slice(-8).reverse();
  let h=`<div class="sec" style="margin-top:4px"><h2>Inquéritos em aberto</h2><span>${oc.length}</span></div>`;
  h+=oc.map(caseRow).join('')||'<div class="card sm mu">Nenhum inquérito em aberto.</div>';
  if(done.length)h+=`<div class="sec"><h2>Encerrados</h2></div><div class="card">${done.map(c=>`<div class="news"><span class="tag ${c.st==='resolvido'?'grn':''}" style="padding:1px 7px">${c.st==='resolvido'?'resolvido':'sem autoria'}</span><span class="sm">${esc(c.t)}</span></div>`).join('')}</div>`;
  return h;
}
function vCaso(){
  const G=S.g,c=caseById(UI.caso);if(!c){UI.caso=null;return vCasos()}
  const late=G.sem>c.due,stage=c.prog<40?'Coleta de provas':c.prog<75?'Identificação da autoria':'Pronto para relatar';
  let h=`<button class="back" data-a="back">← Casos</button>`;
  h+=`<div class="card" style="padding:18px"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag ${c.g>=4?'red':c.g>=3?'ac':'blue'}">${CR[c.tipo].n}</span><span class="tag">Gravidade ${c.g}/5</span>${c.preso?'<span class="tag grn">suspeito preso</span>':''}${c.st!=='aberto'?`<span class="tag grn">${c.st}</span>`:''}</div>
  <div class="d" style="font-size:22px;margin-top:12px;line-height:1.1">${esc(c.t)}</div>
  <p class="sm" style="color:var(--tx2);margin:10px 0 0">${DESC[c.tipo]}</p>
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:16px"><span class="k">${stage}</span><b class="d" style="font-size:26px">${f0(c.prog)}%</b></div>
  <div class="meter" style="height:8px"><div style="width:${c.prog}%;background:${c.prog>=75?'var(--grn)':'var(--ac)'}"></div></div>
  <div class="dl" style="margin-top:10px"><span>Instaurado</span><b>semana ${c.open}</b></div><div class="dl"><span>Prazo</span><b class="${late?'red':''}">semana ${c.due}${late?' (atrasado)':''}</b></div></div>`;
  if(c.st!=='aberto')return h+`<div class="sec"><h2>Diário do inquérito</h2></div><div class="card">${c.log.map(l=>`<div class="news"><span class="k">S${l.s}</span><span>${esc(l.t)}</span></div>`).join('')}</div>`;
  h+=`<div class="sec"><h2>Equipe designada</h2><span>${c.team.length}/3 · toque para alternar</span></div><div class="pick">${G.team.map(a=>{const on=c.team.includes(a.id),busy=a.caso&&a.caso!==c.id;return `<button class="pk ${on?'on':''} ${busy?'busy':''}" data-a="ag" data-v="${a.id}"><span class="face">${face(a.nome,a.fem)}</span>${esc(a.nome.split(' ')[0])} <span class="mu2 xs">${'★'.repeat(a.sk)}</span></button>`}).join('')}</div>
  <p class="xs mu" style="margin:8px 2px 0">A equipe avança o caso toda semana sozinha. Sem mandado cumprido, o progresso automático para em 92%.</p>`;
  h+=`<div class="sec"><h2>Diligências</h2><span>${G.atos} ato(s) · ${money(G.orc)}</span></div>`;
  h+=Object.keys(DIL).map(k=>{const D=DIL[k],why=canDil(c,k);return `<button class="act" data-a="dil" data-v="${k}" ${why?'disabled':''}><div class="ic">${IC[D.ic]}</div><div><b>${D.n}</b><span>${why||D.d}</span></div><div class="c">${D.atos} ato${D.atos>1?'s':''}${D.cost?`<br>${money(D.cost)}`:''}</div></button>`}).join('');
  h+=`<div class="sec"><h2>Diário do inquérito</h2></div><div class="card">${c.log.slice(0,8).map(l=>`<div class="news"><span class="k">S${l.s}</span><span class="sm">${esc(l.t)}</span></div>`).join('')}</div>`;
  return h;
}
function vEquipe(){
  const G=S.g,avg=G.team.reduce((a,x)=>a+x.mor,0)/G.team.length;
  let h=`<div class="kpis" style="margin-top:0"><div class="kpi"><div class="k">Efetivo</div><div class="v">${G.team.length}</div><div class="s">${G.team.filter(a=>!a.caso).length} livre(s)</div></div><div class="kpi"><div class="k">Moral média</div><div class="v">${f0(avg)}</div><div class="meter"><div style="width:${avg}%;background:var(--grn)"></div></div></div></div>`;
  h+=`<div class="sec"><h2>Policiais</h2><span>estrutura ${f0(G.estr)}/100</span></div><div class="card">`;
  h+=G.team.map(a=>{const cs=a.caso?caseById(a.caso):null;return `<div class="agent"><div class="face">${face(a.nome,a.fem)}</div><div><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:15px">${esc(a.nome)}</b><span class="stars">${'★'.repeat(a.sk)}<span class="mu2">${'★'.repeat(5-a.sk)}</span></span></div><div class="xs mu">${a.cargo}</div><div class="meter" style="height:4px;margin-top:8px"><div style="width:${a.mor}%;background:${a.mor<40?'var(--red)':'var(--grn)'}"></div></div><div class="xs" style="margin-top:6px;color:${cs?'var(--tx2)':'var(--mu)'}">${cs?'No caso: '+esc(cs.t):'Livre para designação'}</div></div></div>`}).join('');
  return h+'</div>';
}
function relRow(l,v,col){return `<div class="rel"><span>${l}</span><div class="meter"><div style="width:${v}%;background:${col||(v<35?'var(--red)':v<60?'var(--ac)':'var(--grn)')}"></div></div><b>${f0(v)}</b></div>`}
function vCidade(){
  const G=S.g,oc=openCases(),by={};oc.forEach(c=>by[c.tipo]=(by[c.tipo]||0)+1);const mx=Math.max(1,...Object.values(by));
  let h=`<div class="hero">${skyline(G.porte,hashS(G.city.n)%1000+5,170)}<div class="ov"><div class="d" style="font-size:22px">${esc(G.city.n)}</div><p class="sm" style="margin:6px 0 0;color:var(--tx2)">${esc(G.city.d)}</p></div></div>`;
  h+=`<div class="sec"><h2>Relações institucionais</h2></div><div class="card">${relRow('Ministério Público',G.relMP)}${relRow('Judiciário',G.relJud)}${relRow('Prefeitura',G.relPref)}${relRow('Imprensa',G.imp)}${relRow('Integridade',G.integ,G.integ<40?'var(--red)':'var(--blue)')}</div>`;
  h+=`<p class="xs mu" style="margin:8px 2px 0">Com integridade abaixo de 40, a Corregedoria pode abrir um processo contra você.</p>`;
  h+=`<div class="sec"><h2>Crimes sob investigação</h2></div><div class="card">${Object.keys(by).sort((a,b)=>by[b]-by[a]).map(k=>relRow(CR[k].n,by[k]/mx*100,'var(--ac)').replace(`<b>${f0(by[k]/mx*100)}</b>`,`<b>${by[k]}</b>`)).join('')||'<span class="sm mu">Nenhum.</span>'}</div>`;
  h+=`<div class="sec"><h2>Manchetes</h2></div><div class="card">${G.news.slice(0,8).map(n=>`<div class="news"><span class="k">S${n.s}</span><span class="sm">${esc(n.t)}</span></div>`).join('')}</div>`;
  return h;
}
function vCarreira(){
  const G=S.g,nx=G.classe+1;
  let h=`<div class="card" style="display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center"><div class="face" style="width:64px;height:64px;border-radius:16px">${face(S.nome,S.sexo==='f','del')}</div><div><div class="d" style="font-size:19px">${esc(S.nome)}</div><div class="sm mu" style="margin-top:4px">${S.sexo==='f'?'Delegada':'Delegado'} de ${CLASSES[G.classe]} · ${G.sem} semanas de carreira</div></div></div>`;
  h+=`<div class="kpis"><div class="kpi"><div class="k">Mérito</div><div class="v">${f0(G.merito)}</div>${nx<4?`<div class="meter"><div style="width:${clamp(G.merito/PROMO[nx].m*100,0,100)}%"></div></div><div class="s">${PROMO[nx].m} para ${CLASSES[nx]}</div>`:'<div class="s">Topo da carreira</div>'}</div><div class="kpi"><div class="k">Tempo na classe</div><div class="v">${G.wClass}<small> sem.</small></div>${nx<4?`<div class="meter"><div style="width:${clamp(G.wClass/PROMO[nx].w*100,0,100)}%;background:var(--blue)"></div></div><div class="s">mínimo ${PROMO[nx].w} semanas</div>`:'<div class="s">—</div>'}</div></div>`;
  h+=`<div class="sec"><h2>Carreira</h2></div><div class="card"><div class="ladder">${CLASSES.map((c,i)=>`<div class="rung ${i<G.classe?'done':i===G.classe?'now':''}"><b>Delegado(a) de ${c}</b><div class="xs mu">${i===0?'Ingresso':`${PROMO[i].m} de mérito · ${PROMO[i].w} semanas na classe anterior`}</div></div>`).join('')}<div class="rung ${G.porte===4&&G.classe===3?'now':''}"><b>Delegado(a)-Geral</b><div class="xs mu">Classe Especial na capital, imprensa e integridade altas, esclarecimento acima de 55%</div></div></div></div>`;
  h+=`<div class="sec"><h2>Lotações</h2></div><div class="card">${G.posts.slice().reverse().map(p=>`<div class="dl"><span>${esc(p.city)}</span><b>desde a sem. ${p.from}</b></div>`).join('')}</div>`;
  return h;
}
function vBoletim(){
  const G=S.g,B=G.boletim,b=B.before;
  let h=carBar()+`<div class="scr"><div class="k">Boletim semanal</div><div class="d" style="font-size:26px;margin-top:6px">Semana ${B.sem}</div>`;
  if(B.promo)h+=`<div class="desk" style="margin-top:14px"><div class="k" style="color:var(--ac)">Diário Oficial</div><h3>Promoção a ${B.promo}</h3><p>Seu trabalho foi reconhecido pela Chefia de Polícia.</p></div>`;
  if(B.burn)h+=`<div class="desk" style="margin-top:14px;border-color:var(--red)"><div class="k red">Afastamento médico</div><h3>Esgotamento</h3><p>Você foi afastado(a) por duas semanas. A equipe segue trabalhando sem você.</p></div>`;
  const dl=(l,a,v,good)=>{const d=v-a;return `<div class="dl"><span>${l}</span><b class="${Math.abs(d)<.5?'':(d>0)===good?'grn':'red'}">${f0(v)} (${d>=0?'+':''}${f0(d)})</b></div>`};
  h+=`<div class="card" style="margin-top:14px">${dl('Sensação de segurança',b.sens,G.sens,true)}${dl('Imprensa',b.imp,G.imp,true)}${dl('Seu estresse',b.stress,G.stress,false)}${B.orc?`<div class="dl"><span>Repasse mensal</span><b class="grn">+${money(B.orc)}</b></div>`:''}</div>`;
  if(B.newC.length)h+=`<div class="sec"><h2>Novos inquéritos</h2><span>${B.newC.length}</span></div>${B.newC.map(caseRow).join('')}`;
  if(B.res.length)h+=`<div class="sec"><h2>Resultados chegaram</h2></div><div class="card">${B.res.map(r=>`<div class="news"><span class="k">•</span><span class="sm">${esc(r)}</span></div>`).join('')}</div>`;
  if(B.adv.length)h+=`<div class="sec"><h2>Trabalho da equipe</h2></div><div class="card">${B.adv.map(([c,g])=>`<div class="dl"><span>${esc(c.t)}</span><b class="grn">+${f0(g)}%</b></div>`).join('')}</div>`;
  if(B.late.length)h+=`<div class="sec"><h2>Fora do prazo</h2><span class="red">${B.late.length}</span></div><div class="card">${B.late.map(c=>`<div class="dl"><span>${esc(c.t)}</span><b class="red">${G.sem-1-c.due+1} sem.</b></div>`).join('')}</div>`;
  h+=`</div><div class="fab nobar"><div><button class="btn" data-a="bol">${G.promo?'Ver propostas de remoção':'Continuar'}</button></div></div>`;
  return h;
}
function vPromo(){
  const G=S.g,P=G.promo;
  let h=carBar()+`<div class="scr"><div class="k">Remoção</div><div class="d" style="font-size:24px;margin-top:6px">Novos desafios</div><p class="sm mu" style="margin:10px 0 0">Com a promoção a ${CLASSES[P.classe]}, a Chefia de Polícia oferece novas lotações. Cidades maiores trazem mais crimes, mais estrutura e mais pressão.</p>`;
  h+=P.offers.map((c,i)=>`<button class="card" style="display:block;width:100%;padding:0;overflow:hidden;margin-top:12px" data-a="off" data-v="${i}"><div style="height:110px;overflow:hidden">${skyline(G.porte+1,hashS(c.n)%1000,170)}</div><div style="padding:14px 16px"><div class="d" style="font-size:19px">${esc(c.n)}</div><div class="xs mu mono" style="margin-top:4px">${esc(c.pop)}</div><p class="sm" style="margin:8px 0 0;color:var(--tx2)">${esc(c.d)}</p></div></button>`).join('');
  h+=`<button class="btn gh" style="margin-top:14px" data-a="stay">Permanecer em ${esc(G.city.n)}</button></div>`;
  return h;
}
function vFim(){
  const F=S.fim,T={geral:['Delegado(a)-Geral','Você chegou ao topo da Polícia Civil.'],exon:['Demitido(a)','A Corregedoria encerrou sua carreira.'],burn:['Aposentadoria precoce','Três afastamentos por esgotamento. O corpo cobrou a conta.'],apos:['Aposentadoria','Dez anos de carreira chegaram ao fim.']}[F.kind];
  return appbar('Fim de carreira')+`<div class="scr"><div class="hero">${skyline(Math.max(1,F.porte),99,190)}<div class="ov"><div class="k" style="color:var(--ac)">${esc(S.nome)}</div><div class="d" style="font-size:30px">${T[0]}</div></div></div>
  <p style="color:var(--tx2);margin:14px 2px">${T[1]}</p><div class="card"><div class="dl"><span>Pontuação</span><b class="ac">${F.score}</b></div><div class="dl"><span>Casos resolvidos</span><b>${F.solved}</b></div><div class="dl"><span>Taxa de esclarecimento</span><b>${f0(F.esc)}%</b></div><div class="dl"><span>Classe</span><b>${CLASSES[F.classe]}</b></div><div class="dl"><span>Lotações</span><b>${F.posts}</b></div><div class="dl"><span>Semanas de carreira</span><b>${F.sem}</b></div></div>
  <button class="btn" style="margin-top:16px" data-a="new">Nova carreira</button><button class="btn gh" data-a="cover">Início</button></div>`;
}

function render(){
  let h='';
  if(UI.screen==='cover')h=vCover();
  else if(UI.screen==='setup')h=vSetup();
  else switch(S.phase){
    case 'estudo':h=vEstudo();break;
    case 'objetiva':h=vObj();break;
    case 'objres':h=vObjRes();break;
    case 'disc':h=vDisc();break;
    case 'taf':h=vTaf();break;
    case 'oral':h=vOral();break;
    case 'resultado':h=vResultado();break;
    case 'acad':h=vAcad();break;
    case 'lot':h=vLot();break;
    case 'car':{const G=S.g;
      if(UI.view==='boletim'&&G.boletim)h=vBoletim();
      else if(G.promo&&UI.view==='promo')h=vPromo();
      else{h=carBar()+'<div class="scr">'+(UI.caso?vCaso():UI.tab==='casos'?vCasos():UI.tab==='equipe'?vEquipe():UI.tab==='cidade'?vCidade():UI.tab==='carreira'?vCarreira():vDel())+'</div>'+tabs()}
      break}
    case 'fim':h=vFim();break;
  }
  if(UI.toast)h+=`<div class="toast">${esc(UI.toast)}</div>`;
  $.innerHTML=h;
}
setInterval(()=>{
  if(!S)return;let dl,tot;
  if(S.phase==='objetiva'&&!S.ex.shown){dl=S.ex.deadline;tot=45000}else if(S.phase==='disc'&&!S.disc.res){dl=S.disc.deadline;tot=360000}else return;
  const left=Math.max(0,dl-Date.now()),t=document.getElementById('tt'),b=document.getElementById('tb'),x=document.getElementById('tx');
  if(t)t.textContent=fmtT(left);if(b)b.style.width=(left/tot*100)+'%';if(x)x.classList.toggle('low',left<(tot>60000?60000:10000));
  if(left<=0){if(S.phase==='objetiva'){S.ex.ans[S.ex.i]=-1;S.ex.shown=true;save();render()}else{S.disc.res=gradeDisc(UI.ans);S.notas.disc=S.disc.res.s;save();render()}}
},250);

function act(a,v){
  switch(a){
    case 'new':UI.screen='setup';UI.setup.nome='';render();top();break;
    case 'cover':UI.screen='cover';render();top();break;
    case 'continue':S=load();if(S){UI.screen='game';UI.view=S.g&&S.g.boletim?'boletim':null;render()}break;
    case 'sx':UI.setup.sexo=v;render();break;
    case 'fd':UI.setup.fundo=v;render();break;
    case 'inscr':{const n=(UI.setup.nome||'').trim();if(n.length<3)return toast('Digite seu nome.');newStudy(n,UI.setup.fundo,UI.setup.sexo);UI.screen='game';save();render();top();break}
    case 'al':{const [id,d]=v.split(':'),C=S.c;C.alloc[id]=clamp((C.alloc[id]||0)+(+d),0,C.blocos);if(usedBlocks()>C.blocos)C.alloc[id]--;save();render();break}
    case 'sev':{const C=S.c,e=STEV.find(x=>x.id===C.ev);C.log.unshift(`${e.t}: ${e.o[+v].f(C)}`);C.ev=null;save();render();break}
    case 'mes':studyMonth();break;
    case 'qa':answerQ(+v);break;
    case 'qn':nextQ();break;
    case 'todisc':S.phase='disc';S.disc={deadline:Date.now()+360000};UI.ans='';save();render();top();break;
    case 'discok':S.disc.res=gradeDisc(UI.ans);S.notas.disc=S.disc.res.s;save();render();top();break;
    case 'totaf':runTAF();save();render();top();break;
    case 'tafn':S.taf.i++;save();render();break;
    case 'tooral':S.phase='oral';S.oral={qs:shuffle(ORAL).slice(0,3),i:0,ans:[],ord:shuffle([0,1,2])};save();render();top();break;
    case 'or':{const O=S.oral;O.ans.push(O.qs[O.i].o[+v][1]);O.i++;O.ord=shuffle([0,1,2]);if(O.i>=O.qs.length)finishOral();save();render();top();break}
    case 'retry':{const C=S.c;C.mes=1;C.meses=6;C.tent++;C.en=Math.max(C.en,70);C.log.unshift(`Novo concurso aberto. Tentativa ${C.tent}.`);S.phase='estudo';autoAlloc();delete S.ex;delete S.notas;save();render();top();break}
    case 'toacad':S.phase='acad';save();render();top();break;
    case 'ac':S.bonus={inv:v==='inv'?.12:0,int:v==='int'?.08:0,ges:v==='ges'?.1:0};S.phase='lot';save();render();top();break;
    case 'lot':startCareer(S.lotOpts[+v],1);break;
    case 'tab':UI.tab=v;UI.caso=null;render();top();break;
    case 'case':UI.caso=+v;render();top();break;
    case 'back':UI.caso=null;UI.tab='casos';render();break;
    case 'ag':toggleAgent(UI.caso,v);break;
    case 'dil':doDil(UI.caso,v);break;
    case 'gest':doGest(v);break;
    case 'ev':chooseEv(+v);break;
    case 'week':endWeek();break;
    case 'bol':S.g.boletim=null;UI.view=S.g.promo?'promo':null;if(!S.g.promo){UI.tab='del';UI.caso=null}save();render();top();break;
    case 'off':acceptOffer(+v);UI.view=null;break;
    case 'stay':S.g.promo=null;UI.view=null;save();render();top();break;
  }
}
$.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b.dataset.v)});
$.addEventListener('input',e=>{if(e.target.id==='nm')UI.setup.nome=e.target.value;if(e.target.id==='ans')UI.ans=e.target.value});
window.__dist={get S(){return S},UI,act,QB};
render();
})();
</script>
<script src="./bnf-config.js"></script>
<script src="./bnf-analytics.js" data-page="Distintivo"></script>
