<style>
:root{
  --hd:#0B2545;--hd2:#13315C;--bg:#E8ECF1;--pn:#FFFFFF;--pn2:#F5F7FA;--ln:#D2D9E2;--ln2:#E6EAF0;
  --tx:#1B2430;--tx2:#3A4656;--mu:#5B6777;--mu2:#8A95A3;
  --pr:#1D4E89;--pr2:#E6EEF8;--ok:#1E7B4D;--ok2:#E5F4EC;--wa:#946200;--wa2:#FFF3D1;--er:#B42318;--er2:#FDEBE9;
  --sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--serif:'IBM Plex Serif',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
#app{max-width:820px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:86px}
.mono{font-family:var(--mono)} .mu{color:var(--mu)} .mu2{color:var(--mu2)} .ok{color:var(--ok)} .er{color:var(--er)} .wa{color:var(--wa)} .pr{color:var(--pr)}
.sm{font-size:12.5px} .xs{font-size:11.5px} .b{font-weight:600}

/* barra do sistema */
.sys{background:var(--hd);color:#fff}
.sys .r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .lg{width:28px;height:28px;border-radius:3px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand b{font-weight:700;letter-spacing:.06em;font-size:14px}
.brand span{font-size:11px;color:#9FB3CF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usr{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#C9D6E8;text-align:right;line-height:1.25;flex-shrink:0}
.usr .av{width:28px;height:28px;border-radius:3px;overflow:hidden;background:#24456F}
.usr .av svg{display:block;width:100%;height:100%}
.sys2{background:var(--hd2);color:#C9D6E8;font-size:11.5px;display:flex;justify-content:space-between;gap:10px;padding:6px 12px;white-space:nowrap;overflow:hidden}
.sys2 b{color:#fff;font-weight:600}
.mods{display:flex;overflow-x:auto;background:var(--pn);border-bottom:1px solid var(--ln);scrollbar-width:none;position:sticky;top:0;z-index:20}
.mods::-webkit-scrollbar{display:none}
.mod{flex-shrink:0;padding:11px 13px 10px;font-size:13px;font-weight:500;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
.mod.on{color:var(--pr);border-bottom-color:var(--pr);font-weight:600}
.mod i{font-style:normal;display:inline-block;min-width:17px;height:17px;line-height:17px;text-align:center;border-radius:9px;background:var(--er);color:#fff;font-size:10.5px;margin-left:5px;padding:0 4px}
.wrap{padding:12px}
.ttl{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:2px 0 10px}
.ttl h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.ttl .sub{font-size:12px;color:var(--mu)}

/* painéis */
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:4px;overflow:hidden}
.pn+.pn{margin-top:12px}
.pn>h3{margin:0;padding:8px 12px;background:var(--pn2);border-bottom:1px solid var(--ln);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);display:flex;justify-content:space-between;gap:8px}
.pn>h3 span{font-weight:500;letter-spacing:0;text-transform:none;color:var(--mu)}
.pb{padding:12px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.kv>div{padding:9px 12px;border-bottom:1px solid var(--ln2);border-right:1px solid var(--ln2);min-width:0}
.kv>div:nth-child(2n){border-right:0}
.kv label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu2);font-weight:600}
.kv b{display:block;font-size:13.5px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:640px){.kv.k4{grid-template-columns:repeat(4,1fr)}.kv.k4>div:nth-child(2n){border-right:1px solid var(--ln2)}.kv.k4>div:nth-child(4n){border-right:0}}

/* tabelas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--pn2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--ln2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.ck{cursor:pointer} tr.ck:hover td{background:#F7F9FC}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}

/* selos */
.bd{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:var(--pn2);color:var(--mu);border:1px solid var(--ln);white-space:nowrap}
.bd.ok{background:var(--ok2);color:var(--ok);border-color:#B7DEC8}
.bd.wa{background:var(--wa2);color:var(--wa);border-color:#F1DB9B}
.bd.er{background:var(--er2);color:var(--er);border-color:#F3C1BB}
.bd.pr{background:var(--pr2);color:var(--pr);border-color:#BFD2EA}
.bar{height:6px;background:var(--ln2);border-radius:1px;overflow:hidden;min-width:60px}
.bar>div{height:100%;background:var(--pr)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:3px;background:var(--pr);color:#fff;font-size:13px;font-weight:600;border:1px solid var(--pr)}
.btn.sec{background:#fff;color:var(--pr);border-color:#AFC3DD}
.btn.er{background:#fff;color:var(--er);border-color:#F0B8B1}
.btn.full{width:100%;height:42px}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--ln);box-shadow:0 -4px 14px rgba(11,37,69,.06);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.foot>div{max-width:796px;margin:0 auto;display:flex;align-items:center;gap:10px}
.foot .inf{flex:1;font-size:11.5px;color:var(--mu);line-height:1.35;min-width:0}
.foot .inf b{color:var(--tx)}

/* ofício */
.memo{background:#fff;border:1px solid var(--ln);border-radius:2px;box-shadow:0 1px 0 var(--ln2)}
.memo .mh{display:flex;justify-content:space-between;gap:10px;padding:12px 14px 10px;border-bottom:2px solid var(--hd)}
.memo .mh b{font-size:12.5px;letter-spacing:.04em}
.memo .mb{padding:14px;font-family:var(--serif);font-size:15px;line-height:1.6;color:#222}
.memo .mb p{margin:0 0 10px}
.memo .meta{font-family:var(--sans);font-size:12px;color:var(--mu);margin-bottom:10px;line-height:1.5}
.memo .meta b{color:var(--tx)}
.desp{border-top:1px dashed var(--ln);padding:12px 14px 14px;background:var(--pn2)}
.desp>label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--tx2);margin-bottom:8px}
.ro{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;width:100%;padding:10px 12px;background:#fff;border:1px solid var(--ln);border-radius:3px;margin-bottom:6px}
.ro i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mu2);margin-top:2px}
.ro.on{border-color:var(--pr);background:var(--pr2)} .ro.on i{border:5px solid var(--pr)}
.ro b{display:block;font-size:13.5px;font-weight:600}
.ro span{display:block;font-size:12px;color:var(--mu);margin-top:2px}

/* plano de ação */
.pol{padding:12px;border-bottom:1px solid var(--ln2)}
.pol:last-child{border-bottom:0}
.pol .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pol .h b{font-size:13.5px;font-weight:600}
.pol p{margin:5px 0 8px;font-size:12.5px;color:var(--tx2)}
.spec{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--mu);margin-bottom:8px}
.spec b{color:var(--tx);font-weight:600;font-family:var(--mono)}
.chart{display:block;width:100%;height:auto}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--mu);padding:0 12px 10px}
.leg i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:4px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:60;background:var(--hd);color:#fff;border-radius:3px;padding:9px 14px;font-size:13px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.note{font-size:11.5px;color:var(--mu);margin:10px 2px 0;line-height:1.5}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid #F1DB9B;background:var(--wa2);border-radius:3px;font-size:12.5px;margin-bottom:12px}
.alert.er{border-color:#F3C1BB;background:var(--er2)}
.alert.ok{border-color:#B7DEC8;background:var(--ok2)}
.alert b{display:block}
/* concurso */
.al{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--ln2)}
.al:last-child{border-bottom:0}
.stp{display:flex;align-items:center;border:1px solid var(--ln);border-radius:3px;overflow:hidden}
.stp button{width:32px;height:30px;background:var(--pn2);font-size:16px;font-weight:600;text-align:center;color:var(--pr)}
.stp span{width:30px;text-align:center;font-family:var(--mono);font-weight:600}
.opt{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;width:100%;padding:11px 12px;border:1px solid var(--ln);background:#fff;border-radius:3px;font-size:14px;margin-bottom:6px}
.opt .L{width:26px;height:26px;border-radius:2px;border:1px solid var(--ln);background:var(--pn2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--tx2)}
.opt.c{border-color:var(--ok);background:var(--ok2)} .opt.c .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.w{border-color:var(--er);background:var(--er2)} .opt.w .L{background:var(--er);color:#fff;border-color:var(--er)}
.clock{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.clock b{font-family:var(--mono);font-size:16px;font-weight:600;min-width:48px}
.clock .bar{flex:1;height:5px}
.clock.low b{color:var(--er)} .clock.low .bar>div{background:var(--er)}
textarea{width:100%;min-height:230px;resize:vertical;border:1px solid var(--ln);border-radius:3px;padding:12px;font-family:var(--serif);font-size:15px;line-height:1.6;background:#fff}
input.in{width:100%;height:40px;border:1px solid var(--ln);border-radius:3px;padding:0 10px;font-size:14px;background:#fff}
textarea:focus,input.in:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
.big{font-size:40px;font-weight:700;line-height:1;font-family:var(--mono);letter-spacing:-.02em}
.face{width:30px;height:30px;border-radius:2px;overflow:hidden;background:#DDE4EC;flex-shrink:0}
.face svg{display:block;width:100%;height:100%}
.who{display:flex;align-items:center;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;border:1px solid var(--ln);border-radius:3px;background:#fff;font-size:12.5px;margin:0 6px 6px 0}
.chk.on{border-color:var(--pr);background:var(--pr2);color:var(--pr);font-weight:600}
.chk.busy{opacity:.55}
.cover{min-height:100vh;display:flex;flex-direction:column}
.login{max-width:420px;margin:0 auto;padding:22px 16px}
.seal{width:64px;height:64px;margin:0 auto 10px;display:block}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--ln)}
.tl>div{position:relative;padding:4px 0 12px}
.tl>div::before{content:"";position:absolute;left:-21px;top:7px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--mu2)}
.tl>div.d::before{background:var(--ok);border-color:var(--ok)}
.tl>div.n::before{background:var(--pr);border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}

/* ===== história ===== */
@keyframes sir{0%,100%{opacity:.2}50%{opacity:.95}}
.sirR{animation:sir 1.1s infinite}.sirB{animation:sir 1.1s .55s infinite}
@media (prefers-reduced-motion:reduce){.sirR,.sirB{animation:none}}
body.dark,body.dark #app{background:#0C0E12}
.hud{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:rgba(12,14,18,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #1E222A;color:#E8E6E1}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
.hl b{display:block;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:900;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.hl span{display:block;font-size:11.5px;color:#8C93A0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hseal svg{display:block;width:26px;height:26px}
.hbtn{flex-shrink:0;height:32px;padding:0 12px;border-radius:8px;border:1px solid #2C313B;color:#E8E6E1;font-size:12.5px;font-weight:600;background:#171A20}

.art svg{display:block;width:100%;height:100%}

.sb{padding:6px 18px 0}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#E0A33A}
.stt{margin:8px 0 14px;font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.01em}
.pers{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.pface{width:48px;height:48px;border-radius:50%;overflow:hidden;background:#222;flex-shrink:0;box-shadow:0 0 0 2px #2C313B}
.pface svg{display:block;width:100%;height:100%}
.pers b{display:block;font-size:15px}
.pers span{display:block;font-size:12.5px;color:#8C93A0}
.txt p{font-family:'Source Serif 4',Georgia,serif;font-size:18.5px;line-height:1.62;color:#D8D4CB;margin:0 0 14px}

.chosen{font-size:13px;color:#8C93A0;border-left:3px solid #E0A33A;padding:4px 0 4px 10px;margin:0 0 14px}
.chosen b{color:#E8E6E1;font-weight:600}
.dts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 22px}
.dt{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:99px;background:#1A1D24;border:1px solid #2A2F38;color:#B9BEC8}
.dt.up{color:#4FCB8E;border-color:#1F4A35;background:#11231A}
.dt.dn{color:#F07A7A;border-color:#4A1F22;background:#241315}
.focus{border-top:1px solid #20242C;padding-top:18px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fc{padding:12px;border-radius:12px;border:1px solid #2A2F38;background:#15181E;color:#E8E6E1;min-width:0}
.fc b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}

.sfoot{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(12,14,18,0),#0C0E12 35%)}
.sbtn{display:block;width:100%;max-width:788px;margin:0 auto;height:54px;border-radius:14px;background:#E0A33A;color:#1A1205;font-family:'Archivo',sans-serif;font-stretch:115%;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.sbtn:disabled{background:#2A2F38;color:#8C93A0;opacity:1}
.panelw{background:#0C0E12;color:#E8E6E1;min-height:100vh}

<body>
<div id="app"></div>
<script>
/* ================================================================
   DISTINTIVO — simulador de carreira de delegado (BNF Games)
   Números de criminalidade são simulados e não são estatística oficial.
   Pessoas, casos e a cidade inicial são fictícios.
================================================================= */
(function(){
'use strict';
const $=document.getElementById('app');
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f0=x=>Math.round(x).toLocaleString('pt-BR');
const f1=x=>(Math.round(x*10)/10).toFixed(1).replace('.',',');
const pct=x=>(x>0?'+':'')+f1(x*100)+'%';

function studyMonth(){
  const C=S.c;if(usedB()!==C.blocos)return toast(`Distribua os ${C.blocos} blocos do mês.`);
  const eff=C.en<25?.55:C.en<45?.8:1,ch=[];
  MAT.forEach(m=>{const n=C.alloc[m.id]||0;if(!n)return;let g=0;for(let i=0;i<n;i++)g+=10*(1-C.k[m.id]/115)*eff*R(.85,1.15)*Math.pow(.85,i);C.k[m.id]=clamp(C.k[m.id]+g,0,100);ch.push(`${m.nome.split(' ').pop()} +${f0(g)}`)});
  const tr=C.alloc.treino||0;if(tr){const g=tr*7*(1-C.fit/120);C.fit=clamp(C.fit+g,0,100);ch.push(`TAF +${f0(g)}`)}
  const tb=C.alloc.trab||0;C.money+=tb*1.4-2.2;
  const sb=MAT.reduce((a,m)=>a+(C.alloc[m.id]||0),0);
  C.en=clamp(C.en-sb*7-tr*4-tb*5+(C.alloc.desc||0)*22+8,0,100);
  MAT.forEach(m=>{if(!C.alloc[m.id])C.k[m.id]=clamp(C.k[m.id]-1.2,0,100)});
  if(C.money<0){C.en=clamp(C.en-12,0,100);ch.push('contas em atraso')}
  C.log.unshift(`Mês ${C.mes}: `+(ch.join(' · ')||'sem estudo'));
  C.mes++;if(C.mes>C.meses){startExam();return}
  C.ev=Math.random()<.5?pick(STEV.filter(e=>!e.cond||e.cond(C))).id:null;
  save();render();top();
}

function balQs(){const by={};QB.forEach((q,i)=>(by[q.m]=by[q.m]||[]).push(i));const out=[];['const','proc','proc','penal','esp','esp','adm','crim','penal','const'].forEach(m=>{const p=(by[m]||[]).filter(i=>!out.includes(i));if(p.length)out.push(pick(p))});return out}
function finishObj(){const E=S.ex,C=S.c,hits=E.qs.filter((q,k)=>E.ans[k]===QB[q].c).length,kav=MAT.reduce((a,m)=>a+C.k[m.id],0)/MAT.length;E.hits=hits;E.nota=Math.round(clamp(hits*10*.5+kav*.55+5+R(-3,3),0,100));S.notas={obj:E.nota};S.phase='objres'}
function gradeDisc(t){
  const n=norm(t||''),w=(t||'').trim().split(/\s+/).filter(Boolean).length,fb=[];let s=18;
  s+=DISC.kw.filter(g=>g.some(k=>n.includes(norm(k)))).length*6;
  fb.push(n.includes('312')?'Indicou o art. 312 do CPP como fundamento legal.':'Ausência de indicação do art. 312 do CPP.');
  if(/ordem publica/.test(n))fb.push('Fundamentação na garantia da ordem pública.');
  fb.push(/instrucao/.test(n)?'Demonstrou risco à instrução criminal (ameaça a testemunhas).':'Não explorou a conveniência da instrução criminal.');
  fb.push(/materialidade|existencia do crime/.test(n)&&/autoria/.test(n)?'Demonstrou materialidade e indícios de autoria.':'Faltou demonstrar materialidade e indícios suficientes de autoria.');
  if(w<60){s-=12;fb.push('Texto insuficiente para uma peça processual.')}else if(w>140)s+=6;
  s+=(S.c.k.proc-50)*.25;
  return {s:Math.round(clamp(s+R(-4,4),0,100)),fb};
}
function runTAF(){const F=S.c.fit,c=Math.round(1700+F*13+R(-180,180)),b=Math.max(0,Math.round(F/9+R(-2,2))),a=Math.round(18+F*.42+R(-5,5));S.taf={res:[{n:'Corrida de 12 minutos',v:c+' m',ok:c>=2400,min:'2.400 m'},{n:'Barra fixa',v:b+' rep.',ok:b>=3,min:'3 rep.'},{n:'Abdominal (1 min)',v:a+' rep.',ok:a>=35,min:'35 rep.'}],i:0};S.taf.ok=S.taf.res.every(r=>r.ok);S.phase='taf'}
function finishOral(){const O=S.oral,pts=O.ans.reduce((a,x)=>a+x,0),kav=MAT.reduce((a,m)=>a+S.c.k[m.id],0)/MAT.length;S.notas.oral=Math.round(clamp(pts/(O.qs.length*3)*70+kav*.3+R(-3,3),0,100));const fin=S.notas.obj*.4+S.notas.disc*.35+S.notas.oral*.25;S.notas.fin=Math.round(fin*10)/10;S.notas.vagas=60;S.notas.rank=Math.max(1,Math.round(60*Math.exp((71-fin)/7.5)));S.notas.ok=S.notas.rank<=60;S.phase='resultado'}

function rng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}

{id:'chegada',st:0,first:1,loc:'delegacia',time:'segunda, 7h50',who:'lurdes',kick:'Primeira semana',t:'A delegacia de {cid}',

 o:[{t:'Reunir todo mundo e ouvir a equipe',s:'Começar pelas pessoas.',fx:{eq:8,stress:2},r:'A reunião dura duas horas. Lurdes fala do medo das vítimas de violência doméstica, que voltam para casa sem proteção. Tavares, no fim, admite: "Os furtos são sempre os mesmos caras. O problema é para quem eles vendem."'},
    {t:'Virar a noite lendo os inquéritos parados',s:'Começar pelos papéis.',fx:{stress:8,furto:-2,domestica:-1},r:'Às três da manhã você encontra o padrão: quase todos os furtos do centro somem no mesmo dia. Alguém compra rápido. A equipe chega de manhã e vê o café frio e os post-its na parede.'},
    {t:'Visitar o prefeito antes de tudo',s:'Começar pela política.',fx:{pol:8,eq:-4},r:'Osmar Brito te recebe com abraço e foto para as redes. Promete conserto da viatura "semana que vem". Na delegacia, a equipe comenta que o novo titular foi primeiro ao gabinete.'}]},

 o:[{t:'Montar campana com a equipe nas noites seguintes',s:'Cansativo, mas pega em flagrante.',fx:{eq:-3,stress:4,furto:-4},set:'pista',r:'Na terceira noite, Tavares pega dois rapazes com uma mochila cheia de relógios. Um deles, assustado, solta um nome: "a gente leva tudo pro ferro-velho do cunhado do vereador".'},
    {t:'Propor câmeras dos comerciantes integradas à delegacia',s:'Investimento coletivo, efeito duradouro.',fx:{com:5,furto:-3},set:'cameras',r:'Os comerciantes fazem uma vaquinha. Em duas semanas, doze câmeras apontam para a praça e mandam imagem para o computador da delegacia.'},
    {t:'Prometer rondas e pedir paciência',s:'Ganha tempo.',fx:{com:-2},r:'Anselmo agradece sem acreditar. No grupo dos comerciantes, alguém escreve: "polícia de novo prometendo".'}]},
{id:'ferro',st:0,need:'pista',loc:'loja',time:'sexta, 9h15',who:'tavares',kick:'Furtos em série',t:'O ferro-velho do cunhado',
 p:['O ferro-velho fica na saída da cidade. Tavares estaciona longe. "O dono é cunhado do Gerson, vereador da base do prefeito. Se a gente entrar lá, o prefeito vai ligar antes do almoço."','Pela cerca, dá para ver bicicletas, fios de cobre enrolados e uma caixa de relógios.'],
 o:[{t:'Representar por mandado de busca e entrar com tudo documentado',s:'O caminho da lei, custe o que custar.',fx:{furto:-7,pol:-8,integ:5,imp:3},r:'O juiz defere em 24 horas. Vocês encontram 140 objetos com registro de furto. O prefeito liga às 11h40. Você não atende. No dia seguinte, a rádio fala da "operação ferro-velho".'},
    {t:'Ter uma "conversa" com o dono para ele parar de comprar',s:'Resolve sem barulho, sem processo.',fx:{furto:-3,integ:-8,pol:2},r:'O dono jura que nunca mais. Os furtos diminuem por um tempo. Tavares te olha diferente, como quem aprendeu que aqui as coisas se resolvem assim.'},

{id:'rosa1',st:0,loc:'casa',time:'domingo, 22h10',who:'rosangela',kick:'Medida protetiva',t:'Rosângela voltou',
 p:['Rosângela chega com o filho de seis anos no colo. É a segunda vez no mês que o ex-companheiro aparece na porta dela, mesmo com a medida protetiva. "Ele disse que da próxima vez não vai só bater no portão."','Lurdes te olha. O plantão regional fecha às 22h. O próximo carro só amanhã.'],
 o:[{t:'Representar pela prisão preventiva e mandar a viatura agora',s:'Descumprimento de medida protetiva é crime.',fx:{domestica:-5,eq:-2,stress:3},set:'rosa_ok',r:'O ex-companheiro é preso de madrugada na casa da mãe dele. O juiz mantém a prisão. Rosângela dorme pela primeira vez em semanas.'},
    {t:'Registrar a ocorrência e encaminhar ao juiz no prazo',s:'O procedimento padrão: 48 horas.',fx:{domestica:-1},set:'rosa_risco',r:'Tudo correto no papel. Rosângela vai para a casa da irmã. Lurdes passa a noite olhando o celular.'},
    {t:'Chamar o ex-companheiro para uma conversa',s:'Tentar acalmar a situação.',fx:{integ:-4,domestica:1},set:'rosa_risco',r:'Ele vem, educado, diz que foi um mal-entendido. Assina um papel prometendo distância. Lurdes não diz nada, mas o silêncio dela pesa.'}]},
{id:'rosa2a',st:0,need:'rosa_risco',after:'rosa1',loc:'velorio',time:'quinta, 4h20',who:'lurdes',kick:'Medida protetiva',t:'O telefone toca de madrugada',

 o:[{t:'Revisar todas as medidas protetivas da cidade em força-tarefa',s:'Ninguém mais vai cair nessa fresta.',fx:{domestica:-7,stress:10,eq:-3,imp:2},set:'protetivas',r:'Vocês visitam 63 mulheres em uma semana. Em três casos, o agressor já rondava a casa. Rosângela sobrevive. A cidade não esquece, mas vê a delegacia nas ruas.'},
    {t:'Dar uma entrevista assumindo a falha',s:'Sem desculpas, com explicação.',fx:{imp:3,com:3,integ:4,domestica:-2},r:'Você diz no ar: "Nós falhamos com a Rosângela." Jandira, da rádio, fica um segundo em silêncio. Depois, as mensagens de ouvintes chegam: outras mulheres pedem ajuda.'},
    {t:'Soltar uma nota oficial',s:'Proteger a instituição.',fx:{imp:-6,com:-5},r:'A nota fala em "procedimentos cumpridos". Ninguém lê até o fim.'}]},
{id:'rosa2b',st:0,need:'rosa_ok',after:'rosa1',loc:'delegacia',time:'terça, 15h00',who:'rosangela',kick:'Medida protetiva',t:'Um bolo na mesa da escrivania',
 p:['Rosângela aparece com um bolo de fubá e o filho escondido atrás da perna dela. "Vim agradecer. E vim dizer que tem mais mulher na minha rua passando pelo mesmo. Elas têm medo de vir aqui."','Lurdes sugere duas coisas: uma sala reservada para ouvir as vítimas e uma patrulha da Guarda Municipal para visitar quem tem medida protetiva.'],
 o:[{t:'Criar a patrulha com a Guarda Municipal',s:'Depende do prefeito.',fx:{domestica:-7,pol:2,com:3},set:'patrulha',r:'O prefeito topa: gosta da ideia de aparecer na inauguração. Duas guardas fazem visitas toda semana. Os descumprimentos caem pela metade.'},
    {t:'Montar uma sala de atendimento reservada',s:'Mudar a forma de receber as vítimas.',fx:{domestica:-5,com:5},r:'Uma sala com sofá, brinquedos e porta fechada. Em um mês, os registros aumentam, porque as mulheres finalmente vêm, e as agressões graves caem.'}]},
{id:'festa',st:0,loc:'praca',time:'sábado, 20h00',who:'darcio',kick:'A festa da cidade',t:'O palanque de Dárcio',

 o:[{t:'Recusar e abrir investigação sobre agiotagem',s:'Integridade, com preço político.',fx:{integ:6,pol:-6,com:2},set:'agiota',r:'Você agradece e vai embora. Na segunda-feira, três pessoas aparecem na delegacia para contar das "visitas" de cobrança.'},
    {t:'Subir ao palanque por cinco minutos',s:'Boa relação com quem manda na cidade.',fx:{pol:6,integ:-6},r:'A foto vai para as redes do prefeito e do Dárcio. Nos comentários, alguém escreve: "agora a polícia é sócia".'}]},
{id:'praca',st:0,loc:'praca',time:'terça, 10h30',who:'prefeito',kick:'Pressão política',t:'"Limpar" a praça',
 p:['O prefeito quer a praça central "limpa" antes da visita do governador: retirar à força as pessoas em situação de rua e os usuários de drogas que dormem nos bancos. A Guarda Municipal faria o serviço. Ele quer a Polícia Civil junto, "para dar respaldo".'],
 o:[{t:'Recusar a remoção forçada e propor ação com o CAPS',s:'Saúde para uns, polícia para o tráfico.',fx:{pol:-6,com:3,integ:3,furto:-1},r:'O prefeito desliga irritado. A assistente social do CAPS te liga dois dias depois: quatro pessoas aceitaram tratamento. O traficante que abastecia a praça foi preso na semana seguinte.'},
    {t:'Apoiar a ação do prefeito',s:'A praça fica bonita na foto.',fx:{pol:6,integ:-6,com:-4,furto:2},r:'A praça amanhece vazia. Três dias depois, os mesmos rostos estão nos bancos da rodoviária e os furtos ali aumentam.'}]},
{id:'poste',st:0,loc:'rua',time:'quinta, 19h45',who:'tavares',kick:'Justiça com as próprias mãos',t:'Amarrado ao poste',
 p:['Um adolescente suspeito de furtar uma bicicleta foi espancado e amarrado a um poste por moradores do bairro São José. O vídeo já tem 40 mil visualizações. Tavares chega com ele algemado: "Os caras que bateram estão lá rindo, {dr}. Metade do bairro apoia."'],
 o:[{t:'Prender os agressores e apurar o furto separadamente',s:'A lei vale para todos.',fx:{integ:6,com:-3,imp:3},r:'Três homens autuados por lesão corporal. Parte do bairro te xinga nas redes. O promotor manda uma mensagem: "Era isso que tinha que ser feito."'},
    {t:'Registrar só o furto',s:'Não comprar briga com o bairro.',fx:{integ:-10,com:3},r:'O bairro aplaude. Na semana seguinte, outro suspeito é agredido em outra rua. Agora com mais gente filmando.'}]},
{id:'radio',st:0,loc:'estudio',time:'segunda, 7h05',who:'jandira',kick:'Ao vivo',t:'Rádio Cidade FM',

    {t:'Prometer resultado em um mês',s:'Ganha a manhã, cria uma cobrança.',fx:{imp:6,stress:6},set:'promessa',r:'O trecho viraliza nos grupos da cidade. Agora todo mundo conta os dias.'},
    {t:'Culpar a audiência de custódia e a falta de efetivo',s:'Verdade parcial, soa como desculpa.',fx:{imp:-3,com:2},r:'Ouvintes concordam. Jandira não: "Mas e o senhor, faz o quê?"'}]},
{id:'taxa',st:0,loc:'delegacia',time:'sexta, 18h20',who:'tavares',kick:'Dentro de casa',t:'A "taxa" do Tavares',
 p:['Um comerciante te procura discretamente: há anos paga uma "taxa" mensal a Tavares para ter ronda na porta. Ele mostra transferências no celular.','Tavares é o melhor investigador que você tem. Sem ele, metade das prisões não teria acontecido.'],
 o:[{t:'Afastar Tavares e comunicar a Corregedoria',s:'Ninguém está acima da lei.',fx:{integ:8,eq:-8},r:'A equipe fica em silêncio por uma semana. Lurdes, na sexta, deixa um café na sua mesa sem dizer nada. É o jeito dela de aprovar.'},
    {t:'Chamar Tavares para uma conversa franca',s:'Dar uma chance, sem processo.',fx:{integ:-5,eq:2},r:'Ele nega, depois admite, depois promete parar. Você não sabe se acredita.'},
    {t:'Fingir que não viu',s:'Preservar o time.',fx:{integ:-14,eq:3},r:'O comerciante sai sem resposta. Você sabe que ele vai contar a outros.'}]},
{id:'plantao',st:0,loc:'rua',time:'sábado, 1h30',who:'lurdes',kick:'A cidade sem plantão',t:'Oitenta quilômetros',
 p:['Uma jovem vítima de estupro precisou viajar 80 km até o plantão regional para registrar a ocorrência e fazer o exame. Voltou de carona com o pai, de madrugada. Lurdes está furiosa: "A gente não pode deixar isso acontecer de novo."'],
 o:[{t:'Montar sobreaviso local com a equipe',s:'Mais trabalho para todos.',fx:{com:6,eq:-5,domestica:-2},r:'A escala fica pesada, mas a cidade passa a ter alguém para atender de madrugada. A notícia corre pelas igrejas e escolas.'},
    {t:'Oficiar a Delegacia Seccional pedindo plantão 24 horas',s:'O caminho formal.',fx:{pol:2,com:1},r:'O ofício segue. A resposta vem em seis semanas: "em análise".'}]},
/* ------------------------- SÃO PAULO ------------------------- */
{id:'sp1',st:1,first:1,loc:'centro',time:'segunda, 8h00',who:'katia',kick:'O centro',t:'Seiscentos celulares por semana',
 p:['Do décimo andar da Seccional dá para ver a praça da Sé, o Viaduto do Chá e a fila do metrô. Kátia Nogueira, sua delegada assistente, abre uma planilha: "Seiscentos e quarenta celulares furtados ou roubados por semana só aqui. Bicicleta, moto, mão leve na escada do metrô."','"E tem o pior: com o celular desbloqueado eles limpam a conta da vítima pelo PIX em quinze minutos."'],
 o:[{t:'Mapear os horários e as esquinas antes de qualquer coisa',s:'Dados primeiro.',fx:{celular:-3,eq:2},set:'mapa',r:'Em uma semana, o mapa mostra onde tudo acontece: 70% dos casos em nove esquinas e três saídas de metrô, entre 17h e 20h.'},
    {t:'Ir para a rua de noite sem distintivo',s:'Sentir a cidade.',fx:{com:4,stress:5},r:'Em duas horas você vê três furtos e uma moto passando devagar demais. Um camelô te reconhece e sussurra: "Os aparelhos vão tudo pra uma galeria aqui perto."'},
    {t:'Reunir-se com o comando da PM no centro',s:'Ninguém resolve isso sozinho.',fx:{pol:4,celular:-2},r:'O Coronel Albuquerque é desconfiado, mas aceita trocar dados toda semana. "Se a Civil trouxer o mapa, a gente põe gente na esquina."'}]},
{id:'sp_lucas',st:1,loc:'centro',time:'quarta, 18h40',who:'lucas',kick:'Viralizou',t:'"Cadê a polícia?"',
 p:['Lucas, um influenciador com dois milhões de seguidores, filmou o próprio celular sendo arrancado da mão na saída do metrô São Bento. O vídeo termina com ele olhando para a câmera: "Cadê a polícia, São Paulo?". Cinco milhões de visualizações em um dia.','O secretário de Segurança te liga: "Eu preciso de uma resposta até amanhã."'],
 o:[{t:'Responder com dados e anunciar ação naquela saída do metrô',s:'Assumir a narrativa.',fx:{imp:6,stress:5,celular:-2},r:'Você grava um vídeo curto com o mapa e a nova escala. Lucas reposta: "Pelo menos responderam." Na semana seguinte, aquela saída tem 40% menos casos.'},
    {t:'Achar o autor em 48 horas',s:'Show de eficiência.',fx:{imp:5,eq:-4,celular:-1},r:'A equipe acha o rapaz de bicicleta. É a sétima passagem dele. O vídeo da prisão bomba. Os furtos no resto do centro continuam iguais.'},
    {t:'Não responder',s:'Polícia não trabalha para rede social.',fx:{imp:-7,pol:-3},r:'O vídeo segue rodando. O secretário não liga de novo, o que é pior.'}]},
{id:'sp_jairo',st:1,loc:'loja',time:'sexta, 14h20',who:'jairo',kick:'A rede',t:'A assistência técnica',

const SCN=id=>SC.find(s=>s.id===id);

function startStory(city){
  S.phase='car';UI.out=null;UI.panel=false;
  S.g={stage:0,city:city.cidade,uf:'SP',unidade:'Delegacia de Polícia de '+city.cidade,cityD:city.d,pop:city.pop,sem:1,w:0,dl:STAGES[0].weeks,ext:false,
    com:45,eq:50,pol:50,imp:50,integ:85,stress:15,idx:{},used:[],flags:{},queue:[],diary:[],focus:null,lastFocus:null,streak:0,scene:null,hist:[]};
  initIdx();nextScene();save();render();top();
}
function initIdx(){const G=S.g,st=STAGES[G.stage];G.idx={};st.metas.forEach(m=>G.idx[m.k]=100);G.hist=[]}
function stageInfo(){const G=S.g,st=STAGES[G.stage];return {nome:G.stage===0?G.unidade:st.unidade,cidade:G.stage===0?G.city:st.cidade,uf:st.uf}}
function nextScene(){
  const G=S.g,st=G.stage;
  let id=null;
  const q=G.queue.findIndex(x=>x.at<=G.w);if(q>=0){id=G.queue[q].id;G.queue.splice(q,1)}
  if(!id){const f=SC.find(s=>s.st===st&&s.first&&!G.used.includes(s.id));if(f)id=f.id}
  if(!id){const pool=SC.filter(s=>s.st===st&&!s.first&&!s.after&&!G.used.includes(s.id)&&(!s.need||G.flags[s.need]));
    const gen=SC.filter(s=>s.st==='*'&&!s.special&&!G.used.includes(s.id));
    const p=pool.length?(Math.random()<.85?pool:pool.concat(gen)):gen;if(p.length)id=pick(p).id}
  if(!id)id='familia';
  G.scene=id;G.used.push(id);
}
function choose(i){
  const G=S.g,s=SCN(G.scene),o=s.o[i];
  const before={com:G.com,eq:G.eq,pol:G.pol,imp:G.imp,integ:G.integ,stress:G.stress},ib=Object.assign({},G.idx);
  applyFx(o.fx||{});
  if(o.set){G.flags[o.set]=1;SC.filter(x=>x.after===s.id&&x.need===o.set).forEach(x=>G.queue.push({id:x.id,at:G.w+RI(1,2)}))}
  G.diary.unshift({s:G.sem,t:`${fill(s.t)} — ${o.t}.`});
  UI.out={i,r:o.r,before,ib};UI.sel=null;
  if(G.exon){endStory('exon');return}
  save();render();top();
}
function applyFx(fx){
  const G=S.g;
  for(const k in fx){
    const v=fx[k];
    if(['com','eq','pol','imp','integ','stress'].includes(k))G[k]=clamp(G[k]+v,0,100);
    else if(k==='pad'){if(Math.random()<.25+G.integ/100){G.integ=clamp(G.integ+10,0,100);UI.padOk=1}else G.exon=true}
    else if(k in G.idx)G.idx[k]=clamp(G.idx[k]+v*(v<0?(.75+G.eq/200):1),20,160);
  }
}
function endWeek(){
  const G=S.g,st=STAGES[G.stage];if(!UI.out)return;
  const f=st.focos.find(x=>x.id===G.focus);if(!f)return toast('Escolha o foco da equipe para a semana.');
  G.streak=G.focus===G.lastFocus?G.streak+1:0;G.lastFocus=G.focus;
  const div=Math.max(.55,1-.15*G.streak),fx={};
  for(const k in f.fx)fx[k]=(k in G.idx&&f.fx[k]<0)?f.fx[k]*div:f.fx[k];
  applyFx(fx);
  for(const k in G.idx)G.idx[k]=clamp(G.idx[k]+R(.4,1.2),20,160);
  G.stress=clamp(G.stress+3+(G.focus==='folga'?0:1),0,100);
  G.eq=clamp(G.eq+(G.focus==='folga'?0:-1.5),0,100);
  G.hist.push(Object.assign({},G.idx));
  G.sem++;G.w++;G.focus=null;UI.out=null;
  if(G.stress>=100){endStory('burn');return}
  if(G.integ<35&&!G.padDone){G.padDone=1;G.scene='corregedoria';G.used.push('corregedoria');save();render();top();return}
  if(G.w>=G.dl){evalStage();return}
  nextScene();save();render();top();
}
function metaRes(){const G=S.g;return STAGES[G.stage].metas.map(m=>{const red=(100-G.idx[m.k])/100;return {n:m.n,k:m.k,alvo:m.r,red,ok:red>=m.r}})}
function evalStage(){const G=S.g;G.eval={res:metaRes(),ok:metaRes().every(r=>r.ok),ext:G.ext};G.scene=null;save();render();top()}
function afterEval(){
  const G=S.g,E=G.eval;G.eval=null;
  if(E.ok){
    if(G.stage===2){endStory('win');return}
    G.stage++;G.w=0;G.dl=STAGES[G.stage].weeks;G.ext=false;G.queue=[];G.streak=0;G.lastFocus=null;
    G.com=50;G.pol=50;G.eq=Math.max(G.eq,45);G.stress=Math.min(G.stress,40);
    initIdx();nextScene();save();render();top();return}
  if(!G.ext){G.ext=true;G.dl+=4;nextScene();save();render();top();return}
  endStory(G.stage===2?'exon_gov':'estag');
}
function endStory(kind){
  const G=S.g;S.fim={kind,stage:G.stage,sem:G.sem,integ:G.integ};
  S.fim.score=Math.round(G.stage*150+(kind==='win'?250:0)+G.integ+G.com-(kind==='exon'?100:0));
  const b=+store.get(BEST)||0;if(S.fim.score>b)store.set(BEST,String(S.fim.score));
  S.phase='fim';save();render();top();
}

  const C=S.c,left=C.blocos-usedB();
  let h=sysbar(`Portal do Candidato › Preparação`,`Mês ${C.mes} de ${C.meses}`)+'<div class="wrap">'+steps(0);
  h+=`<div class="ttl"><div><h1>Plano de estudos</h1><div class="sub">Prova objetiva em ${C.meses-C.mes+1} ${C.meses-C.mes+1===1?'mês':'meses'}</div></div></div>`;
  h+=`<div class="pn"><div class="kv k4"><div><label>Energia</label><b class="${C.en<35?'er':''}">${f0(C.en)}/100</b></div><div><label>Reserva financeira</label><b class="${C.money<0?'er':''}">${money(C.money)}</b></div><div><label>Blocos no mês</label><b>${C.blocos}</b></div><div><label>Tentativa</label><b>${C.tent}ª</b></div></div></div>`;
  if(C.ev){const e=STEV.find(x=>x.id===C.ev);h+=`<div class="pn"><h3>Ocorrência do mês</h3><div class="pb"><b>${e.t}</b><p class="sm" style="margin:4px 0 10px;color:var(--tx2)">${e.d}</p>${e.o.map((o,i)=>`<button class="ro" data-a="sev" data-v="${i}"><i></i><div><b>${o.t}</b>${o.s?`<span>${o.s}</span>`:''}</div></button>`).join('')}</div></div>`}
  h+=`<div class="pn"><h3>Distribuição de blocos <span class="${left?'wa':''}">${left?left+' bloco(s) a distribuir':'distribuição completa'}</span></h3>${ATV.map(a=>{const n=C.alloc[a.id]||0,k=C.k[a.id];return `<div class="al"><div><div class="b sm">${a.nome}</div><div class="xs mu">${k!==undefined?`Domínio: ${f0(k)}/100`:a.id==='treino'?`Condicionamento: ${f0(C.fit)}/100`:a.id==='trab'?'Custo de vida: R$ 2,2 mil/mês':'Recupera energia'}</div></div><div class="stp"><button data-a="al" data-v="${a.id}:-1" ${n?'':'disabled'}>−</button><span>${n}</span><button data-a="al" data-v="${a.id}:1" ${left?'':'disabled'}>+</button></div></div>`}).join('')}</div>`;
  h+=`<div class="pn"><h3>Histórico</h3><div class="tw"><table>${C.log.slice(0,6).map(l=>`<tr><td class="sm">${esc(l)}</td></tr>`).join('')}</table></div></div></div>`;
  h+=`<div class="foot"><div><div class="inf">Média de domínio: <b>${f0(MAT.reduce((a,m)=>a+C.k[m.id],0)/MAT.length)}/100</b></div><button class="btn" data-a="mes" ${C.ev?'disabled':''}>${C.mes===C.meses?'Ir para a prova':'Concluir mês'}</button></div></div>`;
  return h;
}
const fmtT=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function vObj(){
  const E=S.ex,q=QB[E.qs[E.i]],a=E.ans[E.i],left=Math.max(0,E.dl-Date.now());
  let h=sysbar('Portal do Candidato › Prova objetiva',`Questão ${E.i+1}/${E.qs.length}`)+'<div class="wrap">'+steps(1);
  h+=`<div class="pn"><h3>Questão ${String(E.i+1).padStart(2,'0')} <span>${MAT.find(m=>m.id===q.m).nome}</span></h3><div class="pb">`;
  if(!E.shown)h+=`<div class="clock ${left<10000?'low':''}" id="tx"><b id="tt">${fmtT(left)}</b><div class="bar"><div id="tb" style="width:${left/450}%"></div></div></div>`;
  h+=`<p style="font-size:15px;font-weight:500;margin:0 0 12px">${esc(q.q)}</p>${q.o.map((o,i)=>`<button class="opt ${E.shown?(i===q.c?'c':i===a?'w':''):''}" data-a="qa" data-v="${i}" ${E.shown?'disabled style="opacity:1"':''}><span class="L">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}`;
  if(E.shown)h+=`<div class="alert ${a===q.c?'ok':'er'}" style="margin:8px 0 0"><div><b>${a===q.c?'Resposta correta':a===-1?'Tempo esgotado':'Resposta incorreta'}</b>Fundamento: ${esc(q.f)}</div></div>`;
  h+='</div></div></div>';
  if(E.shown)h+=`<div class="foot"><div><div class="inf">Acertos até aqui: <b>${E.qs.slice(0,E.i+1).filter((x,k)=>E.ans[k]===QB[x].c).length}</b></div><button class="btn" data-a="qn">${E.i+1<E.qs.length?'Próxima questão':'Entregar prova'}</button></div></div>`;
  return h;
}
function vObjRes(){
  const E=S.ex,ok=E.nota>=55;

  <div class="foot"><div><div class="inf">${ok?'Próxima etapa: prova discursiva (6 minutos).':'Novo concurso em 6 meses.'}</div><button class="btn" data-a="${ok?'todisc':'retry'}">${ok?'Prosseguir':'Recomeçar estudos'}</button></div></div>`;
}
function vDisc(){

  <div class="pn"><h3>Resposta</h3><div class="pb"><div class="clock ${left<60000?'low':''}" id="tx"><b id="tt">${fmtT(left)}</b><div class="bar"><div id="tb" style="width:${left/3600}%"></div></div></div><textarea id="ans" placeholder="Excelentíssimo(a) Senhor(a) Juiz(a) de Direito...">${esc(UI.ans)}</textarea></div></div><p class="note">A banca avalia base legal, requisitos da prisão preventiva, adequação aos fatos e estrutura da peça.</p></div>
  <div class="foot"><div><div class="inf">Entrega automática ao fim do tempo.</div><button class="btn" data-a="discok">Entregar peça</button></div></div>`;
}
function vTaf(){
  const T=S.taf;
  return sysbar('Portal do Candidato › TAF','Teste de aptidão física')+`<div class="wrap">${steps(3)}<div class="pn"><h3>Provas físicas <span>caráter eliminatório</span></h3><div class="tw"><table><tr><th>Prova</th><th>Mínimo</th><th class="n">Resultado</th><th>Situação</th></tr>${T.res.map((r,i)=>`<tr><td class="b">${r.n}</td><td class="mono">${r.min}</td><td class="n">${i<T.i?r.v:'—'}</td><td>${i<T.i?`<span class="bd ${r.ok?'ok':'er'}">${r.ok?'Apto':'Inapto'}</span>`:'<span class="bd">Aguardando</span>'}</td></tr>`).join('')}</table></div></div></div>
  <div class="foot"><div><div class="inf">${T.i>=T.res.length?(T.ok?'Apto(a) no TAF.':'Inapto(a): eliminado(a) do certame.'):'Execute as provas na ordem.'}</div><button class="btn" data-a="${T.i<T.res.length?'tafn':T.ok?'tooral':'retry'}">${T.i<T.res.length?'Executar prova':T.ok?'Prosseguir':'Recomeçar estudos'}</button></div></div>`;
}

  <div class="foot"><div><div class="inf"></div><button class="btn" data-a="${N.ok?'toacad':'retry'}">${N.ok?'Academia de Polícia':'Recomeçar estudos'}</button></div></div>`;

  <div class="pn"><div class="tw"><table><tr><th>Unidade</th><th>População</th><th></th></tr>${av.map((c,i)=>`<tr><td><div class="b">DP de ${c.cidade} (SP)</div><div class="xs mu">${c.d}</div></td><td class="mono sm">${c.pop}</td><td><button class="btn sm" data-a="lot" data-v="${i}">Escolher</button></td></tr>`).join('')}</table></div></div></div>`;

/* ---------- carreira: telas da história ---------- */
const STAT=[['com','Comunidade'],['eq','Equipe'],['pol','Política'],['imp','Imprensa'],['integ','Integridade'],['stress','Estresse']];
function hud(){
  const G=S.g,si=stageInfo();
  return `<header class="hud"><div class="hl"><span class="hseal">${SEAL_S}</span><div><b>Distintivo</b><span>${esc(si.cidade)} (${si.uf}) · semana ${G.w+1} de ${G.dl}</span></div></div><button class="hbtn" data-a="panel">Painel</button></header>`;
}
function person(id){
  if(!id)return '';const p=PEOPLE[id];
  return `<div class="pers"><span class="pface">${face(p.n,!!p.f)}</span><div><b>${esc(p.n)}</b><span>${esc(p.r)}</span></div></div>`;
}
function metaBars(){
  const G=S.g;return metaRes().map(m=>{const pr=clamp(m.red/m.alvo*100,0,100);return `<div class="mb"><div class="mbh"><span>${m.n}</span><b class="${m.ok?'ok':''}">${m.red>=0?'−':'+'}${f1(Math.abs(m.red*100))}% <i>/ meta −${Math.round(m.alvo*100)}%</i></b></div><div class="mbb"><div style="width:${pr}%;background:${m.ok?'#3FB27F':'#E0A33A'}"></div></div></div>`}).join('');
}
function deltas(before,ib){
  const G=S.g,out=[];
  STAT.forEach(([k,n])=>{const d=G[k]-before[k];if(Math.abs(d)>=.5){const good=k==='stress'?d<0:d>0;out.push(`<span class="dt ${good?'up':'dn'}">${n} ${d>0?'+':'−'}${f0(Math.abs(d))}</span>`)}});
  for(const k in G.idx){const d=G.idx[k]-ib[k];if(Math.abs(d)>=.5){const m=STAGES[G.stage].metas.find(x=>x.k===k);out.push(`<span class="dt ${d<0?'up':'dn'}">${m.n} ${d<0?'↓':'↑'}${f0(Math.abs(d))}%</span>`)}}
  return out.join('')||'<span class="dt">Sem efeito imediato</span>';
}
function vScene(){
  const G=S.g,s=SCN(G.scene);
  let h=hud()+`<article class="scene"><figure class="art">${art(s.loc,G.sem)}<figcaption>${esc(fill(s.time||''))}</figcaption></figure><div class="sb">`;
  h+=`<div class="kick">${esc(s.kick)}</div><h1 class="stt">${esc(fill(s.t))}</h1>${person(s.who)}`;
  if(UI.out){
    const o=s.o[UI.out.i];
    h+=`<div class="chosen">Sua decisão: <b>${esc(o.t)}</b></div><div class="txt">${s.id==='corregedoria'?`<p>${UI.padOk?'A comissão conclui pela aplicação de advertência. Você segue no cargo, mas agora todos sabem que estão de olho.':''}</p>`:`<p>${esc(fill(UI.out.r))}</p>`}</div>`;
    h+=`<div class="dts">${deltas(UI.out.before,UI.out.ib)}</div>`;
    const st=STAGES[G.stage];
    h+=`<div class="focus"><div class="kick" style="color:#9AA3B2">Foco da equipe nesta semana</div><div class="fg">${st.focos.map(f=>`<button class="fc ${G.focus===f.id?'on':''}" data-a="foco" data-v="${f.id}"><b>${f.n}</b><span>${f.d}</span>${G.lastFocus===f.id&&f.id!=='folga'?'<em>repetir rende menos</em>':''}</button>`).join('')}</div></div>`;
    h+=`</div></article><div class="sfoot"><button class="sbtn" data-a="week" ${G.focus?'':'disabled'}>${G.focus?'Encerrar a semana':'Escolha o foco da semana'}</button></div>`;
    return h;
  }
  h+=`<div class="txt">${s.p.map(p=>`<p>${esc(fill(p))}</p>`).join('')}</div><div class="chs">${s.o.map((o,i)=>`<button class="ch" data-a="pick" data-v="${i}"><b>${esc(fill(o.t))}</b>${o.s?`<span>${esc(o.s)}</span>`:''}</button>`).join('')}</div></div></article>`;
  return h;
}
function vPanel(){
  const G=S.g,si=stageInfo(),st=STAGES[G.stage];
  let h=`<div class="panelw"><div class="ph"><div><div class="kick">${esc(st.cargo)}</div><h2>${esc(si.nome)}</h2><span>${esc(si.cidade)} (${si.uf}) · semana ${G.w} de ${G.dl}${G.ext?' · prazo prorrogado':''}</span></div><button class="hbtn" data-a="panel">Fechar</button></div>`;
  h+=`<div class="psec"><div class="kick">Metas da etapa</div>${metaBars()}</div>`;
  h+=`<div class="psec"><div class="kick">Situação</div>${STAT.map(([k,n])=>`<div class="mb"><div class="mbh"><span>${n}</span><b>${f0(G[k])}</b></div><div class="mbb"><div style="width:${G[k]}%;background:${k==='stress'?(G[k]>75?'#E5484D':'#E0A33A'):k==='integ'&&G[k]<40?'#E5484D':'#6F8FD6'}"></div></div></div>`).join('')}<p class="pn2">Equipe forte rende mais nas ações. Estresse em 100 encerra a carreira. Integridade baixa chama a Corregedoria.</p></div>`;
  h+=`<div class="psec"><div class="kick">Diário</div>${G.diary.slice(0,10).map(d=>`<div class="dd"><span>S${d.s}</span>${esc(d.t)}</div>`).join('')||'<div class="pn2">Ainda vazio.</div>'}</div>`;
  h+=`<p class="pn2" style="padding:0 18px 30px">Índices simulados pelo jogo, inspirados em problemas reais da segurança pública. Pessoas e casos são fictícios.</p></div>`;
  return h;
}
function vEval(){
  const G=S.g,E=G.eval,si=stageInfo();
  const nxt=['Promoção a Delegado(a) Seccional e remoção para o centro de São Paulo, onde o furto e o roubo de celular viraram a principal queixa da cidade.','O governador do Rio de Janeiro quer você no comando da Polícia Civil fluminense.',''];
  let h=hud()+`<article class="scene"><figure class="art">${art(G.stage===2?'palacio':'gabinete',7)}<figcaption>Avaliação de desempenho</figcaption></figure><div class="sb"><div class="kick">Fim da etapa</div><h1 class="stt">${E.ok?'Metas cumpridas':!E.ext?'Ainda não':'O prazo acabou'}</h1>`;
  h+=`<div class="evm">${E.res.map(r=>`<div class="mb"><div class="mbh"><span>${r.n}</span><b class="${r.ok?'ok':'bad'}">${r.red>=0?'−':'+'}${f1(Math.abs(r.red*100))}% <i>/ meta −${Math.round(r.alvo*100)}%</i></b></div><div class="mbb"><div style="width:${clamp(r.red/r.alvo*100,0,100)}%;background:${r.ok?'#3FB27F':'#E5484D'}"></div></div></div>`).join('')}</div>`;
  h+=`<div class="txt"><p>${E.ok?(G.stage===2?'Os números do Rio caíram sob o seu comando.':nxt[G.stage]):!E.ext?`A chefia concede mais 4 semanas em ${esc(si.cidade)} para você recuperar os indicadores.`:G.stage===2?'O governador decide trocar o comando da Polícia Civil.':'Sua carreira fica parada nesta unidade.'}</p></div></div></article><div class="sfoot"><button class="sbtn" data-a="aval">${E.ok?(G.stage===2?'Ver o desfecho':'Seguir em frente'):!E.ext?'Voltar ao trabalho':'Ver o desfecho'}</button></div>`;
  return h;
}
function vFim(){
  const F=S.fim,T={win:['Missão cumprida','Do casarão alugado ao lado da rodoviária ao comando da Polícia Civil do Rio. A letalidade caiu, a polícia matou menos e prendeu melhor. Seu nome vira referência.','orla'],

function vStory(){
  const G=S.g;
  if(UI.panel)return vPanel();
  if(G.eval)return vEval();
  return vScene();
}

function render(){
  let h='';
  if(UI.screen==='cover')h=vCover();else if(UI.screen==='setup')h=vSetup();
  else switch(S.phase){
    case 'estudo':h=vEstudo();break;case 'objetiva':h=vObj();break;case 'objres':h=vObjRes();break;case 'disc':h=vDisc();break;
    case 'taf':h=vTaf();break;case 'oral':h=vOral();break;case 'resultado':h=vResultado();break;case 'acad':h=vAcad();break;case 'lot':h=vLot();break;
    case 'car':h=vStory();break;case 'fim':h=vFim();break;
  }
  if(UI.toast)h+=`<div class="toast">${esc(UI.toast)}</div>`;
  $.innerHTML=h;document.body.classList.toggle('dark',!!(S&&UI.screen!=='cover'&&UI.screen!=='setup'&&(S.phase==='car'||S.phase==='fim')));
}
setInterval(()=>{
  if(!S)return;let dl,tot;
  if(S.phase==='objetiva'&&!S.ex.shown){dl=S.ex.dl;tot=45000}else if(S.phase==='disc'&&!S.disc.res){dl=S.disc.dl;tot=360000}else return;
  const left=Math.max(0,dl-Date.now()),t=document.getElementById('tt'),b=document.getElementById('tb'),x=document.getElementById('tx');
  if(t)t.textContent=fmtT(left);if(b)b.style.width=(left/tot*100)+'%';if(x)x.classList.toggle('low',left<(tot>60000?60000:10000));
  if(left<=0){if(S.phase==='objetiva'){S.ex.ans[S.ex.i]=-1;S.ex.shown=true}else{S.disc.res=gradeDisc(UI.ans);S.notas.disc=S.disc.res.s}save();render()}
},250);

function act(a,v){
  switch(a){
    case 'new':UI.screen='setup';UI.setup.nome='';render();top();break;
    case 'cover':UI.screen='cover';render();top();break;
    case 'continue':S=load();if(S){UI.screen='game';UI.out=null;UI.panel=false;if(S.phase==='car'&&S.g&&S.g.focus===undefined)S.g.focus=null;render()}break;
    case 'sx':UI.setup.sexo=v;render();break;
    case 'fd':UI.setup.fundo=v;render();break;
    case 'inscr':{const n=(UI.setup.nome||'').trim();if(n.length<3)return toast('Informe o nome completo.');newStudy(n,UI.setup.fundo,UI.setup.sexo);UI.screen='game';save();render();top();break}
    case 'al':{const [id,d]=v.split(':'),C=S.c;C.alloc[id]=clamp((C.alloc[id]||0)+(+d),0,C.blocos);if(usedB()>C.blocos)C.alloc[id]--;save();render();break}
    case 'sev':{const C=S.c,e=STEV.find(x=>x.id===C.ev);C.log.unshift(`${e.t}: ${e.o[+v].f(C)}`);C.ev=null;save();render();break}
    case 'mes':studyMonth();break;
    case 'qa':if(!S.ex.shown){S.ex.ans[S.ex.i]=+v;S.ex.shown=true;save();render()}break;
    case 'qn':{const E=S.ex;E.i++;E.shown=false;E.dl=Date.now()+45000;if(E.i>=E.qs.length)finishObj();save();render();top();break}
    case 'todisc':S.phase='disc';S.disc={dl:Date.now()+360000};UI.ans='';save();render();top();break;
    case 'discok':S.disc.res=gradeDisc(UI.ans);S.notas.disc=S.disc.res.s;save();render();top();break;
    case 'totaf':runTAF();save();render();top();break;
    case 'tafn':S.taf.i++;save();render();break;
    case 'tooral':S.phase='oral';S.oral={qs:shuffle(ORAL).slice(0,3),i:0,ans:[],ord:shuffle([0,1,2])};save();render();top();break;
    case 'or':{const O=S.oral;O.ans.push(O.qs[O.i].o[+v][1]);O.i++;O.ord=shuffle([0,1,2]);if(O.i>=O.qs.length)finishOral();save();render();top();break}
    case 'retry':{const C=S.c;C.mes=1;C.meses=6;C.tent++;C.en=Math.max(C.en,70);C.log.unshift(`Novo edital publicado. Tentativa ${C.tent}.`);S.phase='estudo';autoAlloc();delete S.ex;delete S.notas;save();render();top();break}
    case 'toacad':S.phase='acad';save();render();top();break;
    case 'ac':S.bonus={inv:v==='inv'?.12:0,int:v==='int'?.08:0,ges:v==='ges'?.1:0};S.phase='lot';save();render();top();break;
    case 'lot':startStory(S.lotOpts[+v]);break;
    case 'pick':choose(+v);break;
    case 'foco':S.g.focus=v;save();render();break;
    case 'week':endWeek();break;
    case 'panel':UI.panel=!UI.panel;render();top();break;
    case 'aval':afterEval();break;
  }
}
$.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b.dataset.v)});
$.addEventListener('input',e=>{if(e.target.id==='nm')UI.setup.nome=e.target.value;if(e.target.id==='ans')UI.ans=e.target.value});
window.__dist={get S(){return S},UI,act,QB,STAGES,SC};
render();
})();
</script>
